<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Demander devis</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 16px;
         background: #f7f7f7; color: #262633; }
  h3 { margin: 0 0 4px; font-size: 15px; }
  .entreprise { font-weight: 600; color: #16b378; }
  #recap { font-size: 13px; margin: 10px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; margin: 8px 0; }
  th, td { border: 1px solid #d9d9d9; padding: 4px 6px; text-align: left; }
  th { background: #eee; }
  td.num { text-align: right; }
  button { background: #16b378; color: #fff; border: none; border-radius: 4px;
           padding: 10px 18px; font-size: 14px; cursor: pointer; }
  button:disabled { background: #bbb; cursor: default; }
  #status { margin-top: 10px; font-size: 13px; min-height: 18px; }
  .ok { color: #16b378; } .err { color: #d0021b; } .warn { color: #b8860b; }

  .header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .gear {
    background: #eee; border: 1px solid #d9d9d9; border-radius: 4px; cursor: pointer;
    font-size: 14px; line-height: 1; padding: 4px 7px; opacity: .7; flex-shrink: 0;
  }
  .gear:hover { opacity: 1; }
  .config-panel {
    display: none; background: #fff; border: 1px solid #d9d9d9; border-radius: 6px;
    padding: 10px; margin-bottom: 10px; font-size: 12px;
  }
  .config-panel input {
    width: 100%; padding: 5px 7px; border: 1px solid #d9d9d9; border-radius: 4px;
    font-size: 12px; margin: 6px 0 8px; box-sizing: border-box;
  }
  .config-panel button.secondary { background: #bbb; }
</style>
</head>
<body>
  <div class="header">
    <h3>Demande de devis — <span class="entreprise" id="ent">…</span></h3>
    <button id="btn-gear" class="gear" title="Configuration">⚙ Configuration</button>
  </div>

  <div id="config-panel" class="config-panel">
    <b>Configuration</b> — URL du flux Power Automate (jamais stockée dans le dépôt Git, seulement dans ce document Grist) :
    <input id="config-url" type="text" placeholder="https://…invoke?api-version=1&sp=…&sv=1.0&sig=…" />
    <button id="config-save">Enregistrer</button>
    <button id="config-cancel" class="secondary">Annuler</button>
  </div>

  <div id="recap">Sélectionne une entreprise.</div>
  <button id="btn" disabled>📧 Demander le devis</button>
  <div id="status"></div>

<script>
// URL du flux Power Automate — stockée dans les options du widget (côté document
// Grist), jamais en dur dans ce fichier : ce dépôt est public sur GitHub, et cette
// URL contient un jeton d'authentification (paramètre sig=…) qui suffirait à
// n'importe qui pour déclencher cet envoi de mail.
let webhookUrl = '';

let entreprise = null;   // { id, nom }
let lignes = [];         // aperçu courant
let idsEcrits = [], idsOraux = [];

grist.ready({ requiredAccess: 'full', onEditOptions: openConfigPanel });

grist.onOptions((options) => {
  webhookUrl = options?.webhookUrl || '';
  if (entreprise) rafraichir();
});

function openConfigPanel() {
  document.getElementById('config-url').value = webhookUrl;
  document.getElementById('config-panel').style.display = 'block';
}
document.getElementById('btn-gear').addEventListener('click', openConfigPanel);
document.getElementById('config-cancel').addEventListener('click', () => {
  document.getElementById('config-panel').style.display = 'none';
});
document.getElementById('config-save').addEventListener('click', () => {
  const val = document.getElementById('config-url').value.trim();
  grist.setOption('webhookUrl', val);
  webhookUrl = val;
  document.getElementById('config-panel').style.display = 'none';
  if (entreprise) rafraichir();
});

// Widget lié à la table Entreprises (Select by : sélecteur de la page)
grist.onRecord(async rec => {
  entreprise = rec ? { id: rec.id, nom: rec.Denomination || '' } : null;
  await rafraichir();
});

async function rafraichir() {
  const btn = document.getElementById('btn');
  const recap = document.getElementById('recap');
  document.getElementById('status').textContent = '';
  if (!entreprise) {
    document.getElementById('ent').textContent = '…';
    recap.textContent = 'Sélectionne une entreprise.';
    btn.disabled = true;
    return;
  }
  document.getElementById('ent').textContent = entreprise.nom;

  const [ecrits, oraux, candidats, qualifs] = await Promise.all([
    grist.docApi.fetchTable('Examens_ecrits'),
    grist.docApi.fetchTable('Examens_oraux'),
    grist.docApi.fetchTable('Candidats'),
    grist.docApi.fetchTable('Qualifications_List'),
  ]);

  const nomCandidat = id => {
    const i = candidats.id.indexOf(id);
    return i >= 0 ? `${candidats.Last_Name[i]} ${candidats.First_Name[i]}` : '?';
  };
  const codeQualif = id => {
    const i = qualifs.id.indexOf(id);
    return i >= 0 ? qualifs.Qualification_code[i] : '?';
  };

  lignes = []; idsEcrits = []; idsOraux = [];

  ecrits.id.forEach((rid, i) => {
    if (ecrits.Denomination[i] === entreprise.id
        && !ecrits.Devis_CT[i] && !ecrits.code_devis[i]) {
      idsEcrits.push(rid);
      lignes.push({
        nom: nomCandidat(ecrits.Candidat[i]),
        qualifications: codeQualif(ecrits.Qualification[i]) + ' (écrit)',
        montant: ecrits.Montant[i] || 0,
      });
    }
  });

  oraux.id.forEach((rid, i) => {
    if (oraux.Denomination[i] === entreprise.id
        && !oraux.Devis_CT[i] && !oraux.code_devis[i]) {
      idsOraux.push(rid);
      const raw = oraux.Qualifications[i];
      const qs = Array.isArray(raw) ? raw.slice(1) : []; // ["L", id, id…]
      lignes.push({
        nom: nomCandidat(oraux.Candidat[i]),
        qualifications: qs.map(codeQualif).join(', ') + ' (oral)',
        montant: oraux.Montant[i] || 0,
      });
    }
  });

  if (!lignes.length) {
    recap.innerHTML = '<span class="warn">Aucun examen sans devis pour cette entreprise.</span>';
    btn.disabled = true;
    return;
  }

  const total = lignes.reduce((s, l) => s + l.montant, 0);
  recap.innerHTML =
    `<b>${lignes.length}</b> examen(s) sans devis :` +
    '<table><tr><th>Nom</th><th>Qualifications</th><th>Montant</th></tr>' +
    lignes.map(l => `<tr><td>${l.nom}</td><td>${l.qualifications}</td>` +
                    `<td class="num">${l.montant.toFixed(2)} €</td></tr>`).join('') +
    `<tr><th colspan="2">Total</th><th class="num">${total.toFixed(2)} €</th></tr></table>` +
    (webhookUrl ? '' : '<div class="warn">⚠️ URL du flux Power Automate non configurée — clique sur ⚙ ci-dessus.</div>');
  btn.disabled = !webhookUrl;
}

document.getElementById('btn').addEventListener('click', async () => {
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  if (!entreprise || !lignes.length || !webhookUrl) return;

  btn.disabled = true;
  status.textContent = 'Envoi en cours…';
  status.className = '';

  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const code = entreprise.nom.replace(/\s+/g, '').toUpperCase().slice(0, 3)
    + `-${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}`
    + `-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
  const total = lignes.reduce((s, l) => s + l.montant, 0);

  // Table HTML prête à insérer dans le mail (styles inline pour Outlook)
  const td = 'border:1px solid #999;padding:4px 8px;';
  const tableauHtml =
    '<table style="border-collapse:collapse;font-family:Segoe UI,Arial,sans-serif;font-size:13px;">' +
    '<tr>' +
    `<th style="${td}background:#eee;text-align:left;">Nom</th>` +
    `<th style="${td}background:#eee;text-align:left;">Qualifications</th>` +
    `<th style="${td}background:#eee;text-align:right;">Montant</th>` +
    '</tr>' +
    lignes.map(l =>
      '<tr>' +
      `<td style="${td}">${l.nom}</td>` +
      `<td style="${td}">${l.qualifications}</td>` +
      `<td style="${td}text-align:right;">${l.montant.toFixed(2)} €</td>` +
      '</tr>').join('') +
    '<tr>' +
    `<th colspan="2" style="${td}background:#eee;text-align:left;">Total</th>` +
    `<th style="${td}background:#eee;text-align:right;">${total.toFixed(2)} €</th>` +
    '</tr></table>';

  try {
    const resp = await fetch(webhookUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        entreprise: entreprise.nom,
        code: code,
        lignes: lignes,
        total: total,
        tableau_html: tableauHtml,
      }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    // Tampon uniquement après envoi réussi
    const actions = [];
    if (idsEcrits.length) actions.push(
      ['BulkUpdateRecord', 'Examens_ecrits', idsEcrits,
       { code_devis: idsEcrits.map(() => code) }]);
    if (idsOraux.length) actions.push(
      ['BulkUpdateRecord', 'Examens_oraux', idsOraux,
       { code_devis: idsOraux.map(() => code) }]);
    actions.push(
      ['AddRecord', 'Demandes_devis_examens', null, {
        Entreprise: entreprise.id,
        code: code,
        date_envoi: Math.floor(Date.now() / 1000),
        nb_lignes: lignes.length,
        total: total,
      }]);
    await grist.docApi.applyUserActions(actions);

    status.textContent = `✅ Mail envoyé — code ${code}`;
    status.className = 'ok';
    await new Promise(r => setTimeout(r, 500));  // tempo 1 s
    await rafraichir();
  } catch (e) {
    status.textContent = '❌ Échec de l\'envoi : ' + e.message +
      ' — aucun examen n\'a été modifié.';
    status.className = 'err';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
