<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planning — Examens écrits</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #1e293b;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #f8fafc;
    }

    /* ── Barre d'outils ── */
    .toolbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      background: #1e3a8a;
      color: #fff;
    }
    .session-label {
      font-size: 12px;
      font-weight: 600;
      color: #bfdbfe;
    }
    .btn {
      padding: 5px 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn-calc { background: #f59e0b; color: #1c1400; }
    .btn-calc:hover:not(:disabled) { background: #d97706; }
    .btn-send { background: #2563eb; color: #fff; }
    .btn-send:hover:not(:disabled) { background: #1d4ed8; }
    .btn-send-cand {
      margin-top: 8px;
      width: 100%;
      font-size: 11px;
      padding: 4px 8px;
    }
    .cand-name.warn { color: #f87171; }

    .gear {
      background: rgba(255,255,255,.18);
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      border-radius: 5px;
      padding: 5px 9px;
      opacity: .85;
    }
    .gear:hover { opacity: 1; background: rgba(255,255,255,.3); }
    .config-panel {
      display: none;
      position: absolute;
      top: 42px;
      right: 12px;
      z-index: 40;
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 10px;
      width: 320px;
      font-size: 12px;
      color: #1e293b;
      box-shadow: 0 4px 14px rgba(0,0,0,.15);
    }
    .config-panel input {
      width: 100%;
      padding: 5px 7px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 12px;
      margin: 6px 0 8px;
      box-sizing: border-box;
    }

    /* ── Message vide ── */
    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-style: italic;
      font-size: 14px;
    }
    /* Message "aucun examen" dans la grille */
    .no-exams-msg {
      padding: 20px 24px;
      color: #94a3b8;
      font-style: italic;
      font-size: 13px;
      white-space: nowrap;
    }

    /* ── Zone principale ── */
    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Wrapper scroll horizontal partagé (header + timeline) ── */
    .scroll-x {
      flex: 1;
      min-height: 0;
      overflow-x: auto;
      overflow-y: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── En-tête candidats (noms + champs heure) ── */
    .plan-hdr {
      flex-shrink: 0;
      display: flex;
      border-bottom: 2px solid #3b82f6;
      background: #fff;
    }
    .hdr-corner {
      flex-shrink: 0;
      background: #1e3a8a;
    }
    .hdr-col {
      flex-shrink: 0;
      border-right: 1px solid #e2e8f0;
      padding: 6px 8px;
      min-height: 60px;
    }
    .cand-name {
      font-weight: 700;
      font-size: 12px;
      color: #1e3a8a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .exam-input-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 3px;
    }
    .exam-qual {
      font-size: 10px;
      color: #475569;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .time-inp {
      width: 70px;
      flex-shrink: 0;
      padding: 2px 4px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 11px;
      color: #1e293b;
      background: #f8fafc;
      cursor: pointer;
    }
    .time-inp:focus { outline: 2px solid #3b82f6; border-color: transparent; }
    .time-inp.modified { border-color: #f59e0b; background: #fffbeb; }

    /* ── Timeline ── */
    .plan-tl {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: visible;
      display: flex;
      position: relative;
    }

    /* Axe des heures (sticky gauche) */
    .time-axis {
      flex-shrink: 0;
      position: sticky;
      left: 0;
      z-index: 4;
      background: #fff;
      border-right: 2px solid #93c5fd;
    }
    .hr-label {
      position: absolute;
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 2px 6px 0 0;
      font-size: 11px;
      font-weight: 700;
      color: #1e40af;
    }
    .hr-label.even { background: #eff6ff; }
    .hr-label.odd  { background: #dbeafe; }

    /* Grille d'examens */
    .exam-grid {
      position: relative;
      flex: 1;
    }
    .hr-band { position: absolute; left: 0; right: 0; pointer-events: none; }
    .hr-band.even { background: #f5f9ff; }
    .hr-band.odd  { background: #eaf2ff; }
    .hr-line { position: absolute; left: 0; right: 0; height: 1px; background: #bfdbfe; pointer-events: none; }
    .hr-line-half { position: absolute; left: 0; right: 0; height: 1px; background: #dbeafe; opacity: .6; pointer-events: none; }
    .col-sep { position: absolute; top: 0; bottom: 0; width: 1px; background: #cbd5e1; pointer-events: none; }
    .marker-line { position: absolute; left: 0; right: 0; height: 2px; pointer-events: none; z-index: 3; }

    /* Blocs examen */
    .exam-block {
      position: absolute;
      border-radius: 5px;
      border-left: 4px solid;
      padding: 3px 5px;
      overflow: hidden;
      z-index: 2;
      cursor: default;
      display: flex;
      align-items: flex-start;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.3;
    }
    .block-qual {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Ligne "maintenant" */
    .now-line {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: #ef4444;
      z-index: 5;
      pointer-events: none;
    }

    /* ── Pied de page ── */
    .footer {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      background: #f1f5f9;
      border-top: 1px solid #e2e8f0;
    }
    .statusbar {
      font-size: 11px;
      color: #64748b;
      flex: 1;
    }
    .statusbar.ok    { color: #059669; }
    .statusbar.error { color: #b91c1c; }
  </style>
</head>
<body>

<div class="toolbar" style="position:relative">
  <span class="session-label" id="session-label">—</span>
  <div style="flex:1"></div>
  <button class="btn btn-calc" id="btn-calc" disabled>⚡ Calculer les horaires</button>
  <button class="gear" id="btn-gear" title="Configuration">⚙</button>

  <div id="config-panel" class="config-panel">
    <b>Configuration</b> — URL du flux Power Automate (jamais stockée dans le dépôt Git, seulement dans ce document Grist) :
    <input id="config-url" type="text" placeholder="https://…invoke?api-version=1&sp=…&sv=1.0&sig=…" />
    <button id="config-save" class="btn btn-send">Enregistrer</button>
    <button id="config-cancel" class="btn" style="background:#94a3b8;color:#fff">Annuler</button>
  </div>
</div>

<div class="main" id="main">
  <div class="empty" id="empty">Sélectionnez une session d'examen.</div>

  <div class="scroll-x" id="scroll-x" style="display:none">
    <div class="plan-hdr" id="plan-hdr"></div>
    <div class="plan-tl"  id="plan-tl"></div>
  </div>
</div>

<div class="footer">
  <span class="statusbar" id="statusbar"></span>
</div>

<script>
  /* ──────────────────────────────────────────
     Constantes
  ────────────────────────────────────────── */
  const PX_PER_MIN     = 1;
  const COL_W          = 180;          // px par colonne candidat
  const TIME_W         = 52;           // px pour l'axe des heures
  const HOUR_START     = 9;            // 09:00
  const HOUR_END       = 18;           // 18:00
  const TL_START_MIN   = HOUR_START * 60;
  const TL_HEIGHT      = (HOUR_END - HOUR_START) * 60 * PX_PER_MIN;

  const MORNING_START  = 9 * 60 + 30;  // 09h30
  const MORNING_END    = 12 * 60 + 30; // 12h30
  const AFTERNOON_START = 13 * 60;     // 13h00

  // Couleurs par programme (fond, bordure gauche, texte)
  const PROG_STYLE = {
    PASSI:       { bg: '#dbeafe', brd: '#2563eb', txt: '#1e3a8a' },
    PACS:        { bg: '#d1fae5', brd: '#059669', txt: '#065f46' },
    PRIS:        { bg: '#fef3c7', brd: '#d97706', txt: '#78350f' },
    PDIS:        { bg: '#ede9fe', brd: '#7c3aed', txt: '#4c1d95' },
    PAMS:        { bg: '#fee2e2', brd: '#dc2626', txt: '#7f1d1d' },
    SECNUMCLOUD: { bg: '#cffafe', brd: '#0891b2', txt: '#164e63' },
    DEFAULT:     { bg: '#f1f5f9', brd: '#94a3b8', txt: '#334155' },
  };

  /* ──────────────────────────────────────────
     État
  ────────────────────────────────────────── */
  let selectedSession = null;   // { id, num, date, lieu, centreNom, centreAdresse, surveillantEmail, surveillantNom }
  let exams           = [];     // { id, candidatId, entrepriseId, qual, duration, dateHeure, programme, convocationEnvoyee }
  let candidateMap    = new Map(); // candId → { firstName, lastName, email }
  let entContactMap   = new Map(); // entrepriseId → { email, nom } (responsable examens)
  let candidateSend   = new Map(); // candId → résultat de computeCandidateSend (recalculé à chaque buildHeader)
  let currentReqId    = 0;      // anti-race : chaque clic reçoit un id unique

  // URL du flux Power Automate — stockée dans les options du widget (côté document
  // Grist), jamais en dur dans ce fichier : ce dépôt est public sur GitHub, et cette
  // URL contient un jeton d'authentification qui suffirait à n'importe qui pour
  // déclencher l'envoi d'une convocation.
  let webhookUrl = '';

  /* ──────────────────────────────────────────
     API Grist — lié à Sessions_examens_ecrits
  ────────────────────────────────────────── */
  grist.ready({ requiredAccess: 'full', onEditOptions: openConfigPanel });

  grist.onOptions((options) => {
    webhookUrl = options?.webhookUrl || '';
    if (selectedSession) render(); // ré-évalue la disponibilité des boutons Envoyer
  });

  function openConfigPanel() {
    document.getElementById('config-url').value = webhookUrl;
    document.getElementById('config-panel').style.display = 'block';
  }
  document.getElementById('btn-gear').addEventListener('click', openConfigPanel);
  document.getElementById('config-cancel').addEventListener('click', () => {
    document.getElementById('config-panel').style.display = 'none';
  });
  document.getElementById('config-save').addEventListener('click', () => {
    const val = document.getElementById('config-url').value.trim();
    grist.setOption('webhookUrl', val);
    webhookUrl = val;
    document.getElementById('config-panel').style.display = 'none';
    if (selectedSession) render();
  });

  grist.onRecord(async rec => {
    if (!rec?.id) { showEmpty(); return; }
    // Chaque clic obtient son propre numéro ; on abandonne si un clic plus récent arrive
    const reqId  = ++currentReqId;
    const session = { id: rec.id, num: rec.num ?? rec.id, date: null, lieu: '' };

    const localExams = await loadData(session);

    // Un clic plus récent a pris la main — on ne touche plus à rien
    if (reqId !== currentReqId) return;

    selectedSession = session;
    exams           = localExams;
    render();
  });

  /* ──────────────────────────────────────────
     Chargement des données
     Reçoit l'objet session local à remplir ; retourne le tableau des examens.
     N'écrit JAMAIS dans les variables globales (selectedSession / exams).
  ────────────────────────────────────────── */
  async function loadData(session) {
    const sid       = session.id;
    const localExams = [];

    // ── Session : date + lieu + centre + surveillant via fetchTable ──
    let centreId = 0, surveillantId = 0;
    try {
      const st  = await grist.docApi.fetchTable('Sessions_examens_ecrits');
      const idx = st.id.indexOf(sid);
      console.log('[convoc] Sessions_examens_ecrits — ligne sélectionnée : idx=', idx, '  id=', sid);
      if (idx !== -1) {
        const rawDate = st.Date?.[idx] || st.date?.[idx] || st.Date_session?.[idx] || 0;
        session.date = rawDate > 0 ? rawDate : null;
        session.lieu = String(
          st.gristHelper_Display?.[idx] ?? st.Centre?.[idx] ?? st.Lieu?.[idx] ?? ''
        );
        centreId      = st.Centre?.[idx]      > 0 ? st.Centre[idx]      : 0;
        surveillantId = st.Surveillant?.[idx] > 0 ? st.Surveillant[idx] : 0;
        console.log('[convoc] date brute (ts)=', rawDate,
                    '  date affichée=', session.date ? fmtDate(session.date) : '(aucune)',
                    '  lieu=', session.lieu);
      } else {
        console.warn('[convoc] session id', sid, 'introuvable dans fetchTable');
      }
    } catch (e) { console.warn('Sessions_examens_ecrits:', e); }

    // ── Centre d'examen (nom + adresse, pour l'objet/le corps du mail) ──
    session.centreNom = '';
    session.centreAdresse = '';
    if (centreId) {
      try {
        const ce  = await grist.docApi.fetchTable('Centres_examen');
        const idx = ce.id.indexOf(centreId);
        if (idx !== -1) {
          session.centreNom = String(ce.Nom_centre_examen?.[idx] ?? '');
          session.centreAdresse = [ce.Adresse_ligne_1?.[idx], ce.Adresse_ligne_2?.[idx], ce.code_postal?.[idx], ce.Ville?.[idx]]
            .filter(Boolean).join(' ');
        }
      } catch (e) { console.warn('Centres_examen:', e); }
    }

    // ── Surveillant du centre (destinataire en copie) ──
    session.surveillantEmail     = '';
    session.surveillantNom       = '';
    session.surveillantTelephone = '';
    if (surveillantId) {
      try {
        const sv  = await grist.docApi.fetchTable('Surveillants');
        const idx = sv.id.indexOf(surveillantId);
        if (idx !== -1) {
          session.surveillantEmail     = String(sv.Courriel?.[idx]   ?? '');
          session.surveillantNom       = `${sv.Prenom?.[idx] ?? ''} ${sv.Nom?.[idx] ?? ''}`.trim();
          session.surveillantTelephone = String(sv.Telephone?.[idx] ?? '');
        }
      } catch (e) { console.warn('Surveillants:', e); }
    }

    // ── Candidats ──
    try {
      const ct = await grist.docApi.fetchTable('Candidats');
      candidateMap.clear();
      for (let i = 0; i < ct.id.length; i++) {
        const id = ct.id[i];
        if (!id || id < 0) continue;
        candidateMap.set(id, {
          firstName: String(ct.First_Name?.[i] ?? ''),
          lastName:  String(ct.Last_Name?.[i]  ?? ''),
          email:     String(ct.Courriel?.[i]   ?? ''),
        });
      }
    } catch (e) { console.warn('Candidats:', e); }

    // ── Contacts : responsable examens par entreprise (destinataire en copie) ──
    entContactMap.clear();
    try {
      const co = await grist.docApi.fetchTable('Contacts');
      for (let i = 0; i < co.id.length; i++) {
        if (!co.Responsable_examens?.[i]) continue;
        const entId = co.Entreprise?.[i];
        if (!entId || entContactMap.has(entId)) continue; // premier responsable trouvé par entreprise
        entContactMap.set(entId, {
          email: String(co.Courriel?.[i] ?? ''),
          nom:   `${co.Prenom?.[i] ?? ''} ${co.Nom?.[i] ?? ''}`.trim(),
        });
      }
    } catch (e) { console.warn('Contacts:', e); }

    // ── Examens écrits de la session ──
    try {
      const et = await grist.docApi.fetchTable('Examens_ecrits');
      for (let i = 0; i < et.id.length; i++) {
        const id = et.id[i];
        if (!id || id < 0) continue;
        if (Number(et.Sessions_examens_ecrits?.[i] ?? 0) !== Number(sid)) continue;

        localExams.push({
          id,
          candidatId:   et.Candidat?.[i]    ?? 0,
          entrepriseId: et.Denomination?.[i] > 0 ? et.Denomination[i] : 0,
          qual:         String(et.gristHelper_Display4?.[i]  ?? et.Qualification?.[i] ?? ''),
          duration:     Number(et['Duree_minutes_']?.[i] || 100),
          dateHeure:    et.date_heure?.[i] > 0 ? et.date_heure[i] : null,
          programme:    String(et.gristHelper_Display10?.[i] ?? ''),
          libelle:      String(et.gristHelper_Display?.[i]   ?? et.Libelle_examen_ecrit?.[i] ?? et.Libelle?.[i] ?? ''),
          convocationEnvoyee: String(et.convocation_envoyee?.[i] ?? ''),
        });
      }
      console.log('[convoc] examens de la session', sid, '(',  localExams.length, ') :',
                  localExams.map(e => e.libelle || e.qual || `#${e.id}`));
    } catch (e) {
      console.warn('Examens_ecrits:', e);
      showStatus('Erreur chargement : ' + e.message, 'error');
    }

    return localExams;
  }

  /* ──────────────────────────────────────────
     Rendu
  ────────────────────────────────────────── */
  function render() {
    if (!selectedSession) { showEmpty(); return; }

    document.getElementById('empty').style.display = 'none';
    document.getElementById('scroll-x').style.display = 'flex';
    // ⚡ disponible seulement si des examens existent
    document.getElementById('btn-calc').disabled = exams.length === 0;

    const dateStr = selectedSession.date ? fmtDate(selectedSession.date) : '(date inconnue)';
    const lieuStr = selectedSession.lieu ? ` à ${selectedSession.lieu}` : '';
    document.getElementById('session-label').textContent = `Session du ${dateStr}${lieuStr}`;

    // Candidats dans l'ordre d'apparition (stable)
    const candIds = [...new Map(exams.map(e => [e.candidatId, true])).keys()];

    buildHeader(candIds);
    buildTimeline(candIds);
  }

  /* ── En-tête : noms + champs heure ── */
  function buildHeader(candIds) {
    const hdr = document.getElementById('plan-hdr');
    hdr.innerHTML = '';

    // Coin
    const corner = mk('div', 'hdr-corner');
    corner.style.cssText = `width:${TIME_W}px;flex-shrink:0;`;
    hdr.appendChild(corner);

    candIds.forEach(candId => {
      const cand = candidateMap.get(candId);
      const name = cand ? `${cand.firstName} ${cand.lastName}`.trim() : `#${candId}`;
      const candExams = exams.filter(e => e.candidatId === candId)
        .sort((a, b) => (a.dateHeure ?? 0) - (b.dateHeure ?? 0));

      const col = mk('div', 'hdr-col');
      col.style.width = COL_W + 'px';

      const sendData = computeCandidateSend(candId, candExams, selectedSession);
      candidateSend.set(candId, sendData);

      const nm = mk('div', 'cand-name' + (sendData.errors.length ? ' warn' : ''));
      nm.textContent = name + (sendData.errors.length ? ' ⚠' : '');
      nm.title = name;
      col.appendChild(nm);

      candExams.forEach(exam => {
        const row = mk('div', 'exam-input-row');

        const ql = mk('span', 'exam-qual');
        ql.textContent = exam.qual || `Examen #${exam.id}`;
        ql.title = exam.qual;

        const inp = document.createElement('input');
        inp.type = 'time';
        inp.className = 'time-inp';
        inp.dataset.examId = exam.id;
        inp.value = exam.dateHeure ? tsToTime(exam.dateHeure) : '';
        inp.addEventListener('change', onTimeChange);

        row.appendChild(ql);
        row.appendChild(inp);
        col.appendChild(row);
      });

      // Bouton "Envoyer" individuel — §4.3/§4.4
      const sendBtn = document.createElement('button');
      sendBtn.className = 'btn btn-send btn-send-cand';
      const wasSentBefore = candExams.some(e => e.convocationEnvoyee);
      sendBtn.textContent = sendData.allSent ? '✅ Convocation envoyée'
        : wasSentBefore ? '🔁 Renvoyer'
        : '✉ Envoyer';
      sendBtn.disabled = sendData.errors.length > 0 || sendData.allSent || !webhookUrl;

      const titleParts = [];
      if (!webhookUrl) titleParts.push('URL du flux Power Automate non configurée (⚙)');
      titleParts.push(...sendData.errors, ...sendData.warnings);
      titleParts.push(`À : ${sendData.to || '(manquant)'}`);
      if (sendData.cc.length) titleParts.push(`Cc : ${sendData.cc.join(', ')}`);
      titleParts.push(`Objet : ${sendData.objet}`);
      sendBtn.title = titleParts.join('\n');

      sendBtn.addEventListener('click', () => sendConvocation(candId, sendBtn));
      col.appendChild(sendBtn);

      hdr.appendChild(col);
    });
  }

  /* ──────────────────────────────────────────
     Convocation — calcul par candidat (§4.3/§4.4)
  ────────────────────────────────────────── */

  // Empreinte d'un examen : sert à savoir si la convocation déjà envoyée pour
  // cet examen correspond toujours à ses données actuelles (qualification,
  // horaire, centre) — cf. §4.4, dernier point.
  function examSignature(exam, centreNom) {
    return `${exam.qual}|${exam.dateHeure ?? ''}|${centreNom || ''}`;
  }

  function computeCandidateSend(candId, candExams, session) {
    const cand = candidateMap.get(candId) || {};
    const errors = [], warnings = [];

    if (!cand.email) errors.push('E-mail du candidat manquant.');
    if (!session?.centreNom) warnings.push('Centre de session inconnu.');
    if (!session?.surveillantEmail) warnings.push('Surveillant du centre inconnu — absent de la copie.');
    if (!session?.surveillantTelephone) warnings.push('Téléphone du surveillant manquant dans le corps du mail.');
    if (candExams.some(e => !e.dateHeure)) errors.push('Horaire manquant pour au moins un examen.');

    const entId = candExams.find(e => e.entrepriseId)?.entrepriseId || 0;
    const responsable = entContactMap.get(entId) || null;
    if (!responsable) warnings.push('Aucun responsable examens trouvé pour l’entreprise — absent de la copie.');

    const to = cand.email || '';
    const cc = [session?.surveillantEmail, responsable?.email].filter(Boolean);

    const programmes = [...new Set(candExams.map(e => e.programme).filter(Boolean))];
    const dateStr = session?.date ? fmtDate(session.date) : '?';
    const objet = `Convocation aux examens — ${programmes.join('/') || '?'} du ${dateStr}`;

    // Une signature par examen ; la convocation est considérée "à jour" seulement
    // si TOUS les examens du candidat ont déjà une empreinte enregistrée qui
    // correspond exactement à leurs données actuelles.
    const examSigs = new Map();
    let allSent = candExams.length > 0;
    candExams.forEach(e => {
      const sig = examSignature(e, session?.centreNom);
      examSigs.set(e.id, sig);
      if (e.convocationEnvoyee !== sig) allSent = false;
    });

    const corpsHtml = renderConvocationHtml({ cand, candExams, session, programmes, dateStr });

    return { to, cc, objet, corpsHtml, examSigs, allSent, errors, warnings };
  }

  /* ── Corps HTML de l'e-mail (styles inline — compatible Outlook) — modèle §4.3 ── */
  function renderConvocationHtml({ cand, candExams, session, dateStr }) {
    const p  = 'font-family:Segoe UI,Arial,sans-serif;font-size:13px;color:#1a1a1a;margin:4px 0;';
    const td = 'border:1px solid #999;padding:4px 8px;font-size:13px;';
    const th = `${td}background:#eee;text-align:left;`;

    const lieu = [session?.centreNom, session?.centreAdresse].filter(Boolean).join(', ');

    const rows = candExams.slice()
      .sort((a, b) => (a.dateHeure ?? 0) - (b.dateHeure ?? 0))
      .map(e => `
        <tr>
          <td style="${td}">${esc(e.qual)}</td>
          <td style="${td}">${e.dateHeure ? tsToTime(e.dateHeure) : '?'}</td>
          <td style="${td}">${e.duration} min</td>
        </tr>`).join('');

    return `
<div style="font-family:Segoe UI,Arial,sans-serif;font-size:13px;color:#1a1a1a;max-width:640px;">
  <p style="${p}">Madame, Monsieur ${esc(cand.firstName)} ${esc(cand.lastName)},</p>
  <br>
  <p style="${p}">Nous avons le plaisir de vous convoquer aux examens suivants :</p>
  <p style="${p}">
    Date&nbsp;: ${esc(dateStr)}<br>
    Lieu&nbsp;: ${esc(lieu || '?')}
  </p>
  <br>
  <table style="border-collapse:collapse;margin:8px 0;">
    <tr><th style="${th}">Qualification</th><th style="${th}">Heure début</th><th style="${th}">Durée</th></tr>
    ${rows}
  </table>
  <br>
  <p style="${p}">Merci de vous présenter 10 minutes avant l'heure de convocation et d'appeler le surveillant au ${esc(session?.surveillantTelephone || '?')} à votre arrivée.<br>
  </p>
  <p style="${p}">Merci de présenter cette convocation sur votre mobile ou imprimée ainsi qu'une pièce d'identité en cours de validité.</p>
  <br>
  <p style="${p}">Cordialement,<br>Certi-Trust</p>
</div>`;
  }

  /* ── Envoi de la convocation d'un candidat ── */
  async function sendConvocation(candId, btn) {
    const data = candidateSend.get(candId);
    if (!data || data.errors.length > 0 || data.allSent || !webhookUrl) return;

    const prevText = btn.textContent;
    btn.disabled = true;
    btn.textContent = '…';
    showStatus('Envoi de la convocation en cours…');

    try {
      const resp = await fetch(webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          to: data.to,
          cc: data.cc,
          objet: data.objet,
          corps_html: data.corpsHtml,
        }),
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);

      const updates = [...data.examSigs.entries()]; // [examId, signature]
      await grist.docApi.applyUserActions(
        updates.map(([examId, sig]) => ['UpdateRecord', 'Examens_ecrits', examId, { convocation_envoyee: sig }])
      );

      // Mise à jour locale sans recharger toute la session
      updates.forEach(([examId, sig]) => {
        const exam = exams.find(ex => ex.id === examId);
        if (exam) exam.convocationEnvoyee = sig;
      });

      showStatus(`Convocation envoyée à ${data.to}.`, 'ok', 4000);
      const candIds = [...new Map(exams.map(e => [e.candidatId, true])).keys()];
      buildHeader(candIds); // recalcule candidateSend et réaffiche les boutons à jour
    } catch (e) {
      showStatus('Échec de l’envoi : ' + e.message, 'error');
      btn.disabled = false;
      btn.textContent = prevText;
    }
  }

  /* ── Timeline visuelle ── */
  function buildTimeline(candIds) {
    const tl = document.getElementById('plan-tl');
    tl.innerHTML = '';

    const gridW = Math.max(candIds.length * COL_W, 20);

    // Axe des heures (sticky left)
    const axis = mk('div', 'time-axis');
    axis.style.cssText = `width:${TIME_W}px;height:${TL_HEIGHT}px;position:relative;`;

    // Grille des examens
    const grid = mk('div', 'exam-grid');
    grid.style.cssText = `width:${gridW}px;height:${TL_HEIGHT}px;`;

    // Bandes d'heures + labels
    for (let h = HOUR_START; h < HOUR_END; h++) {
      const y    = (h * 60 - TL_START_MIN) * PX_PER_MIN;
      const h60  = 60 * PX_PER_MIN;
      const even = h % 2 === 0;
      const cls  = even ? 'even' : 'odd';

      // Fond dans la grille
      const band = mk('div', `hr-band ${cls}`);
      band.style.cssText = `top:${y}px;height:${h60}px;`;
      grid.appendChild(band);

      // Ligne d'heure
      const line = mk('div', 'hr-line');
      line.style.top = `${y}px`;
      grid.appendChild(line);

      // Ligne demi-heure
      const half = mk('div', 'hr-line-half');
      half.style.top = `${y + 30 * PX_PER_MIN}px`;
      grid.appendChild(half);

      // Label dans l'axe
      const lbl = mk('div', `hr-label ${cls}`);
      lbl.style.cssText = `top:${y}px;height:${h60}px;`;
      lbl.textContent = `${String(h).padStart(2, '0')}h`;
      axis.appendChild(lbl);
    }

    // Message si aucun examen
    if (candIds.length === 0) {
      const msg = mk('div', 'no-exams-msg');
      msg.textContent = 'Aucun examen planifié pour cette session.';
      grid.appendChild(msg);
      tl.appendChild(axis);
      tl.appendChild(grid);
      tl.scrollTop = Math.max(0, (9 * 60 + 15 - TL_START_MIN) * PX_PER_MIN);
      return;
    }

    // Séparateurs de colonnes
    candIds.forEach((_, ci) => {
      if (ci === 0) return;
      const sep = mk('div', 'col-sep');
      sep.style.left = `${ci * COL_W}px`;
      grid.appendChild(sep);
    });

    // Lignes marqueurs (09h30, 12h30, 13h00)
    addMarker(grid, MORNING_START,   '#f59e0b', '09h30 — début matin');
    addMarker(grid, MORNING_END,     '#f59e0b', '12h30 — fin matin');
    addMarker(grid, AFTERNOON_START, '#10b981', '13h00 — début après-midi');

    // Ligne "maintenant" (si session aujourd'hui)
    if (selectedSession.date) {
      const sessDay = new Date(selectedSession.date * 1000);
      const today   = new Date();
      if (sessDay.toDateString() === today.toDateString()) {
        const nowMin = today.getHours() * 60 + today.getMinutes();
        const nowY   = (nowMin - TL_START_MIN) * PX_PER_MIN;
        if (nowY >= 0 && nowY <= TL_HEIGHT) {
          const nowLine = mk('div', 'now-line');
          nowLine.style.top = `${nowY}px`;
          nowLine.title = 'Maintenant';
          grid.appendChild(nowLine);
        }
      }
    }

    // Blocs d'examens
    candIds.forEach((candId, ci) => {
      const candExams = exams.filter(e => e.candidatId === candId);
      candExams.forEach(exam => {
        if (!exam.dateHeure) return;
        const d   = new Date(exam.dateHeure * 1000);
        // date_heure stocké en heure locale dans Grist → getHours/getMinutes
        const min = d.getHours() * 60 + d.getMinutes();
        const topY = (min - TL_START_MIN) * PX_PER_MIN;
        const hgt  = Math.max(22, exam.duration * PX_PER_MIN);
        const sty  = progStyle(exam.qual);

        const block = mk('div', 'exam-block');
        block.style.cssText = `
          top:${topY}px;
          left:${ci * COL_W + 4}px;
          width:${COL_W - 8}px;
          height:${hgt}px;
          background:${sty.bg};
          border-left-color:${sty.brd};
          color:${sty.txt};
        `;
        block.title = `${exam.qual} — ${tsToTime(exam.dateHeure)} (${exam.duration} min)`;

        const ql = mk('span', 'block-qual');
        ql.textContent = exam.qual || `#${exam.id}`;
        block.appendChild(ql);

        grid.appendChild(block);
      });
    });

    tl.appendChild(axis);
    tl.appendChild(grid);

    // Scroll auto vers 09h15
    tl.scrollTop = Math.max(0, (9 * 60 + 15 - TL_START_MIN) * PX_PER_MIN);
  }

  function addMarker(container, minutes, color, title) {
    const y = (minutes - TL_START_MIN) * PX_PER_MIN;
    if (y < 0 || y > TL_HEIGHT) return;
    const line = mk('div', 'marker-line');
    line.style.cssText = `top:${y}px;background:${color};opacity:.7;`;
    line.title = title;
    container.appendChild(line);
  }

  /* ──────────────────────────────────────────
     Édition manuelle de l'heure
  ────────────────────────────────────────── */
  async function onTimeChange(e) {
    const examId  = Number(e.target.dataset.examId);
    const timeStr = e.target.value;
    if (!timeStr || !selectedSession?.date) return;

    const newTs = timeStrToTs(timeStr, selectedSession.date);
    const exam  = exams.find(ex => ex.id === examId);
    if (exam) exam.dateHeure = newTs;
    e.target.classList.add('modified');

    try {
      await grist.docApi.applyUserActions([
        ['UpdateRecord', 'Examens_ecrits', examId, { date_heure: newTs }]
      ]);
      // render() reconstruit aussi l'en-tête : le bouton Envoyer/Renvoyer et sa
      // donnée (candidateSend) doivent être recalculés après tout changement
      // d'heure, pas seulement la timeline visuelle.
      render();
      showStatus('Heure enregistrée.', 'ok', 2000);
    } catch (err) {
      showStatus('Erreur sauvegarde : ' + err.message, 'error');
    }
  }

  /* ──────────────────────────────────────────
     Calcul automatique des horaires
  ────────────────────────────────────────── */
  document.getElementById('btn-calc').addEventListener('click', async () => {
    if (!exams.length || !selectedSession?.date) return;

    const schedule = computeSchedule(exams);
    const actions  = [];

    exams.forEach(exam => {
      const min = schedule.get(exam.id);
      if (min == null) return;
      const newTs = minutesToTs(min, selectedSession.date);
      exam.dateHeure = newTs;
      actions.push(['UpdateRecord', 'Examens_ecrits', exam.id, { date_heure: newTs }]);
    });

    try {
      await grist.docApi.applyUserActions(actions);
      // render() reconstruit aussi l'en-tête (champs heure + bouton Envoyer/Renvoyer
      // avec sa donnée candidateSend recalculée), pas seulement la timeline visuelle.
      render();
      showStatus('Horaires calculés et enregistrés.', 'ok', 3000);
    } catch (err) {
      showStatus('Erreur sauvegarde : ' + err.message, 'error');
    }
  });

  /* ── Algorithme de planification ── */
  function computeSchedule(allExams) {
    const schedule    = new Map(); // examId → minutes depuis minuit
    const pacsHandled = new Set();

    /* ── État par candidat : { freeAt, blockStart }
       freeAt     = minute à partir de laquelle le candidat est libre
       blockStart = début du bloc consécutif en cours (pour calcul pause) ── */
    const cstate = new Map();
    function st(candId) {
      if (!cstate.has(candId))
        cstate.set(candId, { freeAt: MORNING_START, blockStart: MORNING_START });
      return cstate.get(candId);
    }

    /* Prochain créneau disponible pour un candidat.
       dur : durée de l'examen à venir (permet d'anticiper si le bloc dépasserait 1h30).
       Pause de 10 min insérée si le bloc consécutif AVEC ce prochain examen dépasse 1h30. */
    function nextFree(candId, dur) {
      const s = st(candId);
      let t = s.freeAt;
      if (s.freeAt - s.blockStart + (dur || 0) > 90) t += 10;
      if (t > MORNING_END && t < AFTERNOON_START) t = AFTERNOON_START;
      return t;
    }

    /* Assigner un examen et mettre à jour l'état du candidat */
    function doAssign(examId, candId, startMin, dur) {
      schedule.set(examId, startMin);
      const s = st(candId);
      // Nouveau bloc si gap (pause insérée = startMin > freeAt) ou après > 1h30
      if (startMin > s.freeAt) s.blockStart = startMin;
      s.freeAt = startMin + dur;
    }

    /* ── 1. Règles PACS (temps fixes, par candidat) ── */
    const byCandidat = new Map();
    allExams.forEach(e => {
      if (!byCandidat.has(e.candidatId)) byCandidat.set(e.candidatId, []);
      byCandidat.get(e.candidatId).push(e);
    });

    for (const [candId, cExams] of byCandidat) {
      const hasPACS = cExams.some(e => e.qual.toUpperCase().includes('PACS'));
      if (!hasPACS) continue;

      const archi  = cExams.find(e => /PACS.ARCHI/i.test(e.qual));
      const tc     = cExams.find(e => /PACS.TC/i.test(e.qual));
      const others = cExams.filter(e => /PACS_(GDR|CRISE|HOM)/i.test(e.qual));

      if (archi) {
        // PACS_ARCHI occupe seul le créneau du matin (09h30) — TC et les autres
        // PACS de ce candidat partent l'après-midi, à la suite les uns des autres
        // (jamais en même temps que ARCHI, contrairement à l'ancien code qui les
        // plaçait tous les deux à 09h30).
        schedule.set(archi.id, MORNING_START);
        pacsHandled.add(archi.id);

        let t = AFTERNOON_START;
        const blockStart = AFTERNOON_START;
        [tc, ...others].filter(Boolean).forEach(e => {
          if (t - blockStart + e.duration > 90) t += 10; // pause si le bloc dépasserait 1h30
          schedule.set(e.id, t);
          pacsHandled.add(e.id);
          t += e.duration;
        });
      } else if (tc) {
        switch (others.length) {
          case 0:
            schedule.set(tc.id, MORNING_START);
            break;
          case 1:
            schedule.set(tc.id, MORNING_START);
            schedule.set(others[0].id, 12 * 60 + 30);
            break;
          case 2:
            schedule.set(tc.id, 13 * 60 + 30);
            schedule.set(others[0].id, MORNING_START);
            schedule.set(others[1].id, 11 * 60 + 10);
            break;
          default:
            schedule.set(tc.id, 13 * 60 + 30);
            schedule.set(others[0].id, MORNING_START);
            schedule.set(others[1].id, 11 * 60 + 10);
            schedule.set(others[2].id, 15 * 60 + 40);
            break;
        }
        pacsHandled.add(tc.id);
        others.forEach(e => pacsHandled.add(e.id));
      }

      // Reconstruire l'état du candidat PACS à partir des temps assignés
      const pacsExams = allExams.filter(e => pacsHandled.has(e.id) && e.candidatId === candId);
      if (pacsExams.length) {
        const lastEnd = Math.max(...pacsExams.map(e => (schedule.get(e.id) ?? 0) + e.duration));
        const s = st(candId);
        s.freeAt = lastEnd;
        s.blockStart = lastEnd; // nouveau bloc après les PACS
      }
    }

    /* ── 2. Non-PACS : scheduling par candidat ──
       Départ du groupe = max des nextFree() de ses membres.
       Chaque candidat progresse indépendamment ; pas de file globale. ── */
    const groups = new Map();
    allExams.forEach(e => {
      if (pacsHandled.has(e.id)) return;
      if (!groups.has(e.qual)) groups.set(e.qual, []);
      groups.get(e.qual).push(e);
    });
    const sorted = [...groups.entries()].sort((a, b) => b[1].length - a[1].length);

    sorted.forEach(([, grp]) => {
      const dur = grp[0].duration || 100;

      // Départ = plus tardif des créneaux libres de tous les candidats du groupe
      // On passe dur pour anticiper la pause si le bloc dépasserait 1h30
      let t = grp.reduce((mx, e) => Math.max(mx, nextFree(e.candidatId, dur)), 0);

      // Respecter la coupure déjeuner
      if (t > MORNING_END && t < AFTERNOON_START) t = AFTERNOON_START;
      if (t < MORNING_END && t + dur > MORNING_END) t = AFTERNOON_START;

      grp.forEach(e => doAssign(e.id, e.candidatId, t, dur));
    });

    /* ── 3. Rattrapages (examens non couverts) ── */
    allExams.forEach(e => {
      if (schedule.has(e.id)) return;
      let t = nextFree(e.candidatId, e.duration);
      if (t > MORNING_END && t < AFTERNOON_START) t = AFTERNOON_START;
      if (t < MORNING_END && t + e.duration > MORNING_END) t = AFTERNOON_START;
      doAssign(e.id, e.candidatId, t, e.duration);
    });

    return schedule;
  }

  /* ──────────────────────────────────────────
     Utilitaires
  ────────────────────────────────────────── */
  function mk(tag, cls) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    return e;
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  function tsToTime(ts) {
    // date_heure est stocké en heure locale → getHours/getMinutes (pas UTC)
    const d = new Date(ts * 1000);
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  function timeStrToTs(timeStr, sessionDateTs) {
    const [h, m] = timeStr.split(':').map(Number);
    // Minuit local du jour de la session (date Grist stockée en UTC → getUTCDate pour le jour)
    const d = new Date(sessionDateTs * 1000);
    const midnight = new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()).getTime();
    return Math.floor(midnight / 1000) + h * 3600 + m * 60;
  }

  function minutesToTs(minutes, sessionDateTs) {
    const d = new Date(sessionDateTs * 1000);
    const midnight = new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()).getTime();
    return Math.floor(midnight / 1000) + minutes * 60;
  }

  function fmtDate(ts) {
    const d = new Date(ts * 1000);
    return [d.getUTCDate(), d.getUTCMonth()+1, d.getUTCFullYear()]
      .map((v,i) => i<2 ? String(v).padStart(2,'0') : v).join('/');
  }

  function progStyle(qual) {
    const up = String(qual ?? '').toUpperCase();
    for (const [k, v] of Object.entries(PROG_STYLE)) {
      if (k !== 'DEFAULT' && up.includes(k)) return v;
    }
    return PROG_STYLE.DEFAULT;
  }

  function showEmpty(msg) {
    document.getElementById('empty').textContent = msg ?? 'Sélectionnez une session d\'examen.';
    document.getElementById('empty').style.display = 'flex';
    document.getElementById('scroll-x').style.display = 'none';
    document.getElementById('btn-calc').disabled = true;
  }

  function showStatus(msg, type = '', dur = 0) {
    const bar = document.getElementById('statusbar');
    bar.textContent = msg;
    bar.className   = 'statusbar' + (type ? ' ' + type : '');
    if (dur) setTimeout(() => { bar.textContent = ''; bar.className = 'statusbar'; }, dur);
  }
</script>
