<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planification des UO</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #1e293b;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #f8fafc;
    }

    .toolbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 6px 12px;
      background: #1e3a8a;
      color: #fff;
    }
    .toolbar-title { font-size: 12px; font-weight: 600; color: #bfdbfe; }
    .spacer { flex: 1; }
    .btn {
      padding: 5px 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn-light { background: rgba(255,255,255,.18); color: #fff; }
    .btn-light:hover:not(:disabled) { background: rgba(255,255,255,.3); }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .btn-icon {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 14px;
      color: #64748b;
    }
    .btn-icon:hover { background: #e2e8f0; color: #1e293b; }
    .btn-icon.danger { color: #b91c1c; }
    .btn-icon.danger:hover { background: #fee2e2; }

    .warning {
      flex-shrink: 0;
      padding: 6px 12px;
      background: #fef3c7;
      color: #92400e;
      border-bottom: 1px solid #fcd34d;
      font-weight: 600;
    }
    .error {
      flex-shrink: 0;
      padding: 6px 12px;
      background: #fee2e2;
      color: #b91c1c;
      border-bottom: 1px solid #fca5a5;
    }

    .main { flex: 1; min-height: 0; overflow: auto; }
    .empty {
      padding: 40px;
      text-align: center;
      color: #94a3b8;
      font-style: italic;
      font-size: 14px;
    }

    table { border-collapse: collapse; background: #fff; width: 100%; }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
      color: #334155;
      text-align: left;
      padding: 6px 8px;
      border-bottom: 1px solid #cbd5e1;
      white-space: nowrap;
    }
    th .sub { display: block; font-weight: 400; color: #64748b; }
    td {
      padding: 4px 8px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }
    tr:hover td { background: #f8fafc; }
    tfoot td { font-weight: 700; background: #f1f5f9; border-top: 1px solid #cbd5e1; }

    select, input[type=date], input[type=text] {
      font: inherit;
      padding: 3px 5px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #fff;
    }
    select:focus, input:focus { outline: 2px solid #2563eb; outline-offset: -1px; border-color: #2563eb; }
    .slot { display: flex; align-items: center; gap: 4px; }
    .slot select { max-width: 90px; }
    .slot.off select { color: #94a3b8; }
    .slot input[type=checkbox] { accent-color: #059669; width: 15px; height: 15px; cursor: pointer; }
    .others { display: flex; flex-direction: column; gap: 2px; }
    .others label { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    .duree { width: 64px; text-align: right; }
    .duree-wrap { display: flex; align-items: center; justify-content: flex-end; gap: 6px; white-space: nowrap; }
    td.num, th.num { text-align: right; }
    .uo-select { max-width: 220px; }
    .lot-select { width: 52px; }
    .actions { white-space: nowrap; text-align: right; }
    .muted { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="btn btn-light" id="btn-add" disabled>+ Ajouter une UO</button>
    <span class="toolbar-title" id="title">Unités d'œuvre</span>
    <span class="spacer"></span>
    <button class="btn btn-primary" id="btn-default" hidden>Ajouter des UO par défaut</button>
    <button class="btn btn-primary" id="btn-charge" hidden disabled title="Fonction à venir">Ajouter la charge</button>
  </div>
  <div class="warning" id="warning" hidden>Aucun RE, ETA ni ETM n'est renseigné pour cette évaluation.</div>
  <div class="error" id="error" hidden></div>
  <div class="main" id="main"><div class="empty">Sélectionnez une évaluation.</div></div>

  <datalist id="durees">
    <option value="0.25"></option><option value="0.5"></option><option value="0.75"></option>
    <option value="1"></option><option value="1.5"></option><option value="2"></option><option value="3"></option>
  </datalist>

  <script>
  const T_UO = 'Unites_d_oeuvre';
  const FALLBACK_UO_CHOICES = [
    'Journée de lancement', 'Revue documentaire', 'évaluation siège', 'évaluation prestation témoin',
    'Réunion de clôture', 'Rédaction du rapport', "Soutenance des travaux à l'ANSSI et suivi",
    "Plan d'évaluation", 'Planification',
  ];
  // Les libellés doivent correspondre exactement aux choix Grist : la formule
  // Cycles_services.date_debut_cycle s'appuie sur « Journée de lancement » et « Rédaction du rapport ».
  const DEFAULT_UOS = [
    { uo: 'Journée de lancement', offset: { days: 0 },   jours: 1 },
    { uo: 'Revue documentaire',   offset: { days: 1 },   jours: 2 },
    { uo: 'évaluation siège',     offset: { days: 3 },   jours: 2 },
    { uo: 'Rédaction du rapport', offset: { months: 1 }, jours: 1 },
  ];
  const LOTS = [1, 2, 3, 4];

  const state = {
    evalId: null,
    evaluation: null,
    uos: [],
    evaluateurs: new Map(),
    uoChoices: FALLBACK_UO_CHOICES,
    slots: [],
    busy: false,
  };
  // Sélection d'un évaluateur dans une colonne dont la case est décochée : rien n'est écrit
  // en base tant que la case n'est pas cochée, on mémorise donc le choix localement.
  const slotOverrides = new Map();

  // Unites_d_oeuvre.evaluateurs est une formule (RE + ETA + ETM) : ne jamais l'écrire.
  const FIELDS = ['RE', 'ETA', 'ETM', 'OBS'];
  // Une même personne ne peut tenir qu'un seul de ces rôles sur une UO
  const EXCLUSIVE = ['RE', 'ETA', 'ETM'];

  const $ = id => document.getElementById(id);

  grist.ready({ requiredAccess: 'full' });

  // Le widget doit être lié à Evaluations : lié à Unites_d_oeuvre, onRecord ne reçoit
  // rien pour une évaluation sans UO et l'id reçu serait celui d'une UO.
  let wrongTable = false;
  grist.selectedTable.getTableId().then(tid => {
    if (tid && tid !== 'Evaluations') {
      wrongTable = true;
      $('main').innerHTML = '<div class="empty">Configuration incorrecte : le widget est lié à la table « '
        + tid + ' ».<br>Dans le panneau de droite, choisir la table <b>Evaluations</b> et '
        + '« Sélectionner par » la vue des évaluations.</div>';
    }
  }).catch(() => {});

  grist.onRecord(rec => {
    if (!rec || wrongTable) return;
    if (rec.id !== state.evalId) slotOverrides.clear();
    state.evalId = rec.id;
    if (!state.busy) load();
  });

  // fetchTable renvoie les RefList au format brut ['L', id1, id2, ...]
  function refList(v) {
    if (Array.isArray(v)) return v[0] === 'L' ? v.slice(1) : v;
    return [];
  }

  function rows(table) {
    const ids = table.id || [];
    return ids.map((id, i) => {
      const r = { id };
      for (const k of Object.keys(table)) r[k] = table[k][i];
      return r;
    });
  }

  async function load() {
    showError('');
    try {
      const [ev, uo, evals, cols, tabs] = await Promise.all([
        grist.docApi.fetchTable('Evaluations'),
        grist.docApi.fetchTable(T_UO),
        grist.docApi.fetchTable('Evaluateurs'),
        grist.docApi.fetchTable('_grist_Tables_column'),
        grist.docApi.fetchTable('_grist_Tables'),
      ]);

      state.evaluation = rows(ev).find(r => r.id === state.evalId) || null;
      state.uos = rows(uo).filter(r => r.Evaluation === state.evalId);
      state.uos.sort((a, b) => {
        const da = a.date_debut_incluse, db = b.date_debut_incluse;
        const ha = da != null && da !== '', hb = db != null && db !== '';
        if (ha !== hb) return ha ? -1 : 1;
        if (ha && da !== db) return da - db;
        return (a.manualSort || 0) - (b.manualSort || 0);
      });

      state.evaluateurs = new Map(rows(evals).map(r => [r.id, r]));

      const uoTableRef = rows(tabs).find(t => t.tableId === T_UO)?.id;
      const uoCol = rows(cols).find(c => c.parentId === uoTableRef && c.colId === 'Unite_d_oeuvre');
      try {
        const choices = JSON.parse(uoCol?.widgetOptions || '{}').choices;
        if (Array.isArray(choices) && choices.length) state.uoChoices = choices;
      } catch (e) { /* options illisibles : on garde la liste de secours */ }

      state.slots = buildSlots(state.evaluation);
      render();
    } catch (e) {
      console.error(e);
      showError('Erreur de chargement : ' + (e.message || e));
    }
  }

  // Une colonne par personne et par rôle de l'évaluation. Une même personne peut avoir
  // deux colonnes (ex. RE et ETA) : c'est sur l'UO qu'on choisit l'un ou l'autre.
  function buildSlots(evaluation) {
    if (!evaluation) return [];
    const slots = [{ key: 'RE', label: 'RE', def: evaluation.RE || null, field: 'RE' }];
    for (const field of ['ETA', 'ETM', 'OBS']) {
      const ids = refList(evaluation[field]).filter(Boolean);
      ids.forEach((id, i) => slots.push({
        key: field + (i + 1), label: ids.length > 1 ? field + ' ' + (i + 1) : field, def: id, field,
      }));
      if (field === 'ETA' && !ids.length) slots.push({ key: 'ETA1', label: 'ETA', def: null, field });
    }
    return slots;
  }

  // RE est une Ref simple, les autres rôles des RefList : on les manipule tous comme des listes.
  function fieldList(uo, field) {
    if (field === 'RE') return uo.RE ? [uo.RE] : [];
    return refList(uo[field]);
  }

  function fieldValue(field, ids) {
    if (field === 'RE') return ids[0] || null;
    return ['L', ...ids];
  }

  // Ajoute ou retire une personne d'un rôle ; en l'ajoutant à un rôle exclusif,
  // on la retire des autres rôles exclusifs de l'UO.
  function roleUpdate(lists, field, id, add) {
    const fields = {};
    let list = lists[field].filter(x => x !== id);
    if (add) {
      list = field === 'RE' ? [id] : [...list, id];
      if (EXCLUSIVE.includes(field)) {
        for (const f of EXCLUSIVE) {
          if (f !== field && lists[f].includes(id)) fields[f] = fieldValue(f, lists[f].filter(x => x !== id));
        }
      }
    }
    fields[field] = fieldValue(field, list);
    return fields;
  }

  function evalName(id) {
    const e = state.evaluateurs.get(id);
    if (!e) return id ? '#' + id : '—';
    return e.Evaluateur_Trigramme || fullName(id);
  }

  function fullName(id) {
    const e = state.evaluateurs.get(id);
    if (!e) return id ? '#' + id : '—';
    return [e.Evaluateur_Prenom, e.Evaluateur_Nom].filter(Boolean).join(' ') || '#' + id;
  }

  // Associe chaque membre de la RefList à une colonne. Les membres sans colonne vont dans « Autres ».
  function resolveRow(uo) {
    const lists = {}, used = {};
    for (const f of FIELDS) { lists[f] = fieldList(uo, f); used[f] = new Set(); }
    const cells = state.slots.map(s => {
      const ov = slotOverrides.get(uo.id + ':' + s.key);
      const candidate = ov !== undefined ? ov : s.def;
      const checked = !!candidate && lists[s.field].includes(candidate) && !used[s.field].has(candidate);
      if (checked) used[s.field].add(candidate);
      return { slot: s, value: candidate, checked };
    });
    const others = FIELDS.flatMap(f => lists[f].filter(id => !used[f].has(id)).map(id => ({ id, field: f })));
    const members = [...new Set(EXCLUSIVE.flatMap(f => lists[f]))];
    return { lists, members, cells, others };
  }

  // Rôles par défaut d'une nouvelle UO : ceux de l'évaluation, une personne n'étant
  // retenue que pour son premier rôle dans l'ordre RE, ETA, ETM.
  function defaultLists() {
    const out = { RE: [], ETA: [], ETM: [], OBS: [] };
    const taken = new Set();
    for (const s of state.slots) {
      if (!s.def || out[s.field].includes(s.def)) continue;
      if (EXCLUSIVE.includes(s.field)) {
        if (taken.has(s.def) || (s.field === 'RE' && out.RE.length)) continue;
        taken.add(s.def);
      }
      out[s.field].push(s.def);
    }
    const fields = {};
    for (const f of FIELDS) fields[f] = fieldValue(f, out[f]);
    return fields;
  }

  function render() {
    const ev = state.evaluation;
    const main = $('main');
    if (!ev) {
      $('btn-add').disabled = true;
      $('btn-default').hidden = true;
      $('btn-charge').hidden = true;
      $('warning').hidden = true;
      main.innerHTML = '<div class="empty">Sélectionnez une évaluation.</div>';
      return;
    }

    $('title').textContent = "Unités d'œuvre — " + (ev.Libelle || 'évaluation #' + ev.id);
    $('btn-add').disabled = false;
    $('warning').hidden = !!(ev.RE || refList(ev.ETA).length || refList(ev.ETM).length);

    const noUo = state.uos.length === 0;
    const hasCharge = hasChargeJson(ev.Charge);
    $('btn-default').hidden = !(noUo && !hasCharge);
    $('btn-charge').hidden = !(noUo && hasCharge);

    if (noUo) {
      main.innerHTML = '<div class="empty">Aucune unité d\'œuvre pour cette évaluation.</div>';
      return;
    }

    const resolved = state.uos.map(uo => ({ uo, ...resolveRow(uo) }));
    const showOthers = resolved.some(r => r.others.length);

    const table = document.createElement('table');
    const thead = table.createTHead().insertRow();
    thead.appendChild(th("Unité d'œuvre"));
    for (const s of state.slots) {
      const h = th(s.label, s.def ? evalName(s.def) : 'non défini');
      if (s.field === 'OBS') h.title = 'Observateur : non compté dans les JH';
      thead.appendChild(h);
    }
    if (showOthers) thead.appendChild(th('Autres'));
    thead.appendChild(th('Date de début'));
    const thDuree = th('Durée (j)');
    thDuree.className = 'num';
    thead.appendChild(thDuree);
    thead.appendChild(th('Lot'));
    thead.appendChild(th(''));

    const tbody = table.createTBody();
    let totalJH = 0;
    for (const r of resolved) {
      const tr = tbody.insertRow();
      tr.insertCell().appendChild(uoSelect(r.uo));
      for (const c of r.cells) tr.insertCell().appendChild(slotCell(r, c));
      if (showOthers) tr.insertCell().appendChild(othersCell(r));
      tr.insertCell().appendChild(dateInput(r.uo));
      const dureeTd = tr.insertCell();
      dureeTd.className = 'num';
      const dureeWrap = document.createElement('div');
      dureeWrap.className = 'duree-wrap';
      const nb = document.createElement('span');
      nb.className = 'muted';
      nb.textContent = r.members.length + ' ×';
      nb.title = r.members.length + ' évaluateur(s)';
      dureeWrap.append(nb, dureeInput(r.uo));
      dureeTd.appendChild(dureeWrap);
      tr.insertCell().appendChild(lotSelect(r.uo));
      const act = tr.insertCell();
      act.className = 'actions';
      act.appendChild(iconBtn('⧉', 'Dupliquer', () => duplicate(r.uo)));
      act.appendChild(iconBtn('🗑', 'Supprimer', () => remove(r.uo), 'danger'));
      const j = Number(r.uo.Jours) || 0;
      totalJH += j * r.members.length;
    }

    const foot = table.createTFoot().insertRow();
    const label = foot.insertCell();
    label.textContent = 'Total JH (jours × évaluateurs)';
    label.colSpan = 1 + state.slots.length + (showOthers ? 1 : 0) + 1;
    const totalTd = foot.insertCell();
    totalTd.className = 'num';
    totalTd.textContent = fmt(totalJH);
    foot.insertCell().colSpan = 2;

    main.replaceChildren(table);
  }

  function th(text, sub) {
    const el = document.createElement('th');
    el.textContent = text;
    if (sub) {
      const s = document.createElement('span');
      s.className = 'sub';
      s.textContent = sub;
      el.appendChild(s);
    }
    return el;
  }

  function fmt(n) { return Math.round(n * 100) / 100; }

  function hasChargeJson(v) {
    if (v == null || String(v).trim() === '') return false;
    try { JSON.parse(v); return true; } catch (e) { return false; }
  }

  function iconBtn(txt, title, fn, cls) {
    const b = document.createElement('button');
    b.className = 'btn-icon' + (cls ? ' ' + cls : '');
    b.textContent = txt;
    b.title = title;
    b.addEventListener('click', fn);
    return b;
  }

  function uoSelect(uo) {
    const sel = document.createElement('select');
    sel.className = 'uo-select';
    const choices = [...state.uoChoices];
    if (uo.Unite_d_oeuvre && !choices.includes(uo.Unite_d_oeuvre)) choices.unshift(uo.Unite_d_oeuvre);
    sel.appendChild(new Option('—', ''));
    for (const c of choices) sel.appendChild(new Option(c, c, false, c === uo.Unite_d_oeuvre));
    sel.addEventListener('change', () => update(uo.id, { Unite_d_oeuvre: sel.value || null }));
    return sel;
  }

  function evaluateurOptions(sel, current) {
    const list = [...state.evaluateurs.values()]
      .sort((a, b) => evalName(a.id).localeCompare(evalName(b.id), 'fr'));
    sel.appendChild(new Option('—', ''));
    for (const e of list) {
      const opt = new Option(evalName(e.id), e.id, false, e.id === current);
      opt.title = fullName(e.id);
      sel.appendChild(opt);
    }
    if (current) sel.title = fullName(current);
  }

  function slotCell(r, c) {
    const wrap = document.createElement('div');
    wrap.className = 'slot' + (c.checked ? '' : ' off');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = c.checked;
    cb.disabled = !c.value;
    const sel = document.createElement('select');
    evaluateurOptions(sel, c.value);

    const field = c.slot.field;
    cb.addEventListener('change', () => {
      update(r.uo.id, roleUpdate(r.lists, field, c.value, cb.checked));
    });

    sel.addEventListener('change', () => {
      const newId = sel.value ? Number(sel.value) : null;
      slotOverrides.set(r.uo.id + ':' + c.slot.key, newId);
      if (!c.checked) { render(); return; }
      const lists = { ...r.lists, [field]: r.lists[field].filter(id => id !== c.value) };
      const fields = newId
        ? roleUpdate(lists, field, newId, true)
        : { [field]: fieldValue(field, lists[field]) };
      update(r.uo.id, fields);
    });

    wrap.append(cb, sel);
    return wrap;
  }

  function othersCell(r) {
    const wrap = document.createElement('div');
    wrap.className = 'others';
    for (const { id, field } of r.others) {
      const lab = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = true;
      cb.title = field === 'OBS' ? "Décocher pour retirer cet observateur de l'UO" : "Décocher pour retirer cet évaluateur de l'UO";
      cb.addEventListener('change', () => {
        update(r.uo.id, roleUpdate(r.lists, field, id, false));
      });
      lab.title = fullName(id) + ' (' + field + ')';
      lab.append(cb, document.createTextNode(evalName(id) + ' (' + field + ')'));
      wrap.appendChild(lab);
    }
    return wrap;
  }

  // Les dates Grist sont des secondes depuis l'epoch, à minuit UTC
  function toIso(ts) {
    if (ts == null || ts === '') return '';
    return new Date(ts * 1000).toISOString().slice(0, 10);
  }
  function fromIso(s) {
    if (!s) return null;
    return Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 1000;
  }
  function addOffset(ts, { days = 0, months = 0 }) {
    if (ts == null || ts === '') return null;
    const d = new Date(ts * 1000);
    if (months) {
      const day = d.getUTCDate();
      d.setUTCDate(1);
      d.setUTCMonth(d.getUTCMonth() + months);
      const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
      d.setUTCDate(Math.min(day, last));
    }
    d.setUTCDate(d.getUTCDate() + days);
    return d.getTime() / 1000;
  }

  function dateInput(uo) {
    const inp = document.createElement('input');
    inp.type = 'date';
    inp.value = toIso(uo.date_debut_incluse);
    inp.addEventListener('change', () => update(uo.id, { date_debut_incluse: fromIso(inp.value) }));
    return inp;
  }

  function dureeInput(uo) {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.inputMode = 'decimal';
    inp.className = 'duree';
    inp.setAttribute('list', 'durees');
    inp.value = uo.Jours ?? '';
    inp.addEventListener('change', () => {
      const raw = inp.value.trim().replace(',', '.');
      const n = Number(raw);
      if (raw === '' || !isFinite(n) || n < 0 || n > 100) {
        showError('Durée invalide : saisir un nombre entre 0 et 100.');
        inp.value = uo.Jours ?? '';
        return;
      }
      // Arrondi au centième pour accepter les valeurs proposées (.25, .75)
      update(uo.id, { Jours: Math.round(n * 100) / 100 });
    });
    return inp;
  }

  function lotSelect(uo) {
    const sel = document.createElement('select');
    sel.className = 'lot-select';
    const cur = uo.Lot === '' || uo.Lot == null ? null : Number(uo.Lot);
    sel.appendChild(new Option('—', ''));
    for (const l of LOTS) sel.appendChild(new Option(String(l), l, false, l === cur));
    sel.addEventListener('change', () => update(uo.id, { Lot: sel.value ? Number(sel.value) : null }));
    return sel;
  }

  async function apply(actions) {
    state.busy = true;
    showError('');
    try {
      await grist.docApi.applyUserActions(actions);
    } catch (e) {
      console.error(e);
      showError("Erreur d'écriture : " + (e.message || e));
    } finally {
      state.busy = false;
      await load();
    }
  }

  function update(id, fields) {
    return apply([['UpdateRecord', T_UO, id, fields]]);
  }

  $('btn-add').addEventListener('click', () => {
    if (!state.evaluation) return;
    apply([['AddRecord', T_UO, null, {
      Evaluation: state.evaluation.id,
      ...defaultLists(),
      Jours: 1,
    }]]);
  });

  $('btn-default').addEventListener('click', () => {
    const ev = state.evaluation;
    if (!ev || state.uos.length) return;
    const lists = defaultLists();
    apply(DEFAULT_UOS.map(d => ['AddRecord', T_UO, null, {
      Evaluation: ev.id,
      Unite_d_oeuvre: d.uo,
      ...lists,
      date_debut_incluse: addOffset(ev.Date_Debut_prevue, d.offset),
      Jours: d.jours,
    }]));
  });

  function duplicate(uo) {
    apply([['AddRecord', T_UO, null, {
      Evaluation: uo.Evaluation,
      Unite_d_oeuvre: uo.Unite_d_oeuvre || null,
      RE: uo.RE || null,
      ETA: ['L', ...refList(uo.ETA)],
      ETM: ['L', ...refList(uo.ETM)],
      OBS: ['L', ...refList(uo.OBS)],
      date_debut_incluse: uo.date_debut_incluse ?? null,
      Jours: uo.Jours ?? null,
      Lot: uo.Lot === '' ? null : (uo.Lot ?? null),
      PO_ref: uo.PO_ref || '',
    }]]);
  }

  function remove(uo) {
    const label = (uo.Unite_d_oeuvre || 'UO sans libellé') + (uo.date_debut_incluse ? ' du ' + toIso(uo.date_debut_incluse) : '');
    if (!confirm('Supprimer l\'unité d\'œuvre « ' + label + ' » ?')) return;
    apply([['RemoveRecord', T_UO, uo.id]]);
  }

  function showError(msg) {
    $('error').textContent = msg;
    $('error').hidden = !msg;
  }
  </script>
</body>
</html>
