<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Revue de dossier</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Charte Certi-Trust (reprise du modèle Word, comme plan-evaluation) */
  :root { --marine:#32406C; --marine-fonce:#262f52; --pale:#EDF0F6; --txt:#262B38; --bord:#D5DCEA; --gris:#7A7C7A;
          --ok:#059669; --ok-bg:#d1fae5; --ko:#b91c1c; --ko-bg:#fdecec; --so:#64748b; --so-bg:#eef0f4; --enc:#9a5b00; --enc-bg:#fff4e0; }
  *, *::before, *::after { box-sizing: border-box; }
  body { font: 12.5px/1.45 Montserrat, -apple-system, "Segoe UI", sans-serif; color: var(--txt); margin: 0; padding: 12px; background: #eef0f4; }
  .empty { padding: 40px 0; text-align: center; color: var(--gris); font-style: italic; }
  button { font: inherit; cursor: pointer; }
  input, textarea, select { font: inherit; color: var(--txt); }

  .entete { background: #fff; border: 1px solid var(--bord); border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
  .entete h1 { margin: 0; font-size: 15px; color: var(--marine); }
  .entete .sous { color: var(--gris); font-size: 12px; margin-top: 2px; }
  .entete .gear { float: right; background: #fff; color: var(--marine); border: 1px solid var(--bord); border-radius: 4px; padding: 3px 7px; font-size: 11px; }

  /* Frise des jalons */
  .frise { display: flex; gap: 4px; margin: 10px 0 2px; }
  .jal { flex: 1; min-width: 0; text-align: center; padding: 6px 4px; border-radius: 5px; background: var(--so-bg); color: var(--so);
         border: 1px solid transparent; cursor: pointer; }
  .jal b { display: block; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jal small { display: block; font-size: 10.5px; }
  .jal.fait    { background: var(--ok-bg); color: #065f46; }
  .jal.encours { background: var(--enc-bg); color: var(--enc); border-color: #f1cf94; }
  .jal.arret   { background: var(--ko-bg); color: var(--ko); }

  /* Sections par jalon */
  details.sec { background: #fff; border: 1px solid var(--bord); border-radius: 6px; margin-bottom: 8px; }
  details.sec > summary { list-style: none; cursor: pointer; padding: 8px 12px; display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--marine); }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::before { content: '▸'; color: var(--gris); }
  details.sec[open] > summary::before { content: '▾'; }
  details.sec > summary .cpt { margin-left: auto; font-weight: 600; font-size: 11px; color: var(--gris); }
  .pastille { font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 9px; }
  .pastille.fait { background: var(--ok-bg); color: #065f46; }
  .pastille.encours { background: var(--enc-bg); color: var(--enc); }
  .pastille.avenir { background: var(--so-bg); color: var(--so); }
  .pastille.arret { background: var(--ko-bg); color: var(--ko); }
  .corps { padding: 0 12px 10px; }

  /* Panneau livrable */
  .livrable { background: var(--pale); border-left: 3px solid var(--marine); border-radius: 4px; padding: 8px 10px; margin-bottom: 8px; }
  .livrable h3 { margin: 0 0 6px; font-size: 12px; color: var(--marine); }
  .ligne { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 4px 0; }
  .ligne label.lbl { color: var(--gris); font-size: 11.5px; min-width: 110px; }
  .ligne input[type=text], .ligne input[type=date], .ligne textarea, .ligne select { border: 1px solid var(--bord); border-radius: 4px; padding: 3px 6px; background: #fff; }
  .ligne textarea { width: 100%; min-height: 34px; resize: vertical; }
  .btn { border: 1px solid var(--marine); background: var(--marine); color: #fff; border-radius: 4px; padding: 4px 10px; font-weight: 600; font-size: 12px; }
  .btn:hover:not(:disabled) { background: var(--marine-fonce); }
  .btn.sec2 { background: #fff; color: var(--marine); border-color: var(--bord); }
  .btn:disabled { opacity: .45; cursor: default; }
  a.lien { color: var(--marine); font-weight: 600; }
  .info { color: var(--gris); font-size: 11.5px; }
  .warn { color: var(--enc); font-size: 11.5px; }
  .liste { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 12px; }
  .liste td { padding: 3px 6px; border-top: 1px solid var(--bord); }

  /* Choix O / N / SO et OUI / NON : cases à bascule */
  .tog { display: inline-flex; gap: 2px; }
  .tog button { border: 1px solid var(--bord); background: #fff; color: var(--gris); border-radius: 3px; padding: 1px 6px; font-size: 11px; font-weight: 600; min-width: 26px; }
  .tog button.on.v-O, .tog button.on.v-OUI { background: var(--ok); border-color: var(--ok); color: #fff; }
  .tog button.on.v-N, .tog button.on.v-NON { background: var(--ko); border-color: var(--ko); color: #fff; }
  .tog button.on.v-SO { background: var(--so); border-color: var(--so); color: #fff; }
  .tog.large button { padding: 2px 10px; font-size: 12px; }

  /* Points */
  table.pts { width: 100%; border-collapse: collapse; }
  table.pts th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--gris); font-weight: 700; padding: 4px 4px; border-bottom: 1px solid var(--bord); }
  table.pts td { padding: 4px 4px; border-bottom: 1px solid #eef0f4; vertical-align: middle; }
  table.pts td.lib { width: 40%; }
  table.pts tr.sous td.lib { padding-left: 18px; }
  table.pts tr.titre td { font-weight: 700; color: var(--marine); padding-top: 8px; }
  table.pts tr.bloc td { font-size: 10.5px; font-weight: 700; color: var(--marine); background: var(--pale); text-transform: uppercase; letter-spacing: .04em; }
  table.pts input.dt { border: 1px solid var(--bord); border-radius: 3px; padding: 1px 3px; font-size: 11px; width: 148px; }
  table.pts input.com { border: 1px solid transparent; border-radius: 3px; padding: 1px 4px; width: 100%; font-size: 11.5px; background: transparent; }
  table.pts input.com:hover, table.pts input.com:focus { border-color: var(--bord); background: #fff; }
  table.pts .qui { font-size: 11px; color: var(--gris); white-space: nowrap; }
  .badge-liv { display: inline-block; margin-left: 6px; font-size: 10px; font-weight: 700; color: var(--marine); background: var(--pale); border: 1px solid var(--bord); border-radius: 8px; padding: 0 6px; white-space: nowrap; }

  /* Courrier de recevabilité : aperçu modifiable */
  .courrier { background: #fff; border: 1px solid var(--bord); border-radius: 5px; padding: 10px; margin-top: 8px; }
  .courrier .ligne { align-items: flex-start; }
  .courrier label.lbl { padding-top: 4px; }
  .courrier input[type=text], .courrier textarea { flex: 1; min-width: 200px; }
  .courrier textarea.corps { min-height: 260px; }
  .courrier textarea.court { min-height: 46px; }

  .statusbar { position: sticky; bottom: 0; margin-top: 8px; padding: 5px 10px; font-size: 11.5px; background: #fff; border: 1px solid var(--bord); border-radius: 5px; color: var(--gris); min-height: 26px; }
  .statusbar.error { color: var(--ko); background: var(--ko-bg); }
  .config { display: none; background: #fff; border: 1px solid var(--bord); border-radius: 6px; padding: 10px; margin-bottom: 10px; }
  .config input { width: 100%; border: 1px solid var(--bord); border-radius: 4px; padding: 4px 6px; margin: 6px 0; }
</style>
</head>
<body>

<div id="empty" class="empty">Sélectionnez une revue de dossier.</div>

<div id="config" class="config">
  <b>Configuration</b> — adresse du document Grist, pour les liens vers les autres pages
  (stockée dans ce document, jamais dans le dépôt) :
  <input id="config-url" type="text" placeholder="https://…getgrist.com/…/Evaluations" />
  <button id="config-save" class="btn">Enregistrer</button>
  <button id="config-cancel" class="btn sec2">Annuler</button>
</div>

<div id="main" style="display:none"></div>
<div id="status" class="statusbar"></div>

<script>
// Fiche de revue de dossier (TEM-16b) : workflow TEM-404 → recevabilité → proposition
// commerciale (TEM-400) → planification → réalisation et rapport → décision.
// Les points viennent de Referentiels_revue (page 67), les réponses vont dans Revues_points.

const T = {
  REV: 'Revues_de_dossier', REF: 'Referentiels_revue', PTS: 'Revues_points', TEM: 'TEM_404',
  PL: 'Propositions_commerciales', CH: 'Propositions_prestation', EV: 'Evaluations',
  ENT: 'Entreprises', PROG: 'Programmes', QL: 'Qualifications_List', LIS: 'LIS_12',
  UO: 'Unites_d_oeuvre', EVR: 'Evaluateurs',
};
// Pages du document vers lesquelles la fiche renvoie
const PAGES = { tem400: 81, plan: 87, odm: 89, lis: 72 };
const SECTION_LIS = 341;    // section LIS-12 de la page 72 (lien vers le certificat)
const SECTION_TEM400 = 365; // section du widget TEM-400 sur la page 81 (pour ouvrir la bonne demande)

const JALONS = [
  { id: 'Recevabilité',            court: 'Recevabilité' },
  { id: 'Proposition commerciale', court: 'Proposition' },
  { id: 'Planification',           court: 'Planification' },
  { id: 'Réalisation et rapport',  court: 'Réalisation' },
  { id: 'Décision',                court: 'Décision' },
];
const BLOCS_TYPE = { Initiale: 'Initiale', Surveillance: 'Surveillance', Renouvellement: 'Renouvellement' };
const ETATS = { fait: 'fait', encours: 'en cours', avenir: 'à venir', arret: 'arrêté' };
const PL_VALIDEES = new Set(['En cours', 'Envoyée', 'Signée']);
// Décisions qui donnent lieu à un certificat (LIS-12) actif pour le prestataire
const FAVORABLES = new Set(['Certification/qualification initiale immédiate', 'Maintien de la qualification',
  'Renouvellement de la qualification', 'Rétablissement de la qualification']);
const NIVEAU_LIS = { substantiel: 'Substantiel', 'élevé': 'Elevé', 'eleve': 'Elevé' };
const nomPL = p => p.Libelle_PL || `Brouillon non numéroté${p.Date_modification ? ' du ' + new Intl.DateTimeFormat('fr-FR').format(new Date(p.Date_modification * 1000)) : ''}`;

let docUrl = '';
let revId = 0;
let D = null;            // données chargées pour la revue sélectionnée
let ouverts = null;      // jalons dépliés (Set) ; null = déplier le jalon en cours
let writing = false;
let reqId = 0;

grist.ready({ requiredAccess: 'full', onEditOptions: openConfig });
grist.onOptions(opts => {
  docUrl = (opts?.docUrl || '').replace(/\/+$/, '');
  signataire = opts?.signataire || '';
  signataireAttest = opts?.signataireAttestation || '';
  if (D) render();
});
grist.onRecord(async rec => {
  if (!rec?.id) { revId = 0; showEmpty(); return; }
  if (rec.id !== revId) { ouverts = null; courrier = null; attest = null; }
  revId = rec.id;
  await reload();
});

// ── Chargement ─────────────────────────────────────────────────────────────

const rowsOf = t => t.id.map((id, i) => Object.fromEntries(Object.keys(t).map(k => [k, t[k][i]])));
const ids = raw => Array.isArray(raw) ? raw.slice(1).filter(x => x != null) : [];   // RefList / ChoiceList : ['L', …]
const has = (t, col) => Array.isArray(t[col]);

async function reload() {
  const my = ++reqId;
  try {
    const [tabs, gT, gC] = await Promise.all([
      Promise.all(Object.values(T).map(n => grist.docApi.fetchTable(n).catch(() => null))),
      grist.docApi.fetchTable('_grist_Tables').catch(() => null),
      grist.docApi.fetchTable('_grist_Tables_column').catch(() => null),
    ]);
    if (my !== reqId) return;
    const t = Object.fromEntries(Object.keys(T).map((k, i) => [k, tabs[i]]));
    choixProposition = readChoices(gT, gC, T.REV, 'Proposition');
    for (const k of ['REV', 'REF', 'PTS']) if (!t[k]) return showEmpty(`Table ${T[k]} introuvable.`);
    D = build(t);
    if (!D) return showEmpty('Revue introuvable.');
    render();
  } catch (e) {
    status('Lecture impossible : ' + (e.message || e), 'error');
  }
}

let choixProposition = [];

function readChoices(gT, gC, tableId, colId) {
  if (!gT?.id || !gC?.id) return [];
  const tRef = gT.id[gT.tableId.indexOf(tableId)];
  const i = gC.id.findIndex((_, k) => gC.parentId[k] === tRef && gC.colId[k] === colId);
  try { return i < 0 ? [] : JSON.parse(gC.widgetOptions[i] || '{}').choices || []; } catch { return []; }
}

// Jalon d'un point quand la colonne Jalon n'existe pas encore (même règle que le pré-remplissage)
function jalonDefaut(p) {
  if (p.Etape === 'Etape_1') return 'Recevabilité';
  if (p.Etape === 'Etape_2') return /^contrat/i.test(p.Libelle || '') ? 'Proposition commerciale' : 'Planification';
  if (p.Etape === 'Etape_3') return /recevabilit/i.test(p.Libelle || '') ? 'Recevabilité' : 'Réalisation et rapport';
  return 'Décision';
}

function build(t) {
  const rev = rowsOf(t.REV).find(r => r.id === revId);
  if (!rev) return null;
  const cols = {
    jalon: has(t.REF, 'Jalon'), livrable: has(t.REF, 'Livrable'),
    dateVerif: has(t.PTS, 'Date_verif'), verifiePar: has(t.PTS, 'Verifie_par'),
    recevable: has(t.REV, 'Recevable'), dateRecev: has(t.REV, 'Date_recevabilite'),
    dateRapport: has(t.REV, 'Date_livraison_rapport'), lienRapport: has(t.REV, 'Lien_rapport'),
    certificat: has(t.REV, 'Certificat'),
  };
  const ent  = t.ENT  ? new Map(rowsOf(t.ENT).map(r => [r.id, r])) : new Map();
  const prog = t.PROG ? new Map(rowsOf(t.PROG).map(r => [r.id, String(r.Nom_du_programme || '')])) : new Map();
  const tem  = t.TEM ? rowsOf(t.TEM).find(r => r.id === rev.Demande) ?? null : null;
  const evRows = t.EV ? rowsOf(t.EV) : [];
  const evRev  = evRows.find(e => e.id === rev.Evaluation) ?? null;
  // Certificat produit (LIS-12) : la revue peut n'avoir ni TEM-404 ni évaluation (certificats déjà délivrés)
  const lisRows = t.LIS ? rowsOf(t.LIS) : [];
  const cert = lisRows.find(l => l.id === rev.Certificat) ?? null;
  const entId = tem?.Entreprise || evRev?.Entreprise || cert?.Denomination || 0;

  const pls = t.PL && tem ? rowsOf(t.PL).filter(p => p.TEM_404 === tem.id) : [];
  const chById = t.CH ? new Map(rowsOf(t.CH).map(r => [r.id, r])) : new Map();
  const chs = pls.filter(p => p.Statut !== 'Annulée')
    .flatMap(p => ids(p.Prestations).map(id => chById.get(id)).filter(Boolean))
    .filter(c => c.Statut !== 'Annulée');
  const evals = new Map(chs.map(c => [c.id, evRows.filter(e => e.PO === c.id)]));
  const evalsLiees = [...new Set([...(evRev ? [evRev] : []), ...[...evals.values()].flat()])];

  const progIds = new Set([...ids(tem?.PROGRAMME), ...chs.map(c => c.Programme), ...evalsLiees.map(e => e.Programme), cert?.Programme].filter(Boolean));
  // Certificats proposés : ceux de l'entreprise, sur les programmes de la revue s'ils sont connus
  const certs = lisRows.filter(l => entId && l.Denomination === entId && (!progIds.size || progIds.has(l.Programme) || l.id === rev.Certificat))
    .sort((a, b) => (b.Date_Delivrance || 0) - (a.Date_Delivrance || 0));
  const types = new Set([...chs, ...evalsLiees].flatMap(x => ids(x.Type_d_evaluation)));
  const blocs = new Set(['General', 'Rapport', ...[...types].map(x => BLOCS_TYPE[x]).filter(Boolean)]);
  const blocsConnus = [...types].some(x => BLOCS_TYPE[x]);

  const refs = rowsOf(t.REF)
    .filter(p => p.Actif !== false)
    .filter(p => !ids(p.Programmes).length || ids(p.Programmes).some(x => progIds.has(x)))
    .filter(p => !blocsConnus || blocs.has(p.Bloc || 'General'))
    .map(p => ({ ...p, jalon: (cols.jalon && p.Jalon) || jalonDefaut(p), titre: /:\s*$/.test(p.Libelle || '') }))
    .sort((a, b) => (a.Etape || '').localeCompare(b.Etape || '') || blocOrdre(a.Bloc) - blocOrdre(b.Bloc) || (a.Ordre || 0) - (b.Ordre || 0));
  const reponses = new Map(rowsOf(t.PTS).filter(r => r.Revue === revId).map(r => [r.Point, r]));

  const lastEv = Math.max(0, ...evRows.map(e => +(/^\d{4}EV(\d{4})/.exec(e.Libelle || '')?.[1] || 0) || 0));
  const qlRows = t.QL ? rowsOf(t.QL) : [];
  const qualifs = new Map(qlRows.map(r => [r.id, String(r.Qualifications || '')]));
  const qlParCode = new Map(qlRows.filter(r => r.Qualification_code).map(r => [String(r.Qualification_code), r.id]));

  // Jours bloqués et évaluateurs affectés par évaluation, à comparer aux jours vendus (JH_vendus) :
  // une ligne Unites_d_oeuvre « observateur » (OBS seul) ne compte pas, comme dans le planning.
  const evrRows = t.EVR ? rowsOf(t.EVR) : [];
  const evrById = new Map(evrRows.map(r => [r.id, r]));
  const nomEvr = id => { const e = evrById.get(id); return e ? (e.Evaluateur_Trigramme || [e.Evaluateur_Prenom, e.Evaluateur_Nom].filter(Boolean).join(' ')) : '?'; };
  const fonctionUO = u => u.RE ? 'RE' : ids(u.ETA).length ? 'ETA' : ids(u.ETM).length ? 'ETM' : ids(u.OBS).length ? 'OBS' : null;
  const blocageParEval = new Map();
  for (const u of (t.UO ? rowsOf(t.UO) : [])) {
    if (!u.Evaluation) continue;
    const f = fonctionUO(u);
    if (!f || f === 'OBS') continue;
    const b = blocageParEval.get(u.Evaluation) || { jours: 0, evaluateurs: new Set() };
    b.jours += Number(u.Jours) || 0;
    (f === 'RE' ? [u.RE] : ids(u[f])).forEach(id => b.evaluateurs.add(id));
    blocageParEval.set(u.Evaluation, b);
  }

  return { rev, tem, ent, entId, cert, certs, prog, pls, chs, chById, qualifs, qlParCode, evals, evalsLiees, evRows, progIds, types, blocsConnus, refs, reponses, cols, lastEv, nomEvr, blocageParEval };
}

const BLOC_ORDRE = ['General', 'Initiale', 'Surveillance', 'Renouvellement', 'Rapport'];
const blocOrdre = b => { const i = BLOC_ORDRE.indexOf(b || 'General'); return i < 0 ? 99 : i; };

// ── États des jalons ───────────────────────────────────────────────────────

const repondu = p => { const r = D.reponses.get(p.id); return !!(r && r.Present && r.Conforme); };
const pointsDe = j => D.refs.filter(p => p.jalon === j && !p.titre);

function etatJalons() {
  const r = D.rev;
  const plSignee = D.pls.some(p => p.Statut === 'Signée');
  // Proposition validée dans le TEM-400 (statut En cours, Envoyée ou Signée) : la recevabilité est acquise
  const plValidee = D.pls.some(p => PL_VALIDEES.has(p.Statut));
  const out = {};
  const base = j => {
    const pts = pointsDe(j);
    const n = pts.filter(repondu).length;
    const dates = pts.map(p => D.reponses.get(p.id)?.Date_verif).filter(Boolean);
    return { n, total: pts.length, date: dates.length ? Math.max(...dates) : null, entame: n > 0 || pts.some(p => D.reponses.has(p.id)) };
  };
  const st = (b, fait, entame, arret = false) => ({ ...b, etat: arret ? 'arret' : fait ? 'fait' : (entame || b.entame) ? 'encours' : 'avenir' });

  const rec = base('Recevabilité');
  const recevable = D.cols.recevable ? r.Recevable : (rec.n === rec.total && rec.total ? 'OUI' : '');
  const dateValid = Math.max(0, ...D.pls.filter(p => PL_VALIDEES.has(p.Statut)).map(p => p.Date_modification || p.Date_creation || 0)) || null;
  out['Recevabilité'] = st({ ...rec, date: (D.cols.dateRecev && r.Date_recevabilite) || rec.date || dateValid },
    plValidee || (!!recevable && rec.n === rec.total), !!recevable, recevable === 'NON' && !plValidee);
  const stop1 = recevable === 'NON';

  const pro = base('Proposition commerciale');
  out['Proposition commerciale'] = stop1 ? { ...pro, etat: 'avenir' }
    : st({ ...pro, date: r.Offre_date || pro.date }, plSignee && pro.n === pro.total, D.pls.length > 0 || !!r.Decision_offre, r.Decision_offre === 'NON');
  const stop2 = stop1 || r.Decision_offre === 'NON';

  const pla = base('Planification');
  const toutesEvals = D.chs.length > 0 && D.chs.every(c => D.evals.get(c.id)?.length) || (!D.chs.length && D.evalsLiees.length > 0);
  out['Planification'] = stop2 ? { ...pla, etat: 'avenir' } : st(pla, toutesEvals && pla.n === pla.total, D.evalsLiees.length > 0);

  const rea = base('Réalisation et rapport');
  const livre = D.cols.dateRapport && r.Date_livraison_rapport;
  out['Réalisation et rapport'] = stop2 ? { ...rea, etat: 'avenir' }
    : st({ ...rea, date: livre || rea.date }, !!livre && rea.n === rea.total, !!livre);

  const dec = base('Décision');
  out['Décision'] = stop2 ? { ...dec, etat: 'avenir' }
    : st({ ...dec, date: r.Date_decision || dec.date }, !!r.Date_decision && dec.n === dec.total, !!r.Proposition);
  return out;
}

// ── Rendu ──────────────────────────────────────────────────────────────────

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtD = s => s ? new Intl.DateTimeFormat('fr-FR', { timeZone: 'UTC', day: '2-digit', month: '2-digit', year: 'numeric' }).format(new Date(s * 1000)) : '';
const fmtDT = s => s ? new Intl.DateTimeFormat('fr-FR', { timeZone: 'Europe/Paris', day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }).format(new Date(s * 1000)) : '';
const fmtE = n => (Number(n) || 0).toLocaleString('fr-FR', { maximumFractionDigits: 0 }) + ' € HT';
// datetime-local dans le fuseau du navigateur (celui de l'utilisateur, Paris en pratique)
const toLocalInput = s => { if (!s) return ''; const d = new Date(s * 1000); const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const toDateInput = s => s ? new Date(s * 1000).toISOString().slice(0, 10) : '';
const dateToSec = v => v ? Date.UTC(+v.slice(0, 4), +v.slice(5, 7) - 1, +v.slice(8, 10)) / 1000 : null;
const today = () => { const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / 1000; };
const pageLink = (page, hash = '') => docUrl ? `${docUrl}/p/${page}${hash}` : '';

function tog(act, current, values, extra = '', large = false) {
  return `<span class="tog${large ? ' large' : ''}">` + values.map(v =>
    `<button class="v-${v}${current === v ? ' on' : ''}" data-act="${act}" data-v="${v}" ${extra}>${v}</button>`).join('') + '</span>';
}

function render() {
  const { rev, tem, ent } = D;
  document.getElementById('empty').style.display = 'none';
  const main = document.getElementById('main');
  main.style.display = 'block';
  const etats = etatJalons();
  if (!ouverts) {
    const courant = JALONS.find(j => etats[j.id].etat === 'encours') ?? JALONS.find(j => etats[j.id].etat === 'avenir') ?? JALONS[0];
    ouverts = new Set([courant.id]);
  }
  const entreprise = String(ent.get(D.entId)?.Denomination || '');
  const progs = [...D.progIds].map(id => D.prog.get(id)).filter(Boolean).join(', ');
  const types = [...D.types].join(', ');

  let h = `<div class="entete">
    <button class="gear" data-act="config">⚙</button>
    <h1>Revue de dossier — ${esc(tem?.NumTEM404 || 'sans TEM-404')}</h1>
    <div class="sous">${esc(entreprise || '?')} · ${esc(progs || 'programme ?')}${types ? ' · ' + esc(types) : ''}
      ${tem?.Date_Reception ? ' · reçu le ' + fmtD(tem.Date_Reception) : ''}</div>
    <div class="frise">${JALONS.map((j, i) => {
      const e = etats[j.id];
      return `<div class="jal ${e.etat}" data-act="goto" data-j="${esc(j.id)}" title="${esc(j.id)} : ${ETATS[e.etat]}">
        <b>${i + 1}. ${esc(j.court)}</b><small>${e.etat === 'fait' ? '✔ ' + fmtD(e.date) : ETATS[e.etat]}${e.total ? ` · ${e.n}/${e.total}` : ''}</small></div>`;
    }).join('')}</div>
    ${!D.cols.dateVerif ? '<div class="warn">Colonnes Date_verif / Verifie_par absentes de Revues_points : horodatage désactivé.</div>' : ''}
    ${!D.refs.length ? '<div class="warn">Aucun point applicable : vérifier les colonnes Programmes et Actif de Referentiels_revue (page 67).</div>' : ''}
  </div>`;

  JALONS.forEach((j, i) => {
    const e = etats[j.id];
    h += `<details class="sec" data-j="${esc(j.id)}"${ouverts.has(j.id) ? ' open' : ''}>
      <summary>${i + 1}. ${esc(j.id)} <span class="pastille ${e.etat}">${ETATS[e.etat]}</span>
        <span class="cpt">${e.total ? `${e.n}/${e.total} point(s)` : ''}</span></summary>
      <div class="corps">${panneau(j.id)}${tablePoints(j.id)}</div></details>`;
  });
  main.innerHTML = h;
}

function tablePoints(j) {
  const pts = D.refs.filter(p => p.jalon === j);
  if (!pts.length) return '<div class="info">Aucun point de vérification pour ce jalon.</div>';
  let bloc = null;
  const rows = pts.map(p => {
    let pre = '';
    if (j === 'Réalisation et rapport' && (p.Bloc || 'General') !== bloc) {
      bloc = p.Bloc || 'General';
      pre = `<tr class="bloc"><td colspan="6">${esc(bloc === 'General' ? 'Général' : bloc)}</td></tr>`;
    }
    if (p.titre) return pre + `<tr class="titre"><td colspan="6">${esc(p.Libelle)}</td></tr>`;
    const r = D.reponses.get(p.id) || {};
    const liv = D.cols.livrable && p.Livrable ? `<span class="badge-liv">📄 ${esc(p.Livrable)}</span>` : '';
    return pre + `<tr class="${p.Sous_point ? 'sous' : ''}" data-pt="${p.id}">
      <td class="lib">${esc(p.Libelle)}${liv}</td>
      <td>${tog('present', r.Present, ['O', 'N', 'SO'])}</td>
      <td>${tog('conforme', r.Conforme, ['O', 'N', 'SO'])}</td>
      <td>${D.cols.dateVerif ? `<input class="dt" type="datetime-local" data-act="date" value="${toLocalInput(r.Date_verif)}">` : ''}</td>
      <td class="qui">${esc(r.Verifie_par || '')}</td>
      <td><input class="com" type="text" data-act="com" value="${esc(r.Commentaire || '')}" placeholder="Commentaire"></td>
    </tr>`;
  }).join('');
  return `<table class="pts"><thead><tr><th>Point</th><th>Présent</th><th>Conforme</th><th>Vérifié le</th><th>Par</th><th>Commentaire</th></tr></thead><tbody>${rows}</tbody></table>`;
}

const j1 = x => (Math.round(x * 10) / 10).toString().replace('.', ',');
// État rapide « jours bloqués / évaluateurs » pour une évaluation, à comparer aux jours vendus (JH_vendus).
function ligneBlocage(e) {
  const b = D.blocageParEval.get(e.id);
  const jours = b ? b.jours : 0, vendus = Number(e.JH_vendus) || 0;
  const noms = b && b.evaluateurs.size ? [...b.evaluateurs].map(D.nomEvr).sort().join(', ') : 'aucun évaluateur bloqué';
  const etat = !vendus ? 'avenir' : jours >= vendus ? 'fait' : jours > 0 ? 'encours' : 'arret';
  return `<div class="info">⏱ <span class="pastille ${etat}">${j1(jours)} / ${vendus ? j1(vendus) : '?'} j vendu(s)</span> · ${esc(noms)}</div>`;
}
function champDate(col, val, titre) {
  return `<label class="lbl">${esc(titre)}</label><input type="date" data-act="rev-date" data-col="${col}" value="${toDateInput(val)}">`;
}
function champTexte(col, val, titre, area = false) {
  return area
    ? `<label class="lbl">${esc(titre)}</label><textarea data-act="rev-txt" data-col="${col}">${esc(val || '')}</textarea>`
    : `<label class="lbl">${esc(titre)}</label><input type="text" data-act="rev-txt" data-col="${col}" value="${esc(val || '')}">`;
}

function panneau(j) {
  const r = D.rev, c = D.cols;
  if (j === 'Recevabilité') {
    return `<div class="livrable"><h3>📄 Recevabilité</h3>
      ${c.recevable ? `<div class="ligne"><label class="lbl">Dossier recevable</label>${tog('rev-choix', r.Recevable, ['OUI', 'NON'], 'data-col="Recevable" data-date="Date_recevabilite"', true)}
        ${c.dateRecev ? champDate('Date_recevabilite', r.Date_recevabilite, 'le') : ''}</div>`
        : '<div class="warn">Colonnes Recevable / Date_recevabilite à créer dans Revues_de_dossier.</div>'}
      <div class="ligne"><button class="btn${courrier ? ' sec2' : ''}" data-act="courrier" ${progsDemandes().length ? '' : 'disabled title="Aucun programme demandé lisible dans le TEM-404"'}>${courrier ? 'Fermer le courrier' : '✉ Préparer le courrier de recevabilité'}</button></div>
      ${courrier ? editeurCourrier() : ''}
    </div>`;
  }
  if (j === 'Proposition commerciale') {
    const lien = D.tem ? pageLink(PAGES.tem400, `#a1.s${SECTION_TEM400}.r${D.tem.id}`) : '';
    const retenu = D.pls.find(p => PL_VALIDEES.has(p.Statut));
    const pls = D.pls.length
      ? `<table class="liste">${D.pls.map(p => `<tr><td><b>${esc(nomPL(p))}</b>${p.id === retenu?.id ? ' <span class="badge-liv">✔ devis retenu</span>' : ''}</td><td>${fmtE(p.Montant_HT)}${PL_VALIDEES.has(p.Statut) ? '' : ' <span class="info">(indicatif)</span>'}</td>
          <td><span class="pastille ${p.Statut === 'Signée' ? 'fait' : p.Statut === 'Annulée' ? 'arret' : PL_VALIDEES.has(p.Statut) ? 'encours' : 'avenir'}">${esc(p.Statut || '?')}</span></td>
          <td class="info">${p.Date_creation ? 'créée le ' + fmtD(p.Date_creation) : ''}</td>
          <td>${p.Statut === 'Brouillon' ? `<button class="btn sec2" data-act="valider-devis" data-pl="${p.id}">Valider le devis</button>` : ''}
            ${PL_VALIDEES.has(p.Statut) && p.Statut !== 'Signée' ? `<button class="btn sec2" data-act="signer-devis" data-pl="${p.id}">✔ Marquer signée</button>` : ''}</td></tr>`).join('')}</table>`
      : '<div class="info">Aucune proposition enregistrée par le TEM-400 pour cette demande.</div>';
    const etatPL = D.pls.some(p => p.Statut === 'Signée') ? '✔ Proposition signée.'
      : retenu ? `✔ Devis validé : ${nomPL(retenu)} (${fmtE(retenu.Montant_HT)}) — en attente de signature.`
      : D.pls.length ? 'Brouillon en cours dans le TEM-400 : la proposition n’est pas encore validée.' : '';
    return `<div class="livrable"><h3>📄 Proposition commerciale (TEM-400)</h3>
      <div class="ligne"><label class="lbl">Décision d'offre</label>${tog('rev-choix', r.Decision_offre, ['OUI', 'NON'], 'data-col="Decision_offre" data-date="Offre_date"', true)}
        ${champDate('Offre_date', r.Offre_date, 'le')}</div>
      <div class="ligne">${champTexte('Just_offre', r.Just_offre, 'Justification', true)}</div>
      ${pls}
      ${etatPL ? `<div class="ligne"><span class="${etatPL.startsWith('✔') ? 'info' : 'warn'}">${etatPL}</span></div>` : ''}
      <div class="ligne">${lien ? `<a class="lien" href="${esc(lien)}" target="_blank" rel="noopener">${D.pls.length ? 'Ouvrir' : 'Créer'} la proposition dans le TEM-400 ↗</a>`
        : `<span class="info">${D.tem ? 'Adresse du document à renseigner (⚙) pour le lien vers le TEM-400.' : 'Revue sans TEM-404.'}</span>`}</div>
    </div>`;
  }
  if (j === 'Planification') {
    const lignes = D.chs.map(ch => {
      const evs = D.evals.get(ch.id) || [];
      const prog = D.prog.get(ch.Programme) || '?';
      const typ = ids(ch.Type_d_evaluation).join(', ');
      return `<tr><td><b>${esc(prog)}</b> ${esc(typ)}<div class="info">${esc(ch.Libelle_CH || ch.libelle || '')}</div></td>
        <td>${evs.length ? evs.map(e => `${esc(e.Libelle || 'Évaluation ' + e.id)} <span class="pastille ${e.Statut === 'Terminé' ? 'fait' : 'encours'}">${esc(e.Statut || '')}</span>${ligneBlocage(e)}`).join('<br>')
          : `<button class="btn" data-act="creer-eval" data-ch="${ch.id}">Créer l'évaluation</button>
             <div class="info">Portées du TEM-404 : ${esc(porteesDemandees(ch.Programme).map(id => D.qualifs.get(id)).join(', ') || 'aucune cochée')}</div>`}</td></tr>`;
    }).join('');
    const sansCH = !D.chs.length && D.evalsLiees.length
      ? `<table class="liste">${D.evalsLiees.map(e => `<tr><td>${esc(e.Libelle)}</td><td><span class="pastille encours">${esc(e.Statut || '')}</span>${ligneBlocage(e)}</td></tr>`).join('')}</table>` : '';
    const lp = pageLink(PAGES.plan), lo = pageLink(PAGES.odm);
    return `<div class="livrable"><h3>📄 Évaluation(s), plan d'évaluation, ordres de mission</h3>
      ${lignes ? `<table class="liste">${lignes}</table>` : sansCH || '<div class="info">Aucune prestation : la proposition commerciale doit d’abord être enregistrée dans le TEM-400.</div>'}
      <div class="ligne">${lp ? `<a class="lien" href="${esc(lp)}" target="_blank" rel="noopener">Plan d'évaluation ↗</a>` : ''}
        ${lo ? `<a class="lien" href="${esc(lo)}" target="_blank" rel="noopener">Ordres de mission ↗</a>` : ''}</div>
    </div>`;
  }
  if (j === 'Réalisation et rapport') {
    const evs = D.evalsLiees.length ? `<table class="liste">${D.evalsLiees.map(e => `<tr><td>${esc(e.Libelle)}</td><td>${e.Date_Debut_prevue ? fmtD(e.Date_Debut_prevue) : ''}${e.Date_fin_prevue ? ' → ' + fmtD(e.Date_fin_prevue) : ''}</td>
        <td><span class="pastille ${e.Statut === 'Terminé' ? 'fait' : 'encours'}">${esc(e.Statut || '')}</span></td></tr>`).join('')}</table>` : '';
    return `<div class="livrable"><h3>📄 Rapport d'évaluation</h3>
      ${evs}
      ${c.dateRapport ? `<div class="ligne">${champDate('Date_livraison_rapport', r.Date_livraison_rapport, 'Rapport livré le')}
        <button class="btn sec2" data-act="rapport-auj">Livré aujourd'hui</button></div>` : '<div class="warn">Colonnes Date_livraison_rapport / Lien_rapport à créer dans Revues_de_dossier.</div>'}
      ${c.lienRapport ? `<div class="ligne">${champTexte('Lien_rapport', r.Lien_rapport, 'Lien du rapport')}
        ${/^https?:\/\//.test(r.Lien_rapport || '') ? `<a class="lien" href="${esc(r.Lien_rapport)}" target="_blank" rel="noopener">Ouvrir ↗</a>` : ''}</div>` : ''}
      <div class="ligne"><button class="btn${attest ? ' sec2' : ''}" data-act="attest" ${D.evalsLiees.length ? '' : 'disabled title="Aucune évaluation rattachée à cette revue"'}>${attest ? 'Fermer l’attestation' : '🧾 Préparer une attestation de déroulement des activités'}</button></div>
      ${attest ? editeurAttest() : ''}
    </div>`;
  }
  // Décision
  return `<div class="livrable"><h3>📄 Décision</h3>
    <div class="ligne"><label class="lbl">Proposition</label>${choixProposition.length
      ? `<span class="tog large" style="flex-wrap:wrap">${choixProposition.map(v => `<button class="v-OUI${r.Proposition === v ? ' on' : ''}" data-act="rev-choix" data-col="Proposition" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</span>`
      : champTexte('Proposition', r.Proposition, '')}</div>
    <div class="ligne">${champTexte('Decideur', r.Decideur, 'Décideur')} ${champDate('Date_decision', r.Date_decision, 'le')}</div>
    <div class="ligne">${champTexte('Just_finale', r.Just_finale, 'Justification', true)}</div>
    ${blocCertificat()}
    <div class="ligne"><button class="btn sec2" disabled title="À venir">Exporter la revue TEM-16b en PDF (à venir)</button></div>
  </div>`;
}

// Certificat produit, tenu dans le LIS-12 (page 72)
function blocCertificat() {
  if (!D.cols.certificat) return '<div class="warn">Colonne Certificat (Réf. LIS_12) à créer dans Revues_de_dossier.</div>';
  const c = D.cert, lib = l => [l.numero_attestation || 'n° de certificat à attribuer', D.prog.get(l.Programme),
    l.Date_Delivrance ? 'délivré le ' + fmtD(l.Date_Delivrance) : ''].filter(Boolean).join(' · ');
  const opts = D.certs.map(l => `<option value="${l.id}"${l.id === D.rev.Certificat ? ' selected' : ''}>${esc(lib(l))}</option>`).join('');
  const lien = c ? pageLink(PAGES.lis, `#a1.s${SECTION_LIS}.r${c.id}`) : '';
  return `<div class="ligne"><label class="lbl">Certificat (LIS-12)</label>
      <select data-act="rev-cert"><option value="">— aucun —</option>${opts}</select>
      ${lien ? `<a class="lien" href="${esc(lien)}" target="_blank" rel="noopener">Ouvrir dans le LIS-12 ↗</a>` : ''}</div>
    ${!D.certs.length ? `<div class="info">Aucune ligne LIS-12 pour ${D.entId ? 'cette entreprise' : 'une entreprise inconnue'}${D.progIds.size ? ' sur ce programme' : ''}.</div>` : ''}
    ${c ? `<div class="ligne info">N° de certificat : <b>${esc(c.numero_attestation || 'à attribuer')}</b>
      · Décision ANSSI : ${c.N_decision_ANSSI ? esc(String(c.N_decision_ANSSI)) : 'à renseigner'}
      · Validité : ${c.Date_Delivrance ? fmtD(c.Date_Delivrance) : '?'} → ${c.Date_Fin ? fmtD(c.Date_Fin) : '?'}</div>` : ''}
    <div class="ligne"><button class="btn" data-act="ajouter-lis12" ${boutonLis12Desactive()}>➕ Ajouter le prestataire au LIS-12 (certificats émis)</button>
      <span class="info">Crée une ligne par programme (entreprise, programme, niveau, portées, validité 3 ans) ; n° d'attestation et référentiel restent à compléter dans le LIS-12.</span></div>`;
}
function boutonLis12Desactive() {
  if (!FAVORABLES.has(D.rev.Proposition)) return `disabled title="Décision non favorable : choisir d’abord une proposition de certification/maintien/renouvellement/rétablissement"`;
  if (!D.entId || !D.progIds.size) return `disabled title="Entreprise ou programme inconnu pour cette revue"`;
  return '';
}

// ── Courrier de recevabilité ───────────────────────────────────────────────
// Texte repris du modèle « Courrier_Recevabilité_PASSI_V2 » ; tout est modifiable avant le PDF.
// Le signataire est une option du widget (document Grist), pas une donnée du dépôt.

const PROG_NOMS = { passi: 'PASSI', pacs: 'PACS', pris: 'PRIS', pdis: 'PDIS', pams: 'PAMS' };
const CIVILITES = {
  M:  { label: 'Monsieur', abr: 'M.',  salut: 'Cher Monsieur,',   apos: 'cher Monsieur' },
  F:  { label: 'Madame',   abr: 'Mme', salut: 'Chère Madame,',    apos: 'chère Madame' },
  MF: { label: 'Madame, Monsieur', abr: '', salut: 'Madame, Monsieur,', apos: 'Madame, Monsieur' },
};
const EXPEDITEUR = ['CERTI-TRUST France', '33, avenue de Wagram', '75017 Paris – France', 'Tél. : +33 (0)1 86 86 22 08', 'E-mail : contact@certi-trust.com', 'Site : www.certi-trust.com'];
const PIED = ['Certi-Trust France SAS 33, Avenue de Wagram - 75017 Paris, France', 'Tél. : +33 (0)1 86 86 22 08 – e-mail : administration.france@certi-trust.com'];
const BLEU = '#3B5BAB';
let courrier = null;    // { prog, civ, date, dest, objet, salut, corps, signature }
let signataire = '';    // option du widget

function jsonTem() { try { return JSON.parse(D.tem?.Json_Complet || '{}'); } catch { return {}; } }
const val = v => (v == null || v === '-' ? '' : String(v).trim());
function progsDemandes() {
  const j = jsonTem();
  return Object.keys(PROG_NOMS).filter(k => j[`b.${k}.demande`] === true);
}

// Un seul courrier pour tous les programmes demandés dans le TEM-404 (progs : clés de PROG_NOMS).
const enumerer = l => l.length > 1 ? l.slice(0, -1).join(', ') + ' et ' + l[l.length - 1] : (l[0] || '');
function texteCourrier(progs, civ) {
  const j = jsonTem(), c = CIVILITES[civ];
  const refs = progs.map(prog => {
    const version = val(j[`b.${prog}.version`]), niveau = val(j[`b.${prog}.niveau`]);
    return { P: PROG_NOMS[prog], version, ref: `${PROG_NOMS[prog]}${version ? ' v' + version : ''}${niveau ? ' au niveau ' + niveau : ''}` };
  });
  const plur = refs.length > 1, Ps = enumerer(refs.map(r => r.P));
  const nom = [val(j['contact.representant_legal.prenom']), val(j['contact.representant_legal.nom'])].filter(Boolean).join(' ');
  const d = new Date(), p2 = n => String(n).padStart(2, '0');
  return {
    progs, civ,
    date: `Paris, le ${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${String(d.getFullYear()).slice(2)}`,
    dest: [`À l’attention de ${[c.abr, nom].filter(Boolean).join(' ')}`, val(j['demandeur.nom']) || String(D.ent.get(D.tem?.Entreprise)?.Denomination || ''),
           val(j['demandeur.adresse1']), val(j['demandeur.adresse2']), [val(j['demandeur.code_postal']), val(j['demandeur.ville'])].filter(Boolean).join(' ')]
           .filter(Boolean).join('\n'),
    objet: `Attestation de recevabilité administration pour ${plur ? 'les qualifications' : 'la qualification'} ${enumerer(refs.map(r => r.P + (r.version ? ' ' + r.version : '')))}.`,
    salut: c.salut,
    corps: [
      plur
        ? `Nous avons le plaisir de vous informer de notre décision favorable quant à la recevabilité de votre demande de qualification selon les référentiels suivants :\n`
          + refs.map((r, i) => `• ${r.ref}${i === refs.length - 1 ? '.' : ' ;'}`).join('\n')
        : `Nous avons le plaisir de vous informer de notre décision favorable quant à la recevabilité de votre demande de qualification selon le référentiel ${refs[0].ref}.`,
      `Par ailleurs, conformément aux termes de notre Règlement de certification, nous vous rappelons que vous disposez d'un délai de douze (12) mois à compter de la décision de recevabilité pour obtenir ${plur ? 'les qualifications' : 'la qualification'} ${Ps}. Passé ce délai, nous serons amenés, le cas échéant, à devoir procéder à une nouvelle étude de recevabilité.`,
      `Pour ce qui concerne la suite à donner au processus de qualification en cours, nous vous confirmons que notre équipe d’évaluation prendra contact dans les prochains jours avec les représentants de votre organisation pour établir la planification et préparer la réalisation de l'audit siège, de l’observation témoin et des autres étapes jusqu’à la qualification éventuelle.`,
      `En vous remerciant de votre confiance, nous restons à votre disposition pour répondre à toute question ou remarque de votre part et vous prions d'accepter, ${c.apos}, l’expression de nos meilleures salutations.`,
    ].join('\n\n'),
    signature: signataire || 'Le Directeur Cybersécurité,\n[Prénom NOM]',
  };
}

function editeurCourrier() {
  const c = courrier, progs = progsDemandes();
  const champ = (k, titre, type = 'input', cls = '') => type === 'input'
    ? `<div class="ligne"><label class="lbl">${titre}</label><input type="text" data-act="cour-txt" data-k="${k}" value="${esc(c[k])}"></div>`
    : `<div class="ligne"><label class="lbl">${titre}</label><textarea class="${cls}" data-act="cour-txt" data-k="${k}">${esc(c[k])}</textarea></div>`;

const POLICES = 'https://cdn.jsdelivr.net/gh/JulietaUla/Montserrat@v7.222/fonts/ttf/';
const FICHIERS_POLICE = { normal: 'Montserrat-Regular.ttf', bold: 'Montserrat-Bold.ttf', italics: 'Montserrat-Italic.ttf', bolditalics: 'Montserrat-BoldItalic.ttf' };
let pdfPret = null;
const script = src => new Promise((ok, ko) => { const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = () => ko(new Error('chargement ' + src)); document.head.appendChild(el); });
const base64 = buf => { const b = new Uint8Array(buf); let x = ''; for (let i = 0; i < b.length; i += 0x8000) x += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(x); };
async function preparerPdf() {
  if (pdfPret) return pdfPret;
  pdfPret = (async () => {
    if (!window.pdfMake) await script('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js');
    const vfs = {}; let fonts, police = 'Montserrat';
    try {
      const bufs = await Promise.all(Object.values(FICHIERS_POLICE).map(f => fetch(POLICES + f).then(r => { if (!r.ok) throw new Error(f); return r.arrayBuffer(); })));
      Object.values(FICHIERS_POLICE).forEach((f, i) => { vfs[f] = base64(bufs[i]); });
      fonts = { Montserrat: FICHIERS_POLICE };
    } catch {
      await script('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.js');
      Object.assign(vfs, window.pdfMake.vfs || {});
      fonts = { Roboto: { normal: 'Roboto-Regular.ttf', bold: 'Roboto-Medium.ttf', italics: 'Roboto-Italic.ttf', bolditalics: 'Roboto-MediumItalic.ttf' } };
      police = 'Roboto';
    }
    let logo = null;
    try { const r = await fetch('logo.png'); if (r.ok) logo = 'data:image/png;base64,' + base64(await r.arrayBuffer()); } catch { /* sans logo */ }
    return { vfs, fonts, police, logo };
  })();
  try { return await pdfPret; } catch (e) { pdfPret = null; throw e; }
}

// En-tête et pied communs aux documents générés (charte Certi-Trust)
function cadrePdf(res, titre) {
  const filet = (y) => ({ canvas: [{ type: 'line', x1: 0, y1: y, x2: 515, y2: y, lineWidth: 0.6, lineColor: BLEU }] });
  return {
    pageSize: 'A4', pageMargins: [62, 118, 62, 78],
    info: { title: titre, author: 'Certi-Trust France' },
    defaultStyle: { font: res.police, fontSize: 10, color: '#262B38', lineHeight: 1.2 },
    header: () => ({ margin: [40, 28, 40, 0], stack: [
      { columns: [
        res.logo ? { image: res.logo, width: 120 } : { text: 'Certi-Trust', bold: true, color: BLEU, fontSize: 16 },
        { text: 'CONFIANCE DANS L’ÈRE NUMÉRIQUE', italics: true, color: BLEU, fontSize: 7.5, alignment: 'right', margin: [0, 30, 0, 0], characterSpacing: 0.6 },
      ] },
      filet(6),
    ] }),
    footer: () => ({ margin: [40, 18, 40, 0], stack: [
      filet(0),
      { text: PIED.join('\n'), alignment: 'center', color: BLEU, fontSize: 8, margin: [0, 6, 0, 0] },
    ] }),
  };
}

// pdfmake coupe les mots au trait d'union et étire l'espace en justification (« Certi- Trust ») ;
// Montserrat n'a pas de trait d'union insécable : les mots composés passent en noWrap.
const insecable = t => t.split(/(\S*\p{L}-\p{L}\S*)/u).filter(Boolean).map((x, i, a) => /\p{L}-\p{L}/u.test(x) ? { text: x, noWrap: true } : x);

// Paragraphes séparés par une ligne vide ; une ligne commençant par « • » ou « – » est un
// élément de liste (retrait suspendu).
function paragraphesPdf(corps) {
  const out = [];
  corps.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).forEach(p => {
    const lignes = p.split('\n').map(l => l.trim()).filter(Boolean);
    let texte = [];
    const vider = () => { if (texte.length) out.push({ text: insecable(texte.join(' ')), alignment: 'justify', margin: [0, 10, 0, 0] }); texte = []; };
    lignes.forEach(l => {
      const m = /^([•–\-])\s*(.*)$/.exec(l);
      if (!m) { texte.push(l); return; }
      vider();
      out.push({ columns: [{ width: 14, text: m[1] === '-' ? '–' : m[1] }, { width: '*', text: insecable(m[2]), alignment: 'justify' }], margin: [18, 4, 0, 0] });
    });
    vider();
  });
  return out;
}

function definitionCourrier(c, res) {
  return { ...cadrePdf(res, c.objet), content: [
    { stack: EXPEDITEUR.map((t, i) => ({ text: t, bold: i === 0, fontSize: i === 0 ? 10 : 9 })) },
    { text: c.date, alignment: 'right', margin: [0, 8, 0, 0] },
    { text: c.dest, margin: [250, 26, 0, 0] },
    { text: [{ text: 'Objet :', decoration: 'underline', bold: true }, ' ' + c.objet], margin: [0, 34, 0, 0] },
    { text: c.salut, margin: [0, 26, 0, 0] },
    ...paragraphesPdf(c.corps),
    { text: c.signature, margin: [0, 40, 0, 0] },
  ] };
}

function definitionAttest(a, res) {
  return { ...cadrePdf(res, a.titre.replace(/\n/g, ' ')), content: [
    { text: a.titre.toUpperCase(), alignment: 'center', bold: true, color: BLEU, fontSize: 12, lineHeight: 1.35, margin: [0, 0, 0, 0] },
    { text: a.ref, margin: [0, 22, 0, 0] },
    ...paragraphesPdf(a.corps),
    { text: a.date, margin: [0, 18, 0, 0] },
    { text: a.signature, margin: [0, 36, 0, 0] },
  ] };
}

// Garde-fou : les champs entre crochets ([JJ/MM/AAAA], [Prénom NOM]…) restent à compléter
async function genererPdf(kind, bouton) {
  const doc = kind === 'attest' ? attest : courrier;
  if (!doc) return;
  const restes = [...new Set(Object.values(doc).filter(v => typeof v === 'string').flatMap(v => v.match(/\[[^\]\n]{2,40}\]/g) || []))];
  if (restes.length && !window.confirm(`Champs encore à compléter : ${restes.join(', ')}.\n\nGénérer quand même ?`)) return;
  const lib = bouton.textContent;
  bouton.disabled = true; bouton.textContent = 'Génération…';
  try {
    const res = await preparerPdf();
    const d = new Date(), p2 = n => String(n).padStart(2, '0');
    const code = String(D.ent.get(D.tem?.Entreprise)?.code || jsonTem()['demandeur.nom'] || 'CLIENT').replace(/[^\w-]+/g, '_');
    const jour = `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}`;
    const nom = kind === 'attest'
      ? `${jour}_${code}_Attestation_deroulement_${PROG_NOMS[doc.prog] || 'EVAL'}.pdf`
      : `${jour}_${code}_Courrier_Recevabilite_${doc.progs.map(p => PROG_NOMS[p]).join('-')}.pdf`;
    const def = kind === 'attest' ? definitionAttest(doc, res) : definitionCourrier(doc, res);
    const pdf = window.pdfMake.createPdf(def, null, res.fonts, res.vfs);
    try { pdf.download(nom); } catch { pdf.open(); }
    status(`Document généré : ${nom}`);
  } catch (e) {
    status('Erreur PDF : ' + (e.message || e), 'error');
  } finally {
    bouton.disabled = false; bouton.textContent = lib;
  }
}

// ── Attestation de déroulement des activités d'évaluation ─────────────────
// Texte repris du modèle « attestation.docx » ; délivrée quand les activités sont terminées
// et la décision pas encore prise (jalon ④). Une attestation par évaluation.

let attest = null;            // { evalId, prog, titre, ref, corps, date, signature }
let signataireAttest = '';    // option du widget

const DEMARCHES = {
  Initiale: 'de qualification initiale', Renouvellement: 'de renouvellement de sa qualification',
  Surveillance: 'de maintien de sa qualification', 'Complémentaire': 'd’évaluation complémentaire de sa qualification',
  'Extension d’activité': 'd’extension de sa qualification',
};

function texteAttest(evalId) {
  const e = D.evalsLiees.find(x => x.id === evalId) || D.evalsLiees[0];
  const j = jsonTem();
  const nomProg = String(D.prog.get(e.Programme) || '');
  const prog = Object.keys(PROG_NOMS).find(k => nomProg.toUpperCase().startsWith(PROG_NOMS[k])) || progsDemandes()[0] || 'passi';
  const P = PROG_NOMS[prog];
  const version = val(j[`b.${prog}.version`]), niveau = val(j[`b.${prog}.niveau`]).toLowerCase();
  const type = ids(e.Type_d_evaluation)[0] || val(j[`b.${prog}.type_demande`]);
  const ch = D.chById.get(e.PO);
  const contrat = String(ch?.Propale || '').trim() || '[n° de contrat]';
  const dateContrat = ch?.Date_de_signature ? fmtD(ch.Date_de_signature) : '[date du contrat]';
  const ent = D.ent.get(D.tem?.Entreprise || e.Entreprise);
  const societe = val(j['demandeur.nom']) || String(ent?.Denomination || '[société]');
  const siren = val(j['demandeur.siren']) || String(ent?.SIREN || '') || '[SIREN]';
  const portees = [...new Set([...ids(e.Activites_), ...ids(ch?.Activites)])].sort((a, b) => a - b).map(id => D.qualifs.get(id)).filter(Boolean);
  const sig = signataireAttest || '[Prénom NOM]\nDirecteur du centre d’évaluation ANSSI - Certi-Trust';
  const [nom, fonction = ''] = sig.split('\n');
  const d = new Date(), p2 = n => String(n).padStart(2, '0');
  const aujourdhui = `${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${d.getFullYear()}`;
  return {
    evalId: e.id, prog,
    titre: `Attestation relative au déroulement des activités d'évaluation\nen vue de la qualification ${P}`,
    ref: `Réf. : ${contrat} — ${aujourdhui}`,
    corps: [
      `Je soussigné, ${nom}, ${fonction.replace(/\s*-\s*Certi-Trust\s*$/, '')} de Certi-Trust, centre d'évaluation accrédité par le COFRAC et agrée par l'ANSSI pour la réalisation des évaluations ANSSI,`,
      `atteste que la société ${societe} enregistrée sous le numéro de siren ${siren}, est engagée dans une démarche ${DEMARCHES[type] || 'de qualification'} ${P}${version ? ' ' + version : ''}${niveau ? ' au niveau ' + niveau : ''}, sur les portées :\n`
        + (portees.length ? portees.map((x, i) => `• ${x}${i === portees.length - 1 ? '.' : ' ;'}`).join('\n') : '• [portées]'),
      `et fait l'objet d'une évaluation confiée à Certi-Trust dans le cadre du contrat n° ${contrat} en date du ${dateContrat}`,
      `À la date de la présente :\n`
        + `– les activités d'évaluation prévues par le référentiel (audit documentaire, audit sur site, entretiens et, le cas échéant, tests techniques) ont été menées à leur terme sur le plan opérationnel ;\n`
        + `– le rapport d'évaluation est en cours de finalisation et les conclusions ne pourront être prises qu’à partir du prochain comité de certification en date du [JJ/MM/AAAA].\n`
        + `– À ce stade de l'audit, aucune non-conformité majeure non traitée n'a été identifiée ni portée à notre connaissance par l'équipe d'audit.\n`
        + `– Une fois la certification prononcée, sans suivra l’édition, la signature d’un certificat et d'un avis de conformité attestant que le service d’audit de la société ${societe} se conforme aux exigences du référentiel ${P} de l’ANSSI.`,
      `La présente attestation ne constitue ni une décision de qualification ni un engagement quant à son issue. Conformément au référentiel ${P}, la qualification relève de la seule compétence de l'ANSSI, qui se prononce au vu du rapport d'évaluation définitif et du certificat transmis par Certi-Trust.`,
    ].join('\n\n'),
    date: `Fait à Paris, le ${aujourdhui}.`,
    signature: sig,
  };
}

async function apply(actions, msg) {
  if (!actions.length || writing) return null;
  writing = true;
  status('Enregistrement…');
  try {
    const res = await grist.docApi.applyUserActions(actions);
    status(msg);
    return res;
  } catch (e) {
    status("Échec de l'enregistrement : " + (e.message || e), 'error');
    return null;
  } finally {
    writing = false;
  }
}

// Crée une ligne LIS-12 par programme de la revue à partir d'une décision favorable : reprend
// entreprise/programme/niveau/portées connus ; n° d'attestation, référentiel et sécurité
// nationale restent à compléter à la main dans le LIS-12 (pas de règle fiable pour les déduire).
async function ajouterLis12() {
  if (!FAVORABLES.has(D.rev.Proposition) || !D.entId || !D.progIds.size) return;
  const j = jsonTem(), auj = today(), TROIS_ANS = 3 * 365 * 86400;
  const actions = [], noms = [];
  for (const progId of D.progIds) {
    const cle = progCle(progId);
    const niveau = cle ? val(j[`b.${cle}.niveau`]) : '';
    const existant = D.certs.find(c => c.Programme === progId);
    const qualifs = [...new Set(D.evalsLiees.filter(e => e.Programme === progId).flatMap(e => ids(e.Activites_)))];
    const fields = {
      Denomination: D.entId, Programme: progId, Date_Delivrance: auj, Date_Fin: auj + TROIS_ANS,
      Debut_Cycle_Actuel: auj, Qualifie_depuis_le: existant?.Qualifie_depuis_le || auj, Statut: 'active',
      ...(NIVEAU_LIS[niveau.toLowerCase()] ? { Niveau: NIVEAU_LIS[niveau.toLowerCase()] } : {}),
      ...(qualifs.length ? { Qualifications: ['L', ...qualifs] } : {}),
    };
    actions.push(['AddRecord', T.LIS, null, fields]);
    noms.push(D.prog.get(progId) || '?');
  }
  const res = await apply(actions, `Certificat(s) LIS-12 créé(s) pour ${noms.join(', ')} — à compléter : n° d'attestation, référentiel, sécurité nationale`);
  const newId = res?.retValues?.[0];
  if (newId && !D.rev.Certificat) await apply([['UpdateRecord', T.REV, revId, { Certificat: newId }]], 'Certificat rattaché à la revue');
  await reload();
}

// Libellé EV repris de la CH (2026CH0006_PASIRENO_ADVENS → 2026EV0113_PASIRENO_ADVENS),
// numéro = dernier numéro d'évaluation + 1
function libelleEval(ch) {
  const an = new Date().getFullYear();
  const num = String(D.lastEv + 1).padStart(4, '0');
  const m = /^\d{4}CH\d{4}_(.+)$/.exec(ch.Libelle_CH || '');
  if (m) return `${an}EV${num}_${m[1]}`;
  const ent = String(D.ent.get(ch.Denomination || D.tem?.Entreprise)?.Denomination || '').toUpperCase().replace(/\s+/g, '_');
  return `${an}EV${num}_${(D.prog.get(ch.Programme) || 'XXXX').slice(0, 4).toUpperCase()}_${ent}`;
}

// Portées demandées dans le TEM-404 (cases c1.* PASSI, c2.* PACS, c3.* PRIS, mêmes clés que le
// TEM-400) → qualifications de Qualifications_List, par leur code.
const PORTEES_TEM = {
  passi: { bloc: 'c1', codes: { archi: 'PASSI_ARCHI', conf: 'PASSI_CONF', code: 'PASSI_CODE', intrusion: 'PASSI_INTRUSION', orgaphy: 'PASSI_ORGAPHY' } },
  pacs:  { bloc: 'c2', codes: { homol: 'PACS_HOM', risque: 'PACS_GDR', archi: 'PACS_ARCHI', crise: 'PACS_CRISE' } },
  pris:  { bloc: 'c3', codes: { rec: 'PRIS_REC', inv: 'PRIS_INV', code: 'PRIS_CODE', pci: 'PRIS_PCI', crise: 'PRIS_CRISE' } },
};
const progCle = progId => { const n = String(D.prog.get(progId) || '').toUpperCase(); return Object.keys(PROG_NOMS).find(k => n.startsWith(PROG_NOMS[k])) || null; };

function porteesDemandees(progId) {
  const def = PORTEES_TEM[progCle(progId)];
  if (!def) return [];
  const j = jsonTem();
  return Object.entries(def.codes).filter(([k]) => j[`${def.bloc}.${k}`] === true)
    .map(([, code]) => D.qlParCode.get(code)).filter(Boolean);
}

async function creerEval(chId) {
  const ch = D.chs.find(c => c.id === chId);
  if (!ch) return;
  const portees = porteesDemandees(ch.Programme);
  const fields = {
    Libelle: libelleEval(ch), Entreprise: ch.Denomination || D.tem?.Entreprise || 0, Programme: ch.Programme || 0,
    Type_d_evaluation: Array.isArray(ch.Type_d_evaluation) ? ch.Type_d_evaluation : null, PO: ch.id, Statut: 'à planifier',
    ...(portees.length ? { Activites_: ['L', ...portees] } : {}),
  };
  const noms = portees.map(id => D.qualifs.get(id)).join(', ');
  const res = await apply([['AddRecord', T.EV, null, fields]],
    `Évaluation ${fields.Libelle} créée` + (portees.length ? ` — portées : ${noms}` : ' — aucune portée cochée dans le TEM-404'));
  const newId = res?.retValues?.[0];
  if (newId && !D.rev.Evaluation) await apply([['UpdateRecord', T.REV, revId, { Evaluation: newId }]],
    `Évaluation ${fields.Libelle} créée et rattachée à la revue` + (portees.length ? ` — portées : ${noms}` : ''));
  await reload();
}

    const ptId = +tr.dataset.pt;
    const col = act === 'present' ? 'Present' : 'Conforme';
    const cur = D.reponses.get(ptId)?.[col] || '';
    const v = cur === b.dataset.v ? '' : b.dataset.v;  // re-cliquer efface
    return setPoint(ptId, { [col]: v });
  }
  if (act === 'rev-choix') {
    const col = b.dataset.col, cur = D.rev[col] || '';
    const v = cur === b.dataset.v ? '' : b.dataset.v;
    const f = { [col]: v };
    // La date suit la décision : remplie au clic si vide, modifiable ensuite
    if (b.dataset.date && v && !D.rev[b.dataset.date] && b.dataset.date in D.rev) f[b.dataset.date] = today();
    return setRev(f);
  }
  if (act === 'rapport-auj') return setRev({ Date_livraison_rapport: today() }, 'Rapport marqué livré');
  if (act === 'valider-devis') return validerDevis(+b.dataset.pl);
  if (act === 'signer-devis') return signerDevis(+b.dataset.pl);
  if (act === 'ajouter-lis12') return ajouterLis12();
  if (act === 'creer-eval') return creerEval(+b.dataset.ch);
  if (act === 'courrier') return ouvrirCourrier();
  if (act === 'cour-prog' || act === 'cour-civ') {
    let progs = courrier.progs;
    if (act === 'cour-prog') {
      const v = b.dataset.v, avec = progs.includes(v) ? progs.filter(p => p !== v) : [...progs, v];
      if (!avec.length) return;   // au moins un programme
      progs = progsDemandes().filter(p => avec.includes(p));
    }
    const civ = act === 'cour-civ' ? b.dataset.v : courrier.civ, sig = courrier.signature;
    courrier = { ...texteCourrier(progs, civ), signature: sig };
    return render();
  }
  if (act === 'cour-pdf') return genererPdf('courrier', b);
  if (act === 'attest') return ouvrirAttest();
  if (act === 'att-eval') { const sig = attest.signature; attest = { ...texteAttest(+b.dataset.v), signature: sig }; return render(); }
  if (act === 'att-pdf') return genererPdf('attest', b);
  if (act === 'att-sign') {
    signataireAttest = attest.signature;
    await grist.setOption('signataireAttestation', signataireAttest);
    return status('Signature de l’attestation mémorisée pour les prochaines fois.');
  }
  if (act === 'cour-sign') {
    signataire = courrier.signature;
    await grist.setOption('signataire', signataire);
    return status('Signature mémorisée pour les prochains courriers.');
  }
});

// Saisie dans le courrier : mémorisée sans re-rendu (le curseur reste en place)
main.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.act === 'cour-txt' && courrier) courrier[el.dataset.k] = el.value;
  if (el.dataset.act === 'att-txt' && attest) attest[el.dataset.k] = el.value;
});

main.addEventListener('change', async ev => {
  const el = ev.target;
  const act = el.dataset.act;
  const tr = el.closest('tr[data-pt]');
  if (act === 'date' && tr) {
    const v = el.value ? Math.floor(new Date(el.value).getTime() / 1000) : null;
    return setPoint(+tr.dataset.pt, { Date_verif: v }, false);
  }
  if (act === 'com' && tr) return setPoint(+tr.dataset.pt, { Commentaire: el.value }, false);
  if (act === 'rev-date') return setRev({ [el.dataset.col]: dateToSec(el.value) });
  if (act === 'rev-txt') return setRev({ [el.dataset.col]: el.value });
  if (act === 'rev-cert') return setRev({ Certificat: +el.value || 0 }, 'Certificat rattaché');
});

// ── Configuration ──────────────────────────────────────────────────────────

function openConfig() {
  document.getElementById('config-url').value = docUrl;
  document.getElementById('config').style.display = 'block';
}
document.getElementById('config-cancel').addEventListener('click', () => { document.getElementById('config').style.display = 'none'; });
document.getElementById('config-save').addEventListener('click', async () => {
  docUrl = document.getElementById('config-url').value.trim().replace(/\/+$/, '').replace(/\/p\/\d+.*$/, '');
  await grist.setOption('docUrl', docUrl);
  document.getElementById('config').style.display = 'none';
  if (D) render();
});

function status(msg, type = '') {
  const s = document.getElementById('status');
  s.textContent = msg;
  s.className = 'statusbar' + (type ? ' ' + type : '');
}

function showEmpty(msg) {
  D = null;
  document.getElementById('empty').textContent = msg || 'Sélectionnez une revue de dossier.';
  document.getElementById('empty').style.display = 'block';
  document.getElementById('main').style.display = 'none';
}
</script>
