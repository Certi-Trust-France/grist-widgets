<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cycles de certification</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #1e293b;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #f8fafc;
    }

    /* ── Barre d'outils ── */
    .toolbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      background: #1e3a8a;
      color: #fff;
      flex-wrap: wrap;
      z-index: 20;
    }
    .toolbar-label {
      font-size: 11px;
      color: #93c5fd;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .btn-group { display: flex; align-items: center; gap: 5px; }
    .btn-group + .btn-group { border-left: 1px solid #2d4fa0; padding-left: 10px; }
    .tbtn, .fbtn {
      padding: 3px 9px;
      border: 1px solid #3b5fd4;
      background: transparent;
      color: #bfdbfe;
      border-radius: 12px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: background .15s, color .15s;
      white-space: nowrap;
    }
    .tbtn:hover, .fbtn:hover { background: #2d4fa0; color: #fff; }
    .tbtn.active { background: #fff; color: #1e3a8a; border-color: #fff; }
    .fbtn.active { background: var(--c, #3b82f6); color: #fff; border-color: var(--c, #3b82f6); }
    .fbtn[data-prog=""].active { background: #fff; color: #1e3a8a; border-color: #fff; }

    /* ── Corps principal ── */
    .widget-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Ligne d'en-tête (années) ── */
    .row-hdr {
      flex-shrink: 0;
      display: flex;
      height: 32px;
      border-bottom: 2px solid #3b82f6;
      background: #fff;
      z-index: 15;
    }
    .lbl-hdr {
      width: 200px;
      min-width: 200px;
      background: #1e3a8a;
      color: #bfdbfe;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      display: flex;
      align-items: center;
      padding: 0 10px;
      z-index: 16;
      flex-shrink: 0;
    }
    #year-hdr {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* ── Zone lignes ── */
    .rows-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      position: relative;
    }

    /* ── Ligne cycle ── */
    .cycle-row {
      display: flex;
      height: 36px;
      border-bottom: 1px solid #e2e8f0;
    }
    .cycle-row:hover { background: rgba(59,130,246,.04); }

    /* ── Colonne étiquette (sticky) ── */
    .lbl-col {
      width: 200px;
      min-width: 200px;
      flex-shrink: 0;
      position: sticky;
      left: 0;
      z-index: 5;
      background: #fff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 7px;
      overflow: hidden;
    }
    .prog-badge {
      flex-shrink: 0;
      padding: 2px 5px;
      border-radius: 3px;
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .02em;
      line-height: 1.4;
    }
    .co-name {
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* ── Colonne timeline ── */
    .tl-col {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* ── Barre de cycle grise ── */
    .cycle-bar {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 11px;
      background: #94a3b8;
      border-radius: 3px;
      z-index: 2;
      cursor: default;
    }

    /* ── Traits jaunes (marqueurs de date) ── */
    .date-marker {
      position: absolute;
      top: 15%;
      height: 70%;
      width: 3px;
      background: #f59e0b;
      border-radius: 1px;
      z-index: 3;
      cursor: help;
    }

    /* ── Badges EVA ── */
    .eva-badge {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 19px;
      padding: 0 5px;
      background: #fef08a;
      border: 1.5px solid #d97706;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 800;
      color: #78350f;
      display: flex;
      align-items: center;
      cursor: help;
      z-index: 4;
      white-space: nowrap;
      letter-spacing: .02em;
    }

    /* ── Ligne aujourd'hui ── */
    .today-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #ef4444;
      z-index: 6;
      pointer-events: none;
    }
    .today-line-hdr {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #ef4444;
      z-index: 6;
      pointer-events: none;
    }

    /* ── Bande d'arrière-plan de l'année ── */
    .yr-band {
      position: absolute;
      top: 0;
      bottom: 0;
      pointer-events: none;
    }

    /* ── Grille mois ── */
    .month-tick {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      pointer-events: none;
    }

    /* ── Barre de statut ── */
    .statusbar {
      flex-shrink: 0;
      padding: 3px 10px;
      font-size: 10px;
      color: #64748b;
      background: #f1f5f9;
      border-top: 1px solid #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .statusbar.error { color: #b91c1c; background: #fef2f2; }

    /* ── Message vide ── */
    .empty-msg {
      padding: 40px;
      text-align: center;
      color: #94a3b8;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="toolbar">
  <div class="btn-group">
    <span class="toolbar-label">Trier&nbsp;:</span>
    <button class="tbtn active" data-sort="alpha">A–Z</button>
    <button class="tbtn" data-sort="cert">Certification</button>
    <button class="tbtn" data-sort="echeance">Échéance</button>
  </div>
  <div class="btn-group" id="prog-filters">
    <span class="toolbar-label">Programme&nbsp;:</span>
    <button class="fbtn active" data-prog="">Tous</button>
  </div>
</div>

<div class="widget-body" id="widget-body">
  <div class="row-hdr" id="row-hdr">
    <div class="lbl-hdr">Entreprise</div>
    <div id="year-hdr"></div>
  </div>
  <div class="rows-area" id="rows-area">
    <div class="empty-msg" id="empty-msg">Chargement…</div>
  </div>
</div>

<div class="statusbar" id="statusbar"></div>

<script>
  /* ──────────────────────────────────────────
     Constantes
  ────────────────────────────────────────── */
  const PROG_COLORS = {
    PASSI:       '#2563EB',
    PACS:        '#059669',
    PRIS:        '#D97706',
    PDIS:        '#7C3AED',
    PAMS:        '#DC2626',
    SECNUMCLOUD: '#0891B2',
  };
  const MONTHS_FR = ['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
  const LW = 200;   // largeur colonne étiquette
  const RH = 36;    // hauteur ligne cycle
  const HH = 32;    // hauteur en-tête

  /* ──────────────────────────────────────────
     Fenêtre temporelle : aujourd'hui ± 3 ans
  ────────────────────────────────────────── */
  const _n    = new Date();
  const TODAY = new Date(Date.UTC(_n.getFullYear(), _n.getMonth(), _n.getDate()));
  const W_START = new Date(Date.UTC(TODAY.getUTCFullYear() - 3, TODAY.getUTCMonth(), TODAY.getUTCDate()));
  const W_END   = new Date(Date.UTC(TODAY.getUTCFullYear() + 3, TODAY.getUTCMonth(), TODAY.getUTCDate()));
  const W_MS    = W_END.getTime() - W_START.getTime();

  /* ──────────────────────────────────────────
     État
  ────────────────────────────────────────── */
  let cycles    = [];
  let evalMap   = new Map();   // id → { date, lib, type }
  let progMap   = new Map();   // id → { nom, color }
  let sortMode  = 'alpha';
  let filterProg = '';

  /* ──────────────────────────────────────────
     API Grist
  ────────────────────────────────────────── */
  grist.ready({ requiredAccess: 'full' });

  grist.onRecords(async records => {
    cycles = records.map(parseCycle);
    await Promise.all([loadEvals(), loadProgs()]);
    buildProgFilters();
    render();
  });

  /* ──────────────────────────────────────────
     Parseurs
  ────────────────────────────────────────── */
  function parseCycle(r) {
    return {
      id:            r.id,
      denomination:  String(r.gristHelper_Display  ?? ''),
      programmeName: String(r.gristHelper_Display3 ?? ''),
      programmeId:   r.Programme ?? 0,
      dateCert:      r.date_certification  ?? null,  // Unix secondes
      dateSurv:      r.Date_surveillance   ?? null,
      dateFin:       r.date_fin            ?? null,
      prochaine:     r.Prochaine_echeance  ?? null,
      evalIds: [
        ...parseRL(r.eval_initiale),
        ...parseRL(r.eval_autres),
        ...parseRL(r.eval_renouvellement),
      ],
    };
  }

  // Parse une RefList Grist (array, JSON string, entier ou null)
  function parseRL(raw) {
    if (!raw) return [];
    if (typeof raw === 'number' && raw > 0) return [raw];
    if (Array.isArray(raw)) {
      const a = raw[0] === 'L' ? raw.slice(1) : raw;
      return a.map(Number).filter(n => n > 0);
    }
    if (typeof raw === 'string') {
      const s = raw.trim();
      if (s.startsWith('[')) { try { return parseRL(JSON.parse(s)); } catch {} }
      const n = Number(s);
      if (n > 0) return [n];
    }
    return [];
  }

  async function loadEvals() {
    try {
      const t = await grist.docApi.fetchTable('Evaluations');
      evalMap.clear();
      for (let i = 0; i < t.id.length; i++) {
        const id = t.id[i];
        if (!id || id < 0) continue;
        evalMap.set(id, {
          date: t.Date_Debut?.[i] ?? null,   // Unix secondes
          lib:  String(t.Libelle?.[i] ?? ''),
          type: String(t.Type_d_evaluation?.[i] ?? ''),
        });
      }
    } catch (e) { console.warn('loadEvals:', e); }
  }

  async function loadProgs() {
    try {
      const t = await grist.docApi.fetchTable('Programmes');
      progMap.clear();
      for (let i = 0; i < t.id.length; i++) {
        const id = t.id[i];
        if (!id) continue;
        const nom = String(t.Nom_du_programme?.[i] ?? '');
        progMap.set(id, { nom, color: colorFromName(nom) });
      }
    } catch (e) { console.warn('loadProgs:', e); }
  }

  /* ──────────────────────────────────────────
     Filtres programme
  ────────────────────────────────────────── */
  function buildProgFilters() {
    const g = document.getElementById('prog-filters');
    // Supprimer les boutons dynamiques précédents
    g.querySelectorAll('.fbtn:not([data-prog=""])').forEach(b => b.remove());

    const seen = new Set();
    cycles.forEach(c => {
      const key = progKey(c.programmeName);
      if (key && !seen.has(key)) {
        seen.add(key);
        const btn = document.createElement('button');
        btn.className = 'fbtn';
        btn.dataset.prog = key;
        btn.textContent  = key === 'SECNUMCLOUD' ? 'SNC' : key;
        btn.style.setProperty('--c', PROG_COLORS[key] ?? '#6b7280');
        g.appendChild(btn);
      }
    });
    updateFBtns();
  }

  function updateFBtns() {
    document.querySelectorAll('.fbtn').forEach(b => {
      const active = b.dataset.prog === filterProg
                  || (b.dataset.prog === '' && !filterProg);
      b.classList.toggle('active', active);
    });
  }

  /* ──────────────────────────────────────────
     Rendu principal
  ────────────────────────────────────────── */
  function render() {
    const body = document.getElementById('widget-body');
    const tlW  = Math.max(100, body.clientWidth - LW);
    const ppm  = tlW / W_MS;   // px par milliseconde

    // Pré-calcul des bandes d'années
    const yearBands = computeYearBands(tlW, ppm);

    // Trier + filtrer
    const list = cycles
      .filter(c => !filterProg || progKey(c.programmeName) === filterProg)
      .sort((a, b) => {
        if (sortMode === 'cert')     return (a.dateCert  ?? 1e15) - (b.dateCert  ?? 1e15);
        if (sortMode === 'echeance') return (a.prochaine ?? 1e15) - (b.prochaine ?? 1e15);
        return a.denomination.localeCompare(b.denomination, 'fr', { sensitivity: 'base' });
      });

    // En-tête des années
    buildYearHdr(document.getElementById('year-hdr'), tlW, ppm, yearBands);

    // Lignes
    const area = document.getElementById('rows-area');
    area.innerHTML = '';
    if (list.length === 0) {
      const msg = document.createElement('div');
      msg.className = 'empty-msg';
      msg.textContent = cycles.length ? 'Aucun cycle pour ce programme.' : 'Aucun cycle.';
      area.appendChild(msg);
    } else {
      list.forEach(c => area.appendChild(buildRow(c, ppm, yearBands)));
    }

    showStatus(`${list.length} cycle(s) affiché(s)${filterProg ? ' — ' + filterProg : ''}`);
  }

  /* ──────────────────────────────────────────
     Bandes d'années
  ────────────────────────────────────────── */
  function computeYearBands(tlW, ppm) {
    const bands = [];
    const sy = W_START.getUTCFullYear();
    const ey = W_END.getUTCFullYear();
    for (let y = sy; y <= ey + 1; y++) {
      const ys = new Date(Date.UTC(y,     0, 1));
      const ye = new Date(Date.UTC(y + 1, 0, 1));
      const x1 = Math.max(0,   msToX(ys.getTime(), ppm));
      const x2 = Math.min(tlW, msToX(ye.getTime(), ppm));
      if (x2 > x1) bands.push({ x1, x2, year: y, even: y % 2 === 0 });
    }
    return bands;
  }

  /* ──────────────────────────────────────────
     Construction de l'en-tête des années
  ────────────────────────────────────────── */
  function buildYearHdr(el, tlW, ppm, yearBands) {
    el.innerHTML = '';
    el.style.cssText = `position:relative;height:${HH}px;width:${tlW}px;overflow:hidden;`;

    // Bandes d'années
    yearBands.forEach(({ x1, x2, year, even }) => {
      const band = document.createElement('div');
      band.style.cssText = `
        position:absolute;left:${x1}px;width:${x2 - x1}px;height:100%;
        background:${even ? '#eff6ff' : '#dbeafe'};
        border-right:1px solid #93c5fd;
        display:flex;align-items:center;justify-content:center;
        font-weight:700;font-size:13px;color:#1e40af;user-select:none;
      `;
      band.textContent = String(year);
      el.appendChild(band);

      // Traits de mois dans l'en-tête
      for (let m = 1; m < 12; m++) {
        const ms = new Date(Date.UTC(year, m, 1));
        const mx = msToX(ms.getTime(), ppm);
        if (mx < 0 || mx > tlW) continue;
        const isQ = m % 3 === 0;
        const tick = document.createElement('div');
        tick.style.cssText = `
          position:absolute;left:${mx}px;bottom:0;
          height:${isQ ? '55%' : '30%'};width:1px;
          background:#3b82f6;opacity:.45;pointer-events:none;
        `;
        el.appendChild(tick);
        if (isQ) {
          const lbl = document.createElement('span');
          lbl.style.cssText = `
            position:absolute;left:${mx + 2}px;top:3px;
            font-size:8px;color:#2563eb;font-weight:700;pointer-events:none;
          `;
          lbl.textContent = MONTHS_FR[m];
          el.appendChild(lbl);
        }
      }
    });

    // Ligne aujourd'hui
    const tx = msToX(TODAY.getTime(), ppm);
    if (tx >= 0 && tx <= tlW) {
      const line = document.createElement('div');
      line.className = 'today-line-hdr';
      line.style.left = `${tx}px`;
      line.title = 'Aujourd\'hui';
      el.appendChild(line);
    }
  }

  /* ──────────────────────────────────────────
     Construction d'une ligne de cycle
  ────────────────────────────────────────── */
  function buildRow(cycle, ppm, yearBands) {
    const row = document.createElement('div');
    row.className = 'cycle-row';

    // ── Colonne étiquette ──
    const lbl = document.createElement('div');
    lbl.className = 'lbl-col';

    const info  = progMap.get(cycle.programmeId);
    const color = info?.color ?? colorFromName(cycle.programmeName);
    const pname = info?.nom   ?? cycle.programmeName;

    if (pname) {
      const badge = document.createElement('span');
      badge.className = 'prog-badge';
      badge.style.background = color;
      badge.title = pname;
      badge.textContent = pShort(pname);
      lbl.appendChild(badge);
    }
    const nm = document.createElement('span');
    nm.className = 'co-name';
    nm.textContent = cycle.denomination || `#${cycle.id}`;
    nm.title = cycle.denomination;
    lbl.appendChild(nm);
    row.appendChild(lbl);

    // ── Colonne timeline ──
    const tl = document.createElement('div');
    tl.className = 'tl-col';

    // Arrière-plans de bandes d'années
    yearBands.forEach(({ x1, x2, even }) => {
      const bg = document.createElement('div');
      bg.className = 'yr-band';
      bg.style.left  = `${x1}px`;
      bg.style.width = `${x2 - x1}px`;
      bg.style.background = even ? '#f5f9ff' : '#eaf2ff';
      tl.appendChild(bg);
    });

    // Barre grise du cycle (date_certification → date_fin)
    if (cycle.dateCert && cycle.dateFin) {
      const bx  = tsToX(cycle.dateCert, ppm);
      const bw  = tsToX(cycle.dateFin,  ppm) - bx;
      if (bw > 0) {
        const bar = document.createElement('div');
        bar.className = 'cycle-bar';
        bar.style.left  = `${bx}px`;
        bar.style.width = `${bw}px`;
        bar.title = `${fmtDate(cycle.dateCert)} → ${fmtDate(cycle.dateFin)}`;
        tl.appendChild(bar);
      }
    }

    // Trois traits jaunes (certification, surveillance, fin/renouvellement)
    [
      [cycle.dateCert, 'Certification'],
      [cycle.dateSurv, 'Surveillance'],
      [cycle.dateFin,  'Renouvellement'],
    ].forEach(([ts, label]) => {
      if (!ts) return;
      const mx = tsToX(ts, ppm);
      if (mx < -5 || mx > 9999) return;
      const m = document.createElement('div');
      m.className = 'date-marker';
      m.style.left = `${mx}px`;
      m.title = `${label} : ${fmtDate(ts)}`;
      tl.appendChild(m);
    });

    // Badges EVA (évaluations liées)
    const posCount = new Map();  // position arrondie → nb badges déjà placés (décalage)
    cycle.evalIds.forEach(eid => {
      const ev = evalMap.get(eid);
      if (!ev?.date) return;
      const ex = tsToX(ev.date, ppm);
      if (ex < -25 || ex > 9999) return;
      const key = Math.round(ex / 5) * 5;
      const offset = posCount.get(key) ?? 0;
      posCount.set(key, offset + 1);
      const badge = document.createElement('div');
      badge.className = 'eva-badge';
      badge.style.left = `${ex + offset * 26}px`;
      badge.title = ev.lib || ev.type || `Évaluation #${eid}`;
      badge.textContent = 'EVA';
      tl.appendChild(badge);
    });

    // Ligne rouge aujourd'hui
    const tx = msToX(TODAY.getTime(), ppm);
    const todayLine = document.createElement('div');
    todayLine.className = 'today-line';
    todayLine.style.left = `${tx}px`;
    tl.appendChild(todayLine);

    row.appendChild(tl);
    return row;
  }

  /* ──────────────────────────────────────────
     Utilitaires de position
  ────────────────────────────────────────── */
  // milliseconde absolu → px
  function msToX(ms, ppm) { return (ms - W_START.getTime()) * ppm; }
  // Unix secondes → px
  function tsToX(ts, ppm) { return msToX(ts * 1000, ppm); }

  /* ──────────────────────────────────────────
     Utilitaires programme
  ────────────────────────────────────────── */
  function colorFromName(name) {
    const up = String(name ?? '').toUpperCase();
    for (const [k, v] of Object.entries(PROG_COLORS)) if (up.includes(k)) return v;
    return '#6b7280';
  }

  function progKey(name) {
    const up = String(name ?? '').toUpperCase();
    for (const k of Object.keys(PROG_COLORS)) if (up.includes(k)) return k;
    return '';
  }

  function pShort(name) {
    const up = String(name ?? '').toUpperCase();
    if (up.includes('SECNUMCLOUD')) return 'SNC';
    for (const k of Object.keys(PROG_COLORS)) if (up.includes(k)) return k;
    return String(name ?? '').slice(0, 4).toUpperCase();
  }

  /* ──────────────────────────────────────────
     Formatage de date
  ────────────────────────────────────────── */
  function fmtDate(ts) {
    const d = new Date(ts * 1000);
    return [
      String(d.getUTCDate()).padStart(2, '0'),
      String(d.getUTCMonth() + 1).padStart(2, '0'),
      d.getUTCFullYear(),
    ].join('/');
  }

  /* ──────────────────────────────────────────
     Barre de statut
  ────────────────────────────────────────── */
  function showStatus(msg, type = '') {
    const bar = document.getElementById('statusbar');
    bar.textContent = msg;
    bar.className   = `statusbar${type ? ' ' + type : ''}`;
  }

  /* ──────────────────────────────────────────
     Écouteurs toolbar
  ────────────────────────────────────────── */
  document.querySelectorAll('.tbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      sortMode = btn.dataset.sort;
      document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  document.getElementById('prog-filters').addEventListener('click', e => {
    const btn = e.target.closest('.fbtn');
    if (!btn) return;
    filterProg = btn.dataset.prog === filterProg ? '' : btn.dataset.prog;
    updateFBtns();
    render();
  });

  /* ──────────────────────────────────────────
     Redimensionnement
  ────────────────────────────────────────── */
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 120);
  });
</script>
