<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cycles de certification</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #1e293b;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #f8fafc;
    }

    /* ── Barre d'outils ── */
    .toolbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      background: #1e3a8a;
      color: #fff;
      flex-wrap: wrap;
      z-index: 20;
    }
    .toolbar-label {
      font-size: 11px;
      color: #93c5fd;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .btn-group { display: flex; align-items: center; gap: 5px; }
    .btn-group + .btn-group { border-left: 1px solid #2d4fa0; padding-left: 10px; }
    .tbtn, .fbtn {
      padding: 3px 9px;
      border: 1px solid #3b5fd4;
      background: transparent;
      color: #bfdbfe;
      border-radius: 12px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: background .15s, color .15s;
      white-space: nowrap;
    }
    .tbtn:hover, .fbtn:hover { background: #2d4fa0; color: #fff; }
    .tbtn.active { background: #fff; color: #1e3a8a; border-color: #fff; }
    .fbtn.active { background: var(--c, #3b82f6); color: #fff; border-color: var(--c, #3b82f6); }
    .fbtn[data-prog=""].active { background: #fff; color: #1e3a8a; border-color: #fff; }
    /* Pastille de couleur programme — visible en permanence, comme la légende du planning */
    .fbtn-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      margin-right: 4px;
      vertical-align: middle;
    }

    /* ── Corps principal ── */
    .widget-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Ligne d'en-tête (années) ── */
    .row-hdr {
      flex-shrink: 0;
      display: flex;
      height: 32px;
      border-bottom: 2px solid #3b82f6;
      background: #fff;
      z-index: 15;
    }
    .lbl-hdr {
      width: 200px;
      min-width: 200px;
      background: #1e3a8a;
      color: #bfdbfe;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      display: flex;
      align-items: center;
      padding: 0 10px;
      z-index: 16;
      flex-shrink: 0;
    }
    #year-hdr {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* ── Zone lignes ── */
    .rows-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      position: relative;
    }

    /* ── Ligne cycle ── */
    .cycle-row {
      display: flex;
      height: 36px;
      border-bottom: 1px solid #e2e8f0;
    }
    .cycle-row:hover { background: rgba(59,130,246,.04); }

    /* ── Colonne étiquette (sticky) ── */
    .lbl-col {
      width: 200px;
      min-width: 200px;
      flex-shrink: 0;
      position: sticky;
      left: 0;
      z-index: 5;
      background: #fff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 7px;
      overflow: hidden;
    }
    /* Badge programme sur la timeline, à gauche du trait de début de cycle.
       Plus haut que .eva-badge (19px) pour rester visible même quand une
       étiquette d'évaluation se superpose dessus. */
    .prog-badge-tl {
      position: absolute;
      top: 50%;
      transform: translate(calc(-100% - 5px), -50%);
      height: 27px;
      display: flex;
      align-items: center;
      padding: 0 6px;
      border-radius: 4px;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .03em;
      white-space: nowrap;
      z-index: 3;
      pointer-events: none;
    }
    .co-name {
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* ── Colonne timeline ── */
    .tl-col {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* ── Barre de cycle grise ── */
    .cycle-bar {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 11px;
      background: #94a3b8;
      border-radius: 3px;
      z-index: 2;
      cursor: default;
    }
    /* Cycle futur : pas encore de certificat, l'évaluation initiale n'est pas terminée */
    .cycle-bar.future {
      background: repeating-linear-gradient(
        45deg,
        rgba(148, 163, 184, .45),
        rgba(148, 163, 184, .45) 6px,
        rgba(148, 163, 184, .15) 6px,
        rgba(148, 163, 184, .15) 12px
      );
      border: 1px dashed rgba(100, 116, 139, .6);
    }

    /* ── Traits jaunes (marqueurs de date) ── */
    .date-marker {
      position: absolute;
      top: 15%;
      height: 70%;
      width: 3px;
      background: #f59e0b;
      border-radius: 1px;
      z-index: 3;
      cursor: help;
    }

    /* ── Badges EVA (barre date de début → date de fin) ──
       Couleur : pas de RE → orange ; RE mais pas terminée → vert ; terminée → gris */
    .eva-badge {
      position: absolute;
      height: 19px;
      padding: 0 5px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      overflow: hidden;
      cursor: help;
      z-index: 4;
      white-space: nowrap;
      letter-spacing: .02em;
    }
    .eva-badge.no-re    { background: #fef08a; border: 1.5px solid #d97706; color: #78350f; }
    .eva-badge.en-cours { background: #d1fae5; border: 1.5px solid #059669; color: #065f46; }
    .eva-badge.terminee { background: #e2e8f0; border: 1.5px solid #94a3b8; color: #475569; }

    /* ── Badge certificat (à la date de délivrance) ── */
    .cert-badge {
      position: absolute;
      top: 50%;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
      z-index: 5;
      cursor: help;
    }
    .cert-badge svg { display: block; width: 100%; height: 100%; }

    /* ── Ligne aujourd'hui ── */
    .today-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #ef4444;
      z-index: 6;
      pointer-events: none;
    }
    .today-line-hdr {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #ef4444;
      z-index: 6;
      pointer-events: none;
    }

    /* ── Bande d'arrière-plan de l'année ── */
    .yr-band {
      position: absolute;
      top: 0;
      bottom: 0;
      pointer-events: none;
    }

    /* ── Grille mois ── */
    .month-tick {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      pointer-events: none;
    }

    /* ── Barre de statut ── */
    .statusbar {
      flex-shrink: 0;
      padding: 3px 10px;
      font-size: 10px;
      color: #64748b;
      background: #f1f5f9;
      border-top: 1px solid #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .statusbar.error { color: #b91c1c; background: #fef2f2; }

    /* ── Message vide ── */
    .empty-msg {
      padding: 40px;
      text-align: center;
      color: #94a3b8;
      font-style: italic;
    }
  </style>
</head>

  const _n    = new Date();
  const TODAY = new Date(Date.UTC(_n.getFullYear(), _n.getMonth(), _n.getDate()));
  const W_START = new Date(Date.UTC(TODAY.getUTCFullYear() - 3, TODAY.getUTCMonth(), TODAY.getUTCDate()));
  const W_END   = new Date(Date.UTC(TODAY.getUTCFullYear() + 3, TODAY.getUTCMonth(), TODAY.getUTCDate()));

    buildRespFilters();

  /* ──────────────────────────────────────────
     Chargement des cycles via fetchTable
  ────────────────────────────────────────── */
  async function loadCycles() {
    try {
      const t = await grist.docApi.fetchTable('Cycles_services');
      cycles = [];
      for (let i = 0; i < t.id.length; i++) {
        const id = t.id[i];
        if (!id || id < 0) continue;
        // ts > 0 : les dates Grist valent 0 quand non renseignées (pas null)
        const ts = col => (t[col]?.[i] > 0 ? t[col][i] : null);
        cycles.push({
          id,
          denomination:  String(t.gristHelper_Display?.[i]  ?? ''),
          entId:         t.Denomination?.[i] > 0 ? t.Denomination[i] : 0,
          programmeName: String(t.gristHelper_Display3?.[i] ?? t.gristHelper_Display2?.[i] ?? ''),
          programmeId:   t.Programme?.[i] > 0 ? t.Programme[i] : 0,
          hasCertificat: t.Certificat?.[i] > 0,
          certId:        t.Certificat?.[i] > 0 ? t.Certificat[i] : 0,
          dateDebut: ts('date_debut_cycle'),
          // Calcul de secours : +18 mois et +36 mois si les colonnes sont à 0
          dateSurv:  ts('Date_surveillance_certification') ?? (ts('date_debut_cycle') ? addMonths(ts('date_debut_cycle'), 18) : null),
          dateFin:   ts('date_fin_certification')          ?? (ts('date_debut_cycle') ? addMonths(ts('date_debut_cycle'), 36) : null),
          prochaine: ts('Prochaine_echeance'),
          evalIds: [
            ...parseRL(t.eval_initiale?.[i]),
            ...parseRL(t.eval_autres?.[i]),
            ...parseRL(t.eval_renouvellement?.[i]),
          ],
        });
      }
    } catch (e) {
      console.warn('loadCycles:', e);
      showStatus('Erreur chargement Cycles_services : ' + e.message, 'error');
    }
  }

  // Ajoute n mois à un timestamp Unix (secondes), retourne un timestamp Unix
  function addMonths(tsSec, n) {
    const d = new Date(tsSec * 1000);
    d.setUTCMonth(d.getUTCMonth() + n);
    return Math.floor(d.getTime() / 1000);
  }

  // Parse une RefList Grist (array, JSON string, entier ou null)
  function parseRL(raw) {
    if (!raw) return [];
    if (typeof raw === 'number' && raw > 0) return [raw];
    if (Array.isArray(raw)) {
      const a = raw[0] === 'L' ? raw.slice(1) : raw;
      return a.map(Number).filter(n => n > 0);
    }
    if (typeof raw === 'string') {
      const s = raw.trim();
      if (s.startsWith('[')) { try { return parseRL(JSON.parse(s)); } catch {} }
      const n = Number(s);
      if (n > 0) return [n];
    }
    return [];
  }

  async function loadEvals() {
    // Dates de lots par évaluation, pour les chaînes de priorité de début/fin de
    // l'étiquette évaluation dans le widget — mêmes règles que la formule Grist
    // Cycles_services.date_debut_cycle. Une évaluation peut avoir plusieurs lots du
    // même type (ex. plusieurs séances de "Rédaction du rapport") : on prend la
    // première date pour le début (lancement) et la dernière pour la fin (rapport),
    // pas juste le premier lot rencontré dans la table.
    const lancementMap = new Map(); // evalId → date_debut_incluse la plus ancienne ("Journée de lancement")
    const rapportMap   = new Map(); // evalId → date_debut_incluse la plus récente ("Rédaction du rapport")
    try {
      const lots = await grist.docApi.fetchTable('Unites_d_oeuvre');
      for (let i = 0; i < lots.id.length; i++) {
        const evalId = lots.Evaluation?.[i];
        const d = lots.date_debut_incluse?.[i];
        if (!(evalId > 0) || !(d > 0)) continue;
        if (lots.Unite_d_oeuvre?.[i] === 'Journée de lancement' && !(lancementMap.get(evalId) <= d)) lancementMap.set(evalId, d);
        if (lots.Unite_d_oeuvre?.[i] === 'Rédaction du rapport' && !(rapportMap.get(evalId) >= d))   rapportMap.set(evalId, d);
      }
    } catch (e) { console.warn('loadLots:', e); }

    try {
      const t = await grist.docApi.fetchTable('Evaluations');
      evalMap.clear();
      for (let i = 0; i < t.id.length; i++) {
        const id = t.id[i];
        if (!id || id < 0) continue;
        const debutPrevue  = t.Date_Debut_prevue?.[i] > 0 ? t.Date_Debut_prevue[i] : null;
        const finPrevue    = t.Date_fin_prevue?.[i]   > 0 ? t.Date_fin_prevue[i]   : null;
        const termineDate  = t.Termine_date?.[i]      > 0 ? t.Termine_date[i]      : null;
        evalMap.set(id, {
          // 1. Journée de lancement si présente, sinon Date_Debut_prevue
          dateStart: lancementMap.get(id) ?? debutPrevue,
          // 1. date_terminee, 2. lot "Rédaction du rapport", 3. Date_fin_prevue,
          // 4. lot "Journée de lancement" + 3 mois, 5. Date_Debut_prevue + 3 mois
          dateEnd: termineDate ?? rapportMap.get(id) ?? finPrevue
                   ?? (lancementMap.get(id) ? addMonths(lancementMap.get(id), 3) : null)
                   ?? (debutPrevue ? addMonths(debutPrevue, 3) : null),
          lib:      String(t.Libelle?.[i] ?? ''),
          type:     String(t.Type_d_evaluation?.[i] ?? ''),
          hasRE:    t.RE?.[i] > 0,
          terminee: !!t.Terminee?.[i],
        });
      }
    } catch (e) { console.warn('loadEvals:', e); }
  }

  async function loadProgs() {
    try {
      const t = await grist.docApi.fetchTable('Programmes');
      progMap.clear();
      for (let i = 0; i < t.id.length; i++) {
        const id = t.id[i];
        if (!id) continue;
        const nom = String(t.Nom_du_programme?.[i] ?? '');
        progMap.set(id, { nom, color: colorFromName(nom) });
      }
    } catch (e) { console.warn('loadProgs:', e); }
  }

  async function loadEntreprises() {
    try {
      const t = await grist.docApi.fetchTable('Entreprises');
      entMap.clear();
      for (let i = 0; i < t.id.length; i++) {
        const id = t.id[i];
        if (!id) continue;
        entMap.set(id, {
          denomination: String(t.Denomination?.[i] ?? ''),
          responsable:  String(t.Responsable_de_compte?.[i] ?? ''),
        });
      }
    } catch (e) { console.warn('loadEntreprises:', e); }
  }

  async function loadCertificats() {
    try {
      const t = await grist.docApi.fetchTable('LIS_12');
      certMap.clear();
      for (let i = 0; i < t.id.length; i++) {
        const id = t.id[i];
        if (!id) continue;
        certMap.set(id, {
          numero:         String(t.numero_attestation?.[i] ?? '').trim(),
          dateDelivrance: t.Date_Delivrance?.[i] > 0 ? t.Date_Delivrance[i] : null,
        });
      }
    } catch (e) { console.warn('loadCertificats:', e); }
  }

  /* ──────────────────────────────────────────
     Filtres programme
  ────────────────────────────────────────── */
  function buildProgFilters() {
    const g = document.getElementById('prog-filters');
    g.querySelectorAll('.fbtn:not([data-prog=""])').forEach(b => b.remove());

    const seen = new Set();
    cycles.forEach(c => {
      // Priorité : nom depuis progMap (chargé via fetchTable), sinon gristHelper
      const nom = progMap.get(c.programmeId)?.nom ?? c.programmeName;
      const key = progKey(nom);
      if (key && !seen.has(key)) {
        seen.add(key);
        const color = PROG_COLORS[key] ?? '#6b7280';
        const btn = document.createElement('button');
        btn.className = 'fbtn';
        btn.dataset.prog = key;
        // Pastille toujours visible (comme la légende du planning), pas seulement à l'état actif
        btn.innerHTML = `<span class="fbtn-dot" style="background:${color}"></span>${key === 'SECNUMCLOUD' ? 'SNC' : key}`;
        btn.style.setProperty('--c', color);
        g.appendChild(btn);
      }
    });
    updateGroupBtns('prog-filters', 'prog', filterProg);
  }

  function buildRespFilters() {
    const g = document.getElementById('resp-filters');
    g.querySelectorAll('.fbtn:not([data-resp=""])').forEach(b => b.remove());

    const seen = new Set();
    cycles.forEach(c => {
      const resp = entMap.get(c.entId)?.responsable ?? '';
      if (resp && !seen.has(resp)) {
        seen.add(resp);
        const btn = document.createElement('button');
        btn.className = 'fbtn';
        btn.dataset.resp = resp;
        btn.textContent = resp;
        g.appendChild(btn);
      }
    });
    updateGroupBtns('resp-filters', 'resp', filterResp);
  }

  function updateGroupBtns(groupId, attr, value) {
    document.querySelectorAll(`#${groupId} .fbtn`).forEach(b => {
      const btnVal = b.dataset[attr] ?? '';
      const active = btnVal === value;
      b.classList.toggle('active', active);
    });
  }

  /* ──────────────────────────────────────────
     Rendu principal
  ────────────────────────────────────────── */
  function render() {
    const body = document.getElementById('widget-body');
    const tlW  = Math.max(100, body.clientWidth - LW);
    const ppm  = tlW / W_MS;   // px par milliseconde

    // Pré-calcul des bandes d'années
    const yearBands = computeYearBands(tlW, ppm);

    // Trier + filtrer
    const list = cycles
      .filter(c => {
        if (filterProg) {
          const nom = progMap.get(c.programmeId)?.nom ?? c.programmeName;
          if (progKey(nom) !== filterProg) return false;
        }
        if (filterResp) {
          const resp = entMap.get(c.entId)?.responsable ?? '';
          if (resp !== filterResp) return false;
        }
        return true;
      })
      .sort((a, b) => {
        if (sortMode === 'debut')    return (a.dateDebut ?? 1e15) - (b.dateDebut ?? 1e15);
        if (sortMode === 'echeance') return (a.prochaine ?? 1e15) - (b.prochaine ?? 1e15);
        return a.denomination.localeCompare(b.denomination, 'fr', { sensitivity: 'base' });
      });

    // En-tête des années
    buildYearHdr(document.getElementById('year-hdr'), tlW, ppm, yearBands);

    // Lignes
    const area = document.getElementById('rows-area');
    area.innerHTML = '';
    if (list.length === 0) {
      const msg = document.createElement('div');
      msg.className = 'empty-msg';
      msg.textContent = cycles.length ? 'Aucun cycle pour ce programme.' : 'Aucun cycle.';
      area.appendChild(msg);
    } else {
      list.forEach(c => area.appendChild(buildRow(c, ppm, yearBands)));
    }

    const activeFilters = [filterProg, filterResp].filter(Boolean).join(' — ');
    showStatus(`${list.length} cycle(s) affiché(s)${activeFilters ? ' — ' + activeFilters : ''}`);
  }

  /* ──────────────────────────────────────────
     Bandes d'années
  ────────────────────────────────────────── */
  function computeYearBands(tlW, ppm) {
    const bands = [];
    const sy = W_START.getUTCFullYear();
    const ey = W_END.getUTCFullYear();
    for (let y = sy; y <= ey + 1; y++) {
      const ys = new Date(Date.UTC(y,     0, 1));
      const ye = new Date(Date.UTC(y + 1, 0, 1));
      const x1 = Math.max(0,   msToX(ys.getTime(), ppm));
      const x2 = Math.min(tlW, msToX(ye.getTime(), ppm));
      if (x2 > x1) bands.push({ x1, x2, year: y, even: y % 2 === 0 });
    }
    return bands;
  }

  /* ──────────────────────────────────────────
     Construction de l'en-tête des années
  ────────────────────────────────────────── */
  function buildYearHdr(el, tlW, ppm, yearBands) {
    el.innerHTML = '';
    el.style.cssText = `position:relative;height:${HH}px;width:${tlW}px;overflow:hidden;`;

    // Bandes d'années
    yearBands.forEach(({ x1, x2, year, even }) => {
      const band = document.createElement('div');
      band.style.cssText = `
        position:absolute;left:${x1}px;width:${x2 - x1}px;height:100%;
        background:${even ? '#eff6ff' : '#dbeafe'};
        border-right:1px solid #93c5fd;
        display:flex;align-items:center;justify-content:center;
        font-weight:700;font-size:13px;color:#1e40af;user-select:none;
      `;
      band.textContent = String(year);
      el.appendChild(band);

      // Traits de mois dans l'en-tête
      for (let m = 1; m < 12; m++) {
        const ms = new Date(Date.UTC(year, m, 1));
        const mx = msToX(ms.getTime(), ppm);
        if (mx < 0 || mx > tlW) continue;
        const isQ = m % 3 === 0;
        const tick = document.createElement('div');
        tick.style.cssText = `
          position:absolute;left:${mx}px;bottom:0;
          height:${isQ ? '55%' : '30%'};width:1px;
          background:#3b82f6;opacity:.45;pointer-events:none;
        `;
        el.appendChild(tick);
        if (isQ) {
          const lbl = document.createElement('span');
          lbl.style.cssText = `
            position:absolute;left:${mx + 2}px;top:3px;
            font-size:8px;color:#2563eb;font-weight:700;pointer-events:none;
          `;
          lbl.textContent = MONTHS_FR[m];
          el.appendChild(lbl);
        }
      }
    });

    // Ligne aujourd'hui
    const tx = msToX(TODAY.getTime(), ppm);
    if (tx >= 0 && tx <= tlW) {
      const line = document.createElement('div');
      line.className = 'today-line-hdr';
      line.style.left = `${tx}px`;
      line.title = 'Aujourd\'hui';
      el.appendChild(line);
    }
  }

  /* ──────────────────────────────────────────
     Construction d'une ligne de cycle
  ────────────────────────────────────────── */
  function buildRow(cycle, ppm, yearBands) {
    const row = document.createElement('div');
    row.className = 'cycle-row';

    // ── Colonne étiquette (nom de l'entreprise uniquement) ──
    const lbl = document.createElement('div');
    lbl.className = 'lbl-col';

    const info  = progMap.get(cycle.programmeId);
    const color = info?.color ?? colorFromName(cycle.programmeName);
    const pname = info?.nom   ?? cycle.programmeName;

    const nm = document.createElement('span');
    nm.className = 'co-name';
    nm.textContent = cycle.denomination || `#${cycle.id}`;
    nm.title = cycle.denomination;
    lbl.appendChild(nm);
    row.appendChild(lbl);

    // ── Colonne timeline ──
    const tl = document.createElement('div');
    tl.className = 'tl-col';

    // Arrière-plans de bandes d'années
    yearBands.forEach(({ x1, x2, even }) => {
      const bg = document.createElement('div');
      bg.className = 'yr-band';
      bg.style.left  = `${x1}px`;
      bg.style.width = `${x2 - x1}px`;
      bg.style.background = even ? '#f5f9ff' : '#eaf2ff';
      tl.appendChild(bg);
    });

    // Badge programme sur la timeline, juste avant la barre grise
    if (pname && cycle.dateDebut) {
      const bx = tsToX(cycle.dateDebut, ppm);
      const pbadge = document.createElement('div');
      pbadge.className = 'prog-badge-tl';
      pbadge.style.left       = `${bx}px`;
      pbadge.style.background = color;
      pbadge.title = pname;
      pbadge.textContent = pShort(pname);
      tl.appendChild(pbadge);
    }

    // Barre grise du cycle (date_debut_cycle → date_fin_certification)
    // Pleine si le cycle a un certificat, en hachuré (rubalise) si c'est un cycle
    // futur qui ne démarrera vraiment qu'une fois l'évaluation initiale terminée.
    if (cycle.dateDebut && cycle.dateFin) {
      const bx  = tsToX(cycle.dateDebut, ppm);
      const bw  = tsToX(cycle.dateFin,  ppm) - bx;
      if (bw > 0) {
        const bar = document.createElement('div');
        bar.className = 'cycle-bar' + (cycle.hasCertificat ? '' : ' future');
        bar.style.left  = `${bx}px`;
        bar.style.width = `${bw}px`;
        bar.title = `${fmtDate(cycle.dateDebut)} → ${fmtDate(cycle.dateFin)}`
          + (cycle.hasCertificat ? '' : ' (cycle futur — pas encore de certificat)');
        tl.appendChild(bar);
      }
    }

    // Trois traits jaunes (début de cycle, surveillance, fin/renouvellement)
    [
      [cycle.dateDebut, 'Début de cycle'],
      [cycle.dateSurv, 'Surveillance'],
      [cycle.dateFin,  'Renouvellement'],
    ].forEach(([ts, label]) => {
      if (!ts) return;
      const mx = tsToX(ts, ppm);
      if (mx < -5 || mx > 9999) return;
      const m = document.createElement('div');
      m.className = 'date-marker';
      m.style.left = `${mx}px`;
      m.title = `${label} : ${fmtDate(ts)}`;
      tl.appendChild(m);
    });

    // Badges EVA (évaluations liées) : barre de la date de début à la date de fin.
    // Anti-chevauchement simple : 2 files (haut/bas) selon que la barre précédente
    // sur la même file se termine avant le début de celle-ci. 1ère passe : calcule
    // les positions et détermine si une 2e file a vraiment été nécessaire — si non,
    // les badges restent centrés en hauteur au lieu d'être décalés pour rien.
    const laneEnd = [-Infinity, -Infinity]; // fin (px) de la dernière barre de chaque file
    const CENTER_Y = 18; // moitié de RH (36px)
    const badgesToPlace = [];
    let lane1Used = false;
    cycle.evalIds.forEach(eid => {
      const ev = evalMap.get(eid);
      if (!ev?.dateStart) return;
      const x1 = tsToX(ev.dateStart, ppm);
      const x2 = ev.dateEnd ? tsToX(ev.dateEnd, ppm) : x1;
      // Bornes exactes (pas d'élargissement artificiel) : seul un plancher minuscule
      // évite une largeur nulle/négative si les dates sont inversées.
      const w = Math.max(2, x2 - x1);
      if (x1 + w < -25 || x1 > 9999) return;

      const lane = x1 >= laneEnd[0] + 4 ? 0 : (x1 >= laneEnd[1] + 4 ? 1 : 0);
      laneEnd[lane] = x1 + w;
      if (lane === 1) lane1Used = true;

      badgesToPlace.push({ eid, ev, x1, w, lane });
    });

    badgesToPlace.forEach(({ eid, ev, x1, w, lane }) => {
      const stateClass = !ev.hasRE ? 'no-re' : (ev.terminee ? 'terminee' : 'en-cours');
      const label = ev.lib || ev.type || `Évaluation #${eid}`;
      const yOffset = lane1Used ? (lane === 0 ? -10 : 10) : 0;

      const badge = document.createElement('div');
      badge.className = `eva-badge ${stateClass}`;
      badge.style.left = `${x1}px`;
      badge.style.width = `${w}px`;
      badge.style.top = `${CENTER_Y + yOffset}px`;
      badge.style.transform = 'translateY(-50%)';
      badge.title = label
        + (ev.dateEnd ? ` — ${fmtDate(ev.dateStart)} → ${fmtDate(ev.dateEnd)}` : ` — ${fmtDate(ev.dateStart)}`);
      badge.textContent = label;
      tl.appendChild(badge);
    });

    // Badge certificat à la date de délivrance, si le certificat a un numéro
    const cert = certMap.get(cycle.certId);
    if (cert?.numero && cert.dateDelivrance) {
      const cx = tsToX(cert.dateDelivrance, ppm);
      if (cx > -15 && cx < 9999) {
        const cb = document.createElement('div');
        cb.className = 'cert-badge';
        cb.style.left = `${cx}px`;
        cb.title = cert.numero;
        cb.innerHTML = CERT_SVG;
        tl.appendChild(cb);
      }
    }

    // Ligne rouge aujourd'hui
    const tx = msToX(TODAY.getTime(), ppm);
    const todayLine = document.createElement('div');
    todayLine.className = 'today-line';
    todayLine.style.left = `${tx}px`;
    tl.appendChild(todayLine);

    row.appendChild(tl);
    return row;
  }

  /* ──────────────────────────────────────────
     Utilitaires de position
  ────────────────────────────────────────── */
  // milliseconde absolu → px
  function msToX(ms, ppm) { return (ms - W_START.getTime()) * ppm; }
  // Unix secondes → px
  function tsToX(ts, ppm) { return msToX(ts * 1000, ppm); }

  /* ──────────────────────────────────────────
     Utilitaires programme
  ────────────────────────────────────────── */
  function colorFromName(name) {
    const up = String(name ?? '').toUpperCase();
    for (const [k, v] of Object.entries(PROG_COLORS)) if (up.includes(k)) return v;
    return '#6b7280';
  }

  function progKey(name) {
    const up = String(name ?? '').toUpperCase();
    for (const k of Object.keys(PROG_COLORS)) if (up.includes(k)) return k;
    return '';
  }

  function pShort(name) {
    const up = String(name ?? '').toUpperCase();
    if (up.includes('SECNUMCLOUD')) return 'SNC';
    for (const k of Object.keys(PROG_COLORS)) if (up.includes(k)) return k;
    return String(name ?? '').slice(0, 4).toUpperCase();
  }

  /* ──────────────────────────────────────────
     Formatage de date
  ────────────────────────────────────────── */
  function fmtDate(ts) {
    const d = new Date(ts * 1000);
    return [
      String(d.getUTCDate()).padStart(2, '0'),
      String(d.getUTCMonth() + 1).padStart(2, '0'),
      d.getUTCFullYear(),
    ].join('/');
  }

  /* ──────────────────────────────────────────
     Barre de statut
  ────────────────────────────────────────── */
  function showStatus(msg, type = '') {
    const bar = document.getElementById('statusbar');
    bar.textContent = msg;
    bar.className   = `statusbar${type ? ' ' + type : ''}`;
  }

  /* ──────────────────────────────────────────
     Écouteurs toolbar
  ────────────────────────────────────────── */
  document.querySelectorAll('.tbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      sortMode = btn.dataset.sort;
      document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  document.getElementById('prog-filters').addEventListener('click', e => {
    const btn = e.target.closest('.fbtn');
    if (!btn) return;
    filterProg = btn.dataset.prog === filterProg ? '' : btn.dataset.prog;
    updateGroupBtns('prog-filters', 'prog', filterProg);
    render();
  });

  document.getElementById('resp-filters').addEventListener('click', e => {
    const btn = e.target.closest('.fbtn');
    if (!btn) return;
    filterResp = btn.dataset.resp === filterResp ? '' : btn.dataset.resp;
    updateGroupBtns('resp-filters', 'resp', filterResp);
    render();
  });

  /* ──────────────────────────────────────────
     Redimensionnement
  ────────────────────────────────────────── */
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 120);
  });
</script>
