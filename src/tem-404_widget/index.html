<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEM-404 — Traitement du dossier</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #1e293b;
      background: #f8fafc;
    }

    /* ── Barre d'en-tête : n°, date de réception, version ── */
    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      padding: 8px 14px;
      background: #1e3a8a;
      color: #fff;
    }
    .toolbar h1 { font-size: 13px; font-weight: 600; margin-right: auto; }
    .toolbar label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #bfdbfe; }
    .mini-input {
      padding: 4px 7px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      background: rgba(255,255,255,.18);
      color: #fff;
    }
    .mini-input::placeholder { color: rgba(255,255,255,.6); }
    .version-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 9px;
      background: rgba(255,255,255,.18);
    }

    /* ── Zone de dépôt du PDF + panneau d'info, chacun la moitié de la largeur ── */
    .drop-row { display: flex; gap: 12px; margin: 12px; align-items: stretch; }
    .dropzone {
      flex: 1;
      min-width: 0;
      padding: 22px;
      border: 2px dashed #94a3b8;
      border-radius: 8px;
      text-align: center;
      color: #475569;
      background: #fff;
    }
    .dropzone.drag-over { border-color: #2563eb; background: #eff6ff; }
    .browse-label { color: #2563eb; cursor: pointer; font-weight: 600; text-decoration: underline; }

    .drop-info {
      flex: 1;
      min-width: 0;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }
    .drop-info-row { display: flex; justify-content: space-between; gap: 8px; }
    .drop-info-row span { color: #64748b; }
    .drop-message { font-size: 12px; margin-top: 2px; }
    .drop-message.success { color: #0f5132; }
    .drop-message.error { color: #842029; }

    /* ── Trois colonnes ── */
    .columns {
      display: flex;
      gap: 12px;
      margin: 0 12px 12px;
      align-items: stretch;
    }
    .col {
      flex: 1;
      min-width: 0;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
    }
    .col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 8px 10px;
      font-weight: 600;
      font-size: 12px;
      background: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
      border-radius: 8px 8px 0 0;
    }
    .nav { display: flex; align-items: center; gap: 4px; font-weight: 400; }
    .nav-btn {
      border: 1px solid #cbd5e1;
      background: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      padding: 1px 7px;
    }
    .nav-btn:disabled { opacity: .4; cursor: default; }
    .nav-count { font-size: 11px; color: #64748b; min-width: 32px; text-align: center; }

    .col-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .col-footer { padding: 10px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #e2e8f0; }

    .field-item { display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
    .field-item span { color: #64748b; }
    .field-item input, .field-item select, .field-item textarea {
      padding: 5px 7px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 12px;
      font-family: inherit;
    }
    .field-item textarea { resize: vertical; }
    /* Une case à cocher ne doit pas hériter du padding/bordure des champs texte : sur une
       case native, un padding fait dessiner le carré de la case *à l'intérieur* de la boîte
       ainsi agrandie, ce qui la décale visuellement vers le bas/la droite au lieu de rester
       alignée à gauche sous son libellé. */
    .field-item input[type="checkbox"] {
      padding: 0;
      border: none;
      width: 15px;
      height: 15px;
      align-self: flex-start;
    }

    .cand-field { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 2px 0; }
    .cand-field span { color: #64748b; }
    .cand-section-title {
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #e2e8f0;
    }
    .empty-col { color: #94a3b8; font-style: italic; font-size: 12px; padding: 6px 0; }

    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      background: #2563eb;
      color: #fff;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #e2e8f0; color: #1e293b; }
    .btn-secondary:hover { background: #cbd5e1; }

    /* ── Toutes les données du PDF ── */
    .all-fields { margin: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; }
    .field-group {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
    }
    .field-group h4 { font-size: 12px; margin-bottom: 8px; color: #334155; }
    /* Une field-row par sous-enregistrement logique (ex. un contact, une ligne SI) : un
       retour à la ligne garanti entre deux sous-enregistrements, pas juste un flux qui
       s'enroule selon la largeur disponible (cf. rowKeyFor). */
    .field-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .field-row:last-child { margin-bottom: 0; }
    .field-row .field-item { flex: 1 1 160px; max-width: 240px; }
    /* Champ pleine largeur (cf. WIDE_FIELD_IDS / f.lines) : spécificité égale à la règle
       ci-dessus (même combinateur descendant) + classe supplémentaire, pour être sûr de
       l'emporter indépendamment de l'ordre des règles. */
    .field-row .field-item.field-item-wide { flex: 1 1 100%; max-width: 100%; }

    /* ── A.3 — Contacts : cadre TEM-404 (gauche) / cadre GRIST (droite) ── */
    .contacts-split { display: flex; gap: 12px; align-items: flex-start; }
    .contacts-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .contacts-pane h5 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: #64748b;
    }
    .contacts-pane .btn { align-self: flex-start; }
    .contact-card {
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #f8fafc;
    }
    .contact-card-header { font-weight: 600; padding-bottom: 2px; border-bottom: 1px solid #e2e8f0; }
    .contact-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
    .contact-row .field-item { flex: 1 1 110px; max-width: 200px; }
    .contact-row-label { font-size: 12px; color: #64748b; flex: 0 0 auto; }
    .contact-checkbox-group { display: flex; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; }
    .contact-grist-card {
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      background: #fff;
      line-height: 1.6;
    }
    .contact-grist-card + .contact-grist-card { margin-top: 8px; }

    /* ── Pied de page : statut + enregistrer ── */
    .footer {
      position: sticky;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: #fff;
      border-top: 1px solid #e2e8f0;
    }
    .statusbar { flex: 1; font-size: 12px; }
    .statusbar.success { color: #0f5132; }
    .statusbar.error   { color: #842029; }
    .btn-save { background: #16a34a; }
    .btn-save:hover { background: #15803d; }
  </style>
</head>
<body>

<div class="toolbar">
  <h1 id="widgetTitle">TEM-404 — Traitement du dossier</h1>
  <label>N° <input id="numTem404" class="mini-input" placeholder="—"></label>
  <label>Réception <input id="dateReception" type="date" class="mini-input"></label>
  <span id="versionLabel" class="version-badge"></span>
</div>

<div class="drop-row">
  <div id="dropzone" class="dropzone">
    Glissez-déposez le PDF TEM-404 rempli ici, ou
    <label class="browse-label">parcourir<input type="file" id="fileInput" accept="application/pdf" hidden></label>
  </div>
  <div id="dropInfo" class="drop-info">
    <div class="drop-info-row"><span>Fichier déposé</span><strong id="dropFileName">—</strong></div>
    <div class="drop-info-row"><span>Schéma détecté</span><strong id="dropSchemaVersion">—</strong></div>
    <div id="dropMessage" class="drop-message"></div>
  </div>
</div>

<div class="columns">
  <div class="col col-pdf">
    <div class="col-header">TEM-404</div>
    <div id="col1Fields" class="col-body"></div>
  </div>

  <div class="col col-grist">
    <div class="col-header">
      GRIST
      <span class="nav">
        <button class="nav-btn" id="gristPrev">‹</button>
        <span class="nav-count" id="gristNavCount"></span>
        <button class="nav-btn" id="gristNext">›</button>
      </span>
    </div>
    <div id="gristBox" class="col-body"></div>
    <div class="col-footer">
      <button class="btn btn-secondary" id="btnCreateClient">Créer un nouveau client</button>
      <button class="btn btn-secondary" id="btnUpdateFromTem404">Remplacer par les données TEM-404</button>
      <button class="btn btn-secondary" id="btnUpdateFromAnnuaire">Remplacer par les données annuaire</button>
    </div>
  </div>

  <div class="col col-annuaire">
    <div class="col-header">
      Annuaire des entreprises
      <span class="nav">
        <button class="btn btn-secondary" id="btnQueryAnnuaire" style="padding:3px 8px;font-size:11px;">Interroger l'annuaire</button>
        <button class="nav-btn" id="annuairePrev">‹</button>
        <span class="nav-count" id="annuaireNavCount"></span>
        <button class="nav-btn" id="annuaireNext">›</button>
      </span>
    </div>
    <div id="annuaireBox" class="col-body"></div>
  </div>
</div>

<div id="allFields" class="all-fields"></div>

<div class="footer">
  <div class="statusbar" id="statusbar"></div>
  <button class="btn btn-save" id="btnSave">Enregistrer</button>
</div>

<script>
  // Widget lié à la table TEM_404. Écrit aussi dans Entreprises + Sites (site "Siège"
  // uniquement) et dans Contacts (section A.3, cf. buildContactsSection) — toujours via un
  // bouton dédié et après confirmation explicite (window.confirm), jamais automatiquement.
  // Sites 2 à 6 restent hors périmètre (chantier séparé).

  // Version du widget lui-même (à incrémenter à chaque changement notable) — distincte
  // de `schema.schema_version` (celle du formulaire PDF). Affichée dans le titre pour
  // vérifier facilement, en test, qu'on charge bien la dernière version déployée.
  const WIDGET_VERSION = '1.9.1';
  document.getElementById('widgetTitle').textContent =
    `TEM-404 — Traitement du dossier — version du widget ${WIDGET_VERSION}`;

  const COLUMN1_FIELDS = [
    ['demandeur.nom', 'Dénomination'],
    ['demandeur.siren', 'SIREN'],
    ['demandeur.siret', 'SIRET'],
    ['demandeur.adresse1', 'Adresse 1'],
    ['demandeur.adresse2', 'Adresse 2'],
    ['demandeur.code_postal', 'Code postal'],
    ['demandeur.ville', 'Ville'],
    ['demandeur.pays', 'Pays'],
    ['demandeur.telephone', 'Téléphone'],
    ['demandeur.site_internet', 'Site internet'],
  ];
  const COLUMN1_IDS = new Set(COLUMN1_FIELDS.map(([id]) => id));

  let schema = null;           // { form_id, schema_version, fields: [...] } chargé depuis schemas/vX.json
  let pdfFields = {};          // id de champ -> valeur courante (éditable)
  let currentRecordId = null;  // ligne TEM_404 en cours d'édition, ou null = nouveau dossier
  let numTem404 = '';
  let dateReception = '';

  let gristCandidates = [];
  let gristIdx = 0;
  let annuaireCandidates = [];
  let annuaireIdx = 0;

  // Rendu initial des colonnes 2/3 (état "aucune correspondance") : la zone de dépôt est
  // toujours active indépendamment de toute sélection Grist (table TEM_404 vide comprise)
  // — ce rendu évite juste que les colonnes restent visuellement vides au premier chargement.
  renderGristColumn();
  renderAnnuaireColumn();

  // ── Grist ────────────────────────────────────────────────────────────────

  grist.ready({ requiredAccess: 'full' });

  grist.onRecord(async record => {
    if (!record || !record.id || record.id < 0) return; // pas de sélection valide
    // Tout le corps est protégé : une exception non interceptée ici (ex. date invalide)
    // interromprait silencieusement le reste — y compris le renderAll() qui met à jour
    // l'affichage — sans qu'aucun champ ne se mette à jour ni qu'aucune erreur n'apparaisse.
    try {
      currentRecordId = record.id;
      numTem404 = String(record.NumTEM404 ?? '');
      dateReception = formatDateForInput(record.Date_Reception);

      let complet = {};
      try { complet = JSON.parse(record.Json_Complet || '{}'); } catch (e) { console.warn('Json_Complet:', e); }
      pdfFields = complet;

      const version = String(record.Version ?? '');
      schema = await loadSchema(version) || fallbackSchemaFromKeys(complet);

      await loadGristCandidates(); // l'annuaire n'est interrogé que sur clic (bouton dédié)
      renderAll();
      showStatus(`Dossier ${esc(numTem404)} chargé.`, '', 2500);
    } catch (e) {
      console.warn('onRecord:', e);
      showStatus(`Erreur au chargement du dossier : ${e.message}`, 'error');
    }
  });

  function formatDateForInput(value) {
    // <input type="date"> n'accepte QUE le format AAAA-MM-JJ : quel que soit le format
    // reçu de Grist, il faut le convertir. Selon la voie d'accès (grist.onRecord vs
    // fetchTable) et le format d'affichage configuré sur la colonne, Grist peut renvoyer
    // un timestamp Unix (secondes), une chaîne déjà ISO "AAAA-MM-JJ", ou une chaîne au
    // format d'affichage français "JJ/MM/AAAA" (ou "JJ-MM-AAAA") : on gère les trois
    // plutôt que de supposer un format fixe.
    if (!value) return '';
    if (typeof value === 'number') {
      const d = new Date(value * 1000);
      return isNaN(d.getTime()) ? '' : d.toISOString().slice(0, 10);
    }
    if (typeof value === 'string') {
      let m = value.match(/^(\d{4})-(\d{2})-(\d{2})/); // AAAA-MM-JJ (ISO)
      if (m) return `${m[1]}-${m[2]}-${m[3]}`;
      m = value.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/); // JJ/MM/AAAA ou JJ-MM-AAAA
      if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    }
    return '';
  }

  async function loadSchema(version) {
    if (!version) return null;
    try {
      const resp = await fetch(`schemas/v${version}.json`);
      return resp.ok ? await resp.json() : null;
    } catch (e) {
      console.warn('loadSchema:', e);
      return null;
    }
  }

  function fallbackSchemaFromKeys(obj) {
    return {
      form_id: 'tem-404',
      schema_version: '',
      fields: Object.keys(obj).map(id => ({ id, label: id, type: 'text', grist_table: null })),
    };
  }

  // ── Dépôt du PDF ─────────────────────────────────────────────────────────

  const dropzone = document.getElementById('dropzone');
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag-over');
    const file = e.dataTransfer.files?.[0];
    if (file) handlePdfFile(file);
  });
  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files?.[0];
    if (file) handlePdfFile(file);
  });

  async function handlePdfFile(file) {
    document.getElementById('dropFileName').textContent = file.name;
    document.getElementById('dropSchemaVersion').textContent = '—';
    setDropInfo('Lecture du PDF…');
    try {
      const bytes = await file.arrayBuffer();
      const pdfDoc = await PDFLib.PDFDocument.load(bytes);
      const form = pdfDoc.getForm();

      let formVersion = null;
      try { formVersion = form.getTextField('_form_version').getText(); } catch (e) { /* champ absent */ }
      if (!formVersion) {
        setDropInfo('PDF non reconnu ou aplati (champs de formulaire absents) — impossible de le traiter.', 'error');
        return;
      }
      document.getElementById('dropSchemaVersion').textContent = formVersion;

      const loaded = await loadSchema(formVersion);
      if (!loaded) {
        setDropInfo(`Version de schéma inconnue : ${esc(formVersion)}`, 'error');
        return;
      }
      schema = loaded;

      pdfFields = {};
      schema.fields.forEach(f => { pdfFields[f.id] = readPdfField(form, f); });

      currentRecordId = null; // un dépôt de PDF initie toujours un nouveau dossier
      numTem404 = await generateNumTem404();
      dateReception = new Date().toISOString().slice(0, 10);

      await loadGristCandidates(); // l'annuaire n'est interrogé que sur clic (bouton dédié)
      renderAll();
      setDropInfo('PDF chargé.', 'success');
    } catch (e) {
      console.warn('handlePdfFile:', e);
      setDropInfo(`Impossible de lire ce PDF : ${e.message}`, 'error');
    }
  }

  function setDropInfo(message, type = '') {
    const el = document.getElementById('dropMessage');
    el.textContent = message || '';
    el.className = `drop-message ${type}`;
  }

  function readPdfField(form, f) {
    try {
      if (f.type === 'checkbox') {
        return form.getCheckBox(f.id).isChecked();
      }
      // 'radio' = vrai groupe de boutons radio (plusieurs widgets, un seul nom de champ,
      // ex. f.siege : un bouton par ligne de site, un seul sélectionnable) — distinct de
      // 'choice', qui est une liste déroulante classique.
      if (f.type === 'radio') {
        return form.getRadioGroup(f.id).getSelected() || '';
      }
      if (f.type === 'choice') {
        try { return form.getDropdown(f.id).getSelected()[0] || ''; }
        catch (e) { return form.getOptionList(f.id).getSelected()[0] || ''; }
      }
      return form.getTextField(f.id).getText() || '';
    } catch (e) {
      return f.type === 'checkbox' ? false : '';
    }
  }

  // ── Numérotation [année]_TEM-404_[####] ─────────────────────────────────

  async function generateNumTem404() {
    const year = new Date().getFullYear();
    let maxSeq = 0;
    try {
      const tbl = await grist.docApi.fetchTable('TEM_404');
      const re = new RegExp(`^${year}_TEM-404_(\\d{4})$`);
      for (let i = 0; i < tbl.id.length; i++) {
        const m = re.exec(String(tbl.NumTEM404?.[i] ?? ''));
        if (m) maxSeq = Math.max(maxSeq, parseInt(m[1], 10));
      }
    } catch (e) { console.warn('generateNumTem404:', e); }
    return `${year}_TEM-404_${String(maxSeq + 1).padStart(4, '0')}`;
  }

  // ── Rapprochement GRIST (Entreprises) ────────────────────────────────────

  const digitsOnly = v => String(v ?? '').replace(/\D/g, '');

  // Normalisation + distance de Levenshtein : tolère fautes de frappe/accents
  // (ex. « Orange cyberdefence » doit retrouver « Orange Cyberdefense »).
  function normalizeName(s) {
    return String(s ?? '')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
  }

  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) {
        cur[j] = a[i - 1] === b[j - 1]
          ? prev[j - 1]
          : 1 + Math.min(prev[j - 1], prev[j], cur[j - 1]);
      }
      prev = cur;
    }
    return prev[n];
  }

  function nameSimilarity(a, b) {
    if (!a || !b) return 0;
    return 1 - levenshtein(a, b) / Math.max(a.length, b.length);
  }

  const NAME_SIMILARITY_THRESHOLD = 0.72;

  async function loadGristCandidates() {
    gristCandidates = [];
    gristIdx = 0;
    try {
      const tbl = await grist.docApi.fetchTable('Entreprises');
      const siren = digitsOnly(pdfFields['demandeur.siren']);
      const siret = digitsOnly(pdfFields['demandeur.siret']);
      const nameNorm = normalizeName(pdfFields['demandeur.nom']);

      const exact = [];
      const fuzzy = [];
      for (let i = 0; i < tbl.id.length; i++) {
        const id = tbl.id[i];
        if (!id || id < 0) continue;
        const rowSiren = digitsOnly(tbl.SIREN?.[i]);
        const rowSiret = digitsOnly(tbl.SIRET?.[i]);
        const rowName = String(tbl.Denomination?.[i] || '');
        const rowNameNorm = normalizeName(rowName);
        const cand = { id, nom: rowName, siren: tbl.SIREN?.[i], siret: tbl.SIRET?.[i] };
        if (siren && rowSiren && siren === rowSiren) { exact.push(cand); continue; }
        if (siret && rowSiret && siret === rowSiret) { exact.push(cand); continue; }
        if (!nameNorm || !rowNameNorm) continue;
        const isSubstring = rowNameNorm.includes(nameNorm) || nameNorm.includes(rowNameNorm);
        const isSimilar = nameSimilarity(nameNorm, rowNameNorm) >= NAME_SIMILARITY_THRESHOLD;
        if (isSubstring || isSimilar) fuzzy.push(cand);
      }
      gristCandidates = [...exact, ...fuzzy];
    } catch (e) { console.warn('loadGristCandidates:', e); }
  }

  async function findSiegeSiteId(entrepriseId) {
    try {
      const tbl = await grist.docApi.fetchTable('Sites');
      for (let i = 0; i < tbl.id.length; i++) {
        if (tbl.Entreprise?.[i] === entrepriseId && tbl.Siege?.[i]) return tbl.id[i];
      }
    } catch (e) { console.warn('findSiegeSiteId:', e); }
    return null;
  }

  // Crée ou met à jour (upsert) le site "Siège" d'une entreprise. Périmètre actuel :
  // uniquement le site du siège (site 1 du TEM-404) ; les sites 2 à 6 et les contacts
  // restent à faire dans un chantier séparé.
  async function upsertSiege(entrepriseId, { nomSite, street, street2, zip, city, pays }) {
    const fields = {
      Entreprise: entrepriseId,
      Nom_site: nomSite || 'Siège',
      Street: street || '',
      Street2: street2 || '',
      Zip: zip || '',
      City: city || '',
      Pays: pays || '',
      Siege: true,
      Actif: true,
    };
    const existingId = await findSiegeSiteId(entrepriseId);
    if (existingId) {
      await grist.docApi.applyUserActions([['UpdateRecord', 'Sites', existingId, fields]]);
    } else {
      await grist.docApi.applyUserActions([['AddRecord', 'Sites', null, fields]]);
    }
  }

  function sirenToInt(value) {
    const digits = digitsOnly(value);
    return digits ? Number(digits) : null;
  }

  // ── Rapprochement annuaire des entreprises (API publique) ────────────────
  // Essaie SIRET, puis SIREN, puis nom : s'arrête à la première requête qui
  // trouve quelque chose (un SIRET/SIREN de test ou erroné ne doit pas
  // masquer une recherche par nom qui, elle, aurait trouvé l'entreprise).

  async function loadAnnuaireCandidates() {
    annuaireCandidates = [];
    annuaireIdx = 0;
    const siret = digitsOnly(pdfFields['demandeur.siret']);
    const siren = digitsOnly(pdfFields['demandeur.siren']);
    const nom = String(pdfFields['demandeur.nom'] || '').trim();

    const queries = [...new Set([siret, siren, nom].filter(Boolean))];
    let anyError = false;
    for (const q of queries) {
      const { results, error } = await searchAnnuaire(q);
      if (error) anyError = true;
      if (results.length) { annuaireCandidates = results; return; }
    }
    if (anyError) showStatus('Annuaire des entreprises injoignable (vérifiez la connexion).', 'error', 4000);
  }

  async function searchAnnuaire(q) {
    try {
      const resp = await fetch(`https://recherche-entreprises.api.gouv.fr/search?q=${encodeURIComponent(q)}&per_page=5`);
      if (!resp.ok) return { results: [], error: true };
      const data = await resp.json();
      const results = (data.results || []).map(r => ({
        siren: r.siren,
        nom: r.nom_complet || r.nom_raison_sociale || '',
        siret: r.siege?.siret || '',
        adresse1: r.siege?.adresse || '',
        adresse2: r.siege?.complement_adresse || '',
        codePostal: r.siege?.code_postal || '',
        ville: r.siege?.libelle_commune || '',
        pays: 'France', // l'annuaire des entreprises ne couvre que les entreprises françaises
      }));
      return { results, error: false };
    } catch (e) {
      console.warn('searchAnnuaire:', q, e);
      return { results: [], error: true };
    }
  }

  const PROGRAMME_LABELS = { passi: 'PASSI', pacs: 'PACS', pris: 'PRIS', pdis: 'PDIS', pams: 'PAMS', secnumcloud: 'SecNumCloud' };
  const PROGRAMS = Object.keys(PROGRAMME_LABELS);
  const PROGRAMS_WITH_EXAMENS = ['passi', 'pacs', 'pris'];
  // Numérotation des paragraphes B.1-B.6 (cf. TEM-404.md : ### B.1 PASSI, B.2 PACS, B.3
  // PRIS, B.4 PDIS, B.5 PAMS, B.6 SecNumCloud) — purement un libellé d'affichage ici.
  const PROGRAMME_B_NUMBER = { passi: '1', pacs: '2', pris: '3', pdis: '4', pams: '5', secnumcloud: '6' };

  function groupLabel(id) {
    if (id.startsWith('contact.')) return 'A.3 — Contacts';
    // Les chefs de projet / responsables examens de B.1-B.6 sont consolidés avec les
    // contacts A.3 (cf. buildContactsSection) : une même personne peut être chef de
    // projet de plusieurs programmes, ce que le PDF répète par programme mais que GRIST
    // modélise par une seule fiche Contacts avec des RefList Programmes_Responsable /
    // Programmes_Examens. Ils ne doivent donc plus apparaître dans leur groupe "B.N — ...".
    if (/^b\.[a-z]+\.(chef_projet|responsable_examens)\./.test(id)) return 'A.3 — Contacts';
    if (id.startsWith('f.site')) return 'A.2 — Sites';
    if (id.startsWith('si.')) return 'F — Systèmes d’information';
    const bMatch = id.match(/^b\.([a-z]+)\./);
    if (bMatch) return `B.${PROGRAMME_B_NUMBER[bMatch[1]] || '?'} — ${PROGRAMME_LABELS[bMatch[1]] || bMatch[1]}`;
    const b2Match = id.match(/^b2\.([a-z]+)\./);
    if (b2Match) return `B.7 — Historique — ${PROGRAMME_LABELS[b2Match[1]] || b2Match[1]}`;
    if (id.startsWith('b3.')) return 'B.8 — Statut ANSSI';
    return 'Autres';
  }

  // Ordre d'affichage forcé pour certains groupes : l'ordre naturel suit la première
  // occurrence d'un champ de ce groupe dans schema.fields, qui ne correspond pas toujours
  // à l'ordre souhaité à l'écran (ex. les champs f.site* sont déclarés tard dans le
  // formulaire alors que "A.2 — Sites" doit s'afficher avant "A.3 — Contacts"). Les groupes
  // non listés ici gardent leur ordre naturel, à la suite de ceux listés.
  const GROUP_ORDER_PRIORITY = ['A.2 — Sites', 'A.3 — Contacts'];

  // Sous-groupe au sein d'un groupe (= une ligne de rendu) : les champs répétés par
  // motif de suffixe (programme_xxx, site_N) partagent une ligne entre eux (ex. les 6
  // cases PASSI..SecNumCloud d'un SI), les autres partagent une ligne par préfixe
  // d'identifiant une fois le dernier segment ôté (ex. contact.representant_legal.*
  // ensemble, contact.facturation.* sur la ligne suivante).
  function rowKeyFor(id) {
    const m = id.match(/^(.*)\.(programme_\w+|site_\d+)$/);
    if (m) return m[1] + (id.includes('.programme_') ? '.__programme' : '.__site');
    const parts = id.split('.');
    parts.pop();
    return parts.join('.') || id;
  }

  function renderAllFields() {
    const container = document.getElementById('allFields');
    container.innerHTML = '';
    if (!schema) return;

    const groups = new Map(); // label -> Map(rowKey -> fields[])
    schema.fields.forEach(f => {
      if (COLUMN1_IDS.has(f.id) || f.deprecated || f.read_only) return;
      const label = groupLabel(f.id);
      if (!groups.has(label)) groups.set(label, new Map());
      const rows = groups.get(label);
      const rk = rowKeyFor(f.id);
      if (!rows.has(rk)) rows.set(rk, []);
      rows.get(rk).push(f);
    });

    contactsGristBoxEl = null;
    sitesGristBoxEl = null;
    siGristBoxEl = null;

    const renderGroup = (label, rows) => {
      const section = document.createElement('div');
      section.className = 'field-group';
      const h = document.createElement('h4');
      h.textContent = label;
      section.appendChild(h);
      if (label === 'A.3 — Contacts') {
        section.appendChild(buildContactsSection());
      } else if (label === 'A.2 — Sites') {
        section.appendChild(buildSitesSection());
      } else if (label === 'F — Systèmes d’information') {
        section.appendChild(buildSISection());
      } else {
        for (const fields of rows.values()) {
          const row = document.createElement('div');
          row.className = 'field-row';
          fields.forEach(f => row.appendChild(buildFieldInput(f)));
          section.appendChild(row);
        }
      }
      container.appendChild(section);
    };

    const alreadyRendered = new Set();
    for (const label of GROUP_ORDER_PRIORITY) {
      if (!groups.has(label)) continue;
      renderGroup(label, groups.get(label));
      alreadyRendered.add(label);
    }
    for (const [label, rows] of groups) {
      if (alreadyRendered.has(label)) continue;
      renderGroup(label, rows);
    }
  }

  // ── A.3 — Contacts : consolidation TEM-404 ↔ GRIST ───────────────────────
  // Une même personne physique peut apparaître plusieurs fois dans le TEM-404
  // (représentant légal, facturation, chef de projet d'un ou plusieurs programmes,
  // responsable examens PASSI/PACS/PRIS) alors que GRIST n'a qu'une fiche Contacts par
  // personne, avec deux RefList (Programmes_Responsable / Programmes_Examens). On
  // rassemble donc ici toutes les occurrences en une fiche par personne avant affichage.

  let consolidatedContacts = [];   // fiches consolidées de la case TEM-404 (éditables)
  let contactsGristBoxEl = null;   // noeud DOM de la case GRIST (A.3), pour rafraîchissement ciblé
  let programmeIdByKey = null;     // { passi: <id Grist>, ... } résolu depuis Programmes.Nom_du_programme

  function buildConsolidatedContacts() {
    const sources = [
      { prefix: 'contact.representant_legal', role: 'legal' },
      { prefix: 'contact.facturation', role: 'facturation' },
      ...PROGRAMS.map(p => ({ prefix: `b.${p}.chef_projet`, role: 'programme', programme: p })),
      ...PROGRAMS_WITH_EXAMENS.map(p => ({ prefix: `b.${p}.responsable_examens`, role: 'examens', programme: p })),
    ];
    const byKey = new Map();
    const order = [];
    for (const src of sources) {
      const prenom = String(pdfFields[`${src.prefix}.prenom`] || '').trim();
      const nom = String(pdfFields[`${src.prefix}.nom`] || '').trim();
      const courriel = String(pdfFields[`${src.prefix}.courriel`] || '').trim();
      const telephone = String(pdfFields[`${src.prefix}.telephone`] || '').trim();
      if (!prenom && !nom && !courriel) continue; // section non renseignée (programme non demandé, etc.)
      // Clé de dédoublonnage : email si présent (le plus fiable), sinon prénom+nom.
      const key = (courriel || `${prenom}|${nom}`).toLowerCase();
      if (!byKey.has(key)) {
        byKey.set(key, {
          prenom, nom, courriel, telephone,
          legal: false, facturation: false,
          programmeResponsable: new Set(), programmeExamens: new Set(),
          copyToGrist: true,
        });
        order.push(key);
      }
      const c = byKey.get(key);
      c.prenom = c.prenom || prenom;
      c.nom = c.nom || nom;
      c.courriel = c.courriel || courriel;
      c.telephone = c.telephone || telephone;
      if (src.role === 'legal') c.legal = true;
      if (src.role === 'facturation') c.facturation = true;
      if (src.role === 'programme') c.programmeResponsable.add(src.programme);
      if (src.role === 'examens') c.programmeExamens.add(src.programme);
    }
    return order.map(k => byKey.get(k));
  }

  function buildContactsSection() {
    consolidatedContacts = buildConsolidatedContacts();

    const split = document.createElement('div');
    split.className = 'contacts-split';

    const left = document.createElement('div');
    left.className = 'contacts-pane';
    const leftTitle = document.createElement('h5');
    leftTitle.textContent = 'TEM-404';
    left.appendChild(leftTitle);
    const cardsBox = document.createElement('div');
    cardsBox.className = 'contacts-cards';
    left.appendChild(cardsBox);
    renderContactCards(cardsBox);
    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn btn-secondary';
    copyBtn.textContent = 'Copier les contacts cochés dans GRIST';
    copyBtn.addEventListener('click', onCopyContactsClick);
    left.appendChild(copyBtn);

    const right = document.createElement('div');
    right.className = 'contacts-pane';
    const rightTitle = document.createElement('h5');
    rightTitle.textContent = 'GRIST';
    right.appendChild(rightTitle);
    contactsGristBoxEl = document.createElement('div');
    contactsGristBoxEl.className = 'empty-col';
    contactsGristBoxEl.textContent = 'Chargement…';
    right.appendChild(contactsGristBoxEl);

    split.appendChild(left);
    split.appendChild(right);

    refreshContactsGristBox();

    return split;
  }

  function renderContactCards(container) {
    container.innerHTML = '';
    if (!consolidatedContacts.length) {
      container.innerHTML = '<div class="empty-col">Aucun contact détecté dans le TEM-404.</div>';
      return;
    }
    consolidatedContacts.forEach(c => container.appendChild(buildContactCard(c)));
  }

  function buildContactCard(c) {
    const card = document.createElement('div');
    card.className = 'contact-card';

    const header = document.createElement('label');
    header.className = 'contact-checkbox-group contact-card-header';
    header.innerHTML = `<input type="checkbox" ${c.copyToGrist ? 'checked' : ''}><span>À copier dans GRIST</span>`;
    header.querySelector('input').addEventListener('change', e => { c.copyToGrist = e.target.checked; });
    card.appendChild(header);

    const row1 = document.createElement('div');
    row1.className = 'contact-row';
    row1.appendChild(contactTextInput(c, 'nom', 'Nom'));
    row1.appendChild(contactTextInput(c, 'prenom', 'Prénom'));
    row1.appendChild(contactTextInput(c, 'courriel', 'Email'));
    row1.appendChild(contactTextInput(c, 'telephone', 'Téléphone'));
    card.appendChild(row1);

    const row2 = document.createElement('div');
    row2.className = 'contact-row';
    row2.appendChild(contactFlagCheckbox(c, 'legal', 'Représentant légal'));
    row2.appendChild(contactFlagCheckbox(c, 'facturation', 'Facturation'));
    card.appendChild(row2);

    // 6 programmes (PASSI/PACS/PRIS/PDIS/PAMS/SecNumCloud), alignés sur
    // Contacts.Programmes_Responsable (RefList:Programmes) côté GRIST.
    const row3 = document.createElement('div');
    row3.className = 'contact-row';
    const label3 = document.createElement('span');
    label3.className = 'contact-row-label';
    label3.textContent = 'Responsable programme';
    row3.appendChild(label3);
    PROGRAMS.forEach(p => row3.appendChild(contactSetCheckbox(c, 'programmeResponsable', p, PROGRAMME_LABELS[p])));
    card.appendChild(row3);

    const row4 = document.createElement('div');
    row4.className = 'contact-row';
    const label4 = document.createElement('span');
    label4.className = 'contact-row-label';
    label4.textContent = 'Responsable examens';
    row4.appendChild(label4);
    PROGRAMS_WITH_EXAMENS.forEach(p => row4.appendChild(contactSetCheckbox(c, 'programmeExamens', p, PROGRAMME_LABELS[p])));
    card.appendChild(row4);

    return card;
  }

  function contactTextInput(c, field, label) {
    const wrap = document.createElement('label');
    wrap.className = 'field-item';
    wrap.innerHTML = `<span>${esc(label)}</span><input type="text" value="${esc(c[field] ?? '')}">`;
    wrap.querySelector('input').addEventListener('input', e => { c[field] = e.target.value; });
    return wrap;
  }

  function contactFlagCheckbox(c, field, label) {
    const wrap = document.createElement('label');
    wrap.className = 'contact-checkbox-group';
    wrap.innerHTML = `<input type="checkbox" ${c[field] ? 'checked' : ''}><span>${esc(label)}</span>`;
    wrap.querySelector('input').addEventListener('change', e => { c[field] = e.target.checked; });
    return wrap;
  }

  function contactSetCheckbox(c, setField, programme, label) {
    const wrap = document.createElement('label');
    wrap.className = 'contact-checkbox-group';
    const checked = c[setField].has(programme);
    wrap.innerHTML = `<input type="checkbox" ${checked ? 'checked' : ''}><span>${esc(label)}</span>`;
    wrap.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) c[setField].add(programme); else c[setField].delete(programme);
    });
    return wrap;
  }

  // Résout une seule fois les ids GRIST des programmes (table Programmes, colonne
  // Nom_du_programme) — jamais d'id figé en dur, au cas où l'ordre/les ids diffèrent
  // d'un document Grist à l'autre.
  async function loadProgrammeIds() {
    if (programmeIdByKey) return programmeIdByKey;
    programmeIdByKey = {};
    try {
      const tbl = await grist.docApi.fetchTable('Programmes');
      const byLabel = {};
      for (const [key, label] of Object.entries(PROGRAMME_LABELS)) byLabel[label.toLowerCase()] = key;
      for (let i = 0; i < tbl.id.length; i++) {
        const nom = String(tbl.Nom_du_programme?.[i] || '').toLowerCase();
        const key = byLabel[nom];
        if (key) programmeIdByKey[key] = tbl.id[i];
      }
    } catch (e) { console.warn('loadProgrammeIds:', e); }
    return programmeIdByKey;
  }

  async function loadExistingGristContacts(entrepriseId) {
    if (!entrepriseId) return [];
    try {
      await loadProgrammeIds();
      const idToLabel = {};
      for (const [key, id] of Object.entries(programmeIdByKey)) idToLabel[id] = PROGRAMME_LABELS[key];
      const tbl = await grist.docApi.fetchTable('Contacts');
      const asList = raw => Array.isArray(raw) ? raw.slice(1) : []; // RefList Grist : ['L', id1, id2…]
      const out = [];
      for (let i = 0; i < tbl.id.length; i++) {
        if (tbl.Entreprise?.[i] !== entrepriseId) continue;
        out.push({
          id: tbl.id[i],
          nom: tbl.Nom?.[i] || '',
          prenom: tbl.Prenom?.[i] || '',
          courriel: tbl.Courriel?.[i] || '',
          telephone: tbl.telephone?.[i] || '',
          legal: !!tbl.Representant_legal?.[i],
          facturation: !!tbl.Facturation?.[i],
          programmeResponsable: asList(tbl.Programmes_Responsable?.[i]).map(id => idToLabel[id]).filter(Boolean),
          programmeExamens: asList(tbl.Programmes_Examens?.[i]).map(id => idToLabel[id]).filter(Boolean),
        });
      }
      return out;
    } catch (e) { console.warn('loadExistingGristContacts:', e); return []; }
  }

  async function refreshContactsGristBox() {
    if (!contactsGristBoxEl) return;
    const entrepriseId = gristCandidates[gristIdx]?.id ?? null;
    if (!entrepriseId) {
      contactsGristBoxEl.innerHTML = '<div class="empty-col">Aucune entreprise GRIST sélectionnée.</div>';
      return;
    }
    const list = await loadExistingGristContacts(entrepriseId);
    renderGristContactsBox(contactsGristBoxEl, list);
  }

  function renderGristContactsBox(box, list) {
    if (!list.length) {
      box.innerHTML = '<div class="empty-col">Aucun contact existant pour cette entreprise.</div>';
      return;
    }
    box.innerHTML = list.map(c => `
      <div class="contact-grist-card">
        <strong>${esc(c.prenom)} ${esc(c.nom)}</strong><br>
        ${esc(c.courriel || '—')}${c.telephone ? ' · ' + esc(c.telephone) : ''}<br>
        ${c.legal ? 'Représentant légal' : ''}${c.legal && c.facturation ? ' · ' : ''}${c.facturation ? 'Facturation' : ''}${(c.legal || c.facturation) ? '<br>' : ''}
        Responsable : ${esc(c.programmeResponsable.join(', ') || '—')}<br>
        Examens : ${esc(c.programmeExamens.join(', ') || '—')}
      </div>`).join('');
  }

  function findExistingContactMatch(existing, c) {
    const emailNorm = (c.courriel || '').trim().toLowerCase();
    if (emailNorm) {
      const byEmail = existing.find(e => (e.courriel || '').trim().toLowerCase() === emailNorm);
      if (byEmail) return byEmail;
    }
    const nomNorm = (c.nom || '').trim().toLowerCase();
    const prenomNorm = (c.prenom || '').trim().toLowerCase();
    if (!nomNorm && !prenomNorm) return null;
    return existing.find(e => (e.nom || '').trim().toLowerCase() === nomNorm && (e.prenom || '').trim().toLowerCase() === prenomNorm) || null;
  }

  async function onCopyContactsClick() {
    const entrepriseId = gristCandidates[gristIdx]?.id ?? null;
    if (!entrepriseId) {
      showStatus('Aucune entreprise GRIST sélectionnée — impossible de lier les contacts.', 'error', 4000);
      return;
    }
    const toCopy = consolidatedContacts.filter(c => c.copyToGrist && (c.nom || c.prenom || c.courriel));
    if (!toCopy.length) {
      showStatus('Aucun contact coché à copier.', 'error', 3000);
      return;
    }

    await loadProgrammeIds();
    const existing = await loadExistingGristContacts(entrepriseId);

    const lines = toCopy.map(c => {
      const match = findExistingContactMatch(existing, c);
      const progResp = [...c.programmeResponsable].map(p => PROGRAMME_LABELS[p]).join(', ') || '—';
      const progExam = [...c.programmeExamens].map(p => PROGRAMME_LABELS[p]).join(', ') || '—';
      return `${match ? 'MAJ' : 'Création'} — ${c.prenom} ${c.nom} (${c.courriel || 'sans email'}) : représentant légal=${c.legal ? 'oui' : 'non'}, facturation=${c.facturation ? 'oui' : 'non'}, responsable=${progResp}, examens=${progExam}`;
    });
    const resume = [
      `Copier ${toCopy.length} contact(s) dans GRIST (remplace les programmes/rôles existants pour chacun) :`,
      ...lines,
    ].join('\n');
    if (!window.confirm(resume)) return;

    try {
      const actions = toCopy.map(c => {
        const match = findExistingContactMatch(existing, c);
        const fields = {
          Nom: c.nom,
          Prenom: c.prenom,
          Courriel: c.courriel,
          telephone: c.telephone,
          Entreprise: entrepriseId,
          Representant_legal: c.legal,
          Facturation: c.facturation,
          // RefList = CellValue Grist brut ['L', id1, id2, ...] (même tag que celui déjà
          // utilisé en lecture, cf. asList ci-dessus) : applyUserActions ne fait pas
          // l'encodage automatiquement comme le ferait une saisie dans la grille — un
          // tableau nu (sans tag, y compris vide) est mal décodé côté GRIST et produit
          // #KeyError / #IndexError dans la cellule.
          Programmes_Responsable: ['L', ...[...c.programmeResponsable].map(p => programmeIdByKey[p]).filter(Boolean)],
          Programmes_Examens: ['L', ...[...c.programmeExamens].map(p => programmeIdByKey[p]).filter(Boolean)],
        };
        return match ? ['UpdateRecord', 'Contacts', match.id, fields] : ['AddRecord', 'Contacts', null, fields];
      });
      await grist.docApi.applyUserActions(actions);
      await refreshContactsGristBox();
      showStatus(`${toCopy.length} contact(s) copié(s) dans GRIST.`, 'success', 4000);
    } catch (e) {
      console.warn('onCopyContactsClick:', e);
      showStatus(`Erreur à la copie des contacts : ${e.message}`, 'error');
    }
  }

  // ── A.2 — Sites : cadre TEM-404 (gauche) / cadre GRIST (droite) ──────────
  // Plus simple que les contacts : pas de consolidation (6 sites numérotés, pas de
  // doublons à fusionner). Le site 1 réutilise l'adresse du demandeur (cf. décision du
  // chantier précédent : "Site 1 - Siège" ne duplique pas de champs dédiés) ; les sites 2
  // à 6 ont leurs propres champs `f.site{n}.*`. Les champs sont les vrais champs du
  // schéma (via fieldById), rendus avec buildFieldInput : leur édition passe par la
  // délégation déjà en place sur #allFields (data-field), pas de câblage spécifique.

  const SITE_LABELS = { 1: 'Site 1 - Siège', 2: 'Site 2', 3: 'Site 3', 4: 'Site 4', 5: 'Site 5', 6: 'Site 6' };
  let siteCopyFlags = {};     // { 1: true, 2: false, ... } état des cases "à copier dans GRIST"
  let sitesGristBoxEl = null;

  function fieldById(id) {
    return (schema.fields.find(f => f.id === id)) || { id, label: id, type: 'text' };
  }

  function siteFieldIds(n) {
    if (n === 1) {
      return {
        nom: 'f.site1.nom', adresse: 'demandeur.adresse1', adresse2: 'demandeur.adresse2',
        codePostal: 'demandeur.code_postal', commune: 'demandeur.ville', pays: 'demandeur.pays',
      };
    }
    return {
      nom: `f.site${n}.nom`, adresse: `f.site${n}.adresse`, adresse2: `f.site${n}.adresse2`,
      codePostal: `f.site${n}.code_postal`, commune: `f.site${n}.commune`, pays: `f.site${n}.pays`,
    };
  }

  function buildSitesSection() {
    siteCopyFlags = {};

    const split = document.createElement('div');
    split.className = 'contacts-split';

    const left = document.createElement('div');
    left.className = 'contacts-pane';
    const leftTitle = document.createElement('h5');
    leftTitle.textContent = 'TEM-404';
    left.appendChild(leftTitle);
    const cardsBox = document.createElement('div');
    left.appendChild(cardsBox);
    // Site 1 - Siège est traité séparément dans le cadre "TEM-404" principal et dans le
    // cadre "GRIST" principal (cf. renderColumn1/renderGristColumn) : pas de doublon ici.
    for (let n = 2; n <= 6; n++) cardsBox.appendChild(buildSiteCard(n));
    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn btn-secondary';
    copyBtn.textContent = 'Copier les sites cochés dans GRIST';
    copyBtn.addEventListener('click', onCopySitesClick);
    left.appendChild(copyBtn);

    const right = document.createElement('div');
    right.className = 'contacts-pane';
    const rightTitle = document.createElement('h5');
    rightTitle.textContent = 'GRIST';
    right.appendChild(rightTitle);
    sitesGristBoxEl = document.createElement('div');
    sitesGristBoxEl.className = 'empty-col';
    sitesGristBoxEl.textContent = 'Chargement…';
    right.appendChild(sitesGristBoxEl);

    split.appendChild(left);
    split.appendChild(right);

    refreshSitesGristBox();

    return split;
  }

  function buildSiteCard(n) {
    const ids = siteFieldIds(n);
    const nom = pdfFields[ids.nom] || '';
    const adresse = pdfFields[ids.adresse] || '';
    const codePostal = pdfFields[ids.codePostal] || '';
    const commune = pdfFields[ids.commune] || '';
    const hasData = !!(nom || adresse || codePostal || commune);
    siteCopyFlags[n] = n === 1 || hasData;

    const card = document.createElement('div');
    card.className = 'contact-card';

    const header = document.createElement('div');
    header.className = 'contact-card-header';
    const title = document.createElement('strong');
    title.textContent = SITE_LABELS[n];
    const checkLabel = document.createElement('label');
    checkLabel.className = 'contact-checkbox-group';
    checkLabel.innerHTML = `<input type="checkbox" ${siteCopyFlags[n] ? 'checked' : ''}><span>À copier dans GRIST</span>`;
    checkLabel.querySelector('input').addEventListener('change', e => { siteCopyFlags[n] = e.target.checked; });
    header.appendChild(title);
    header.appendChild(checkLabel);
    card.appendChild(header);

    const row = document.createElement('div');
    row.className = 'contact-row';
    [ids.nom, ids.adresse, ids.adresse2, ids.codePostal, ids.commune, ids.pays].forEach(id => {
      row.appendChild(buildFieldInput(fieldById(id)));
    });
    card.appendChild(row);

    return card;
  }

  async function loadExistingGristSites(entrepriseId) {
    if (!entrepriseId) return [];
    try {
      const tbl = await grist.docApi.fetchTable('Sites');
      const out = [];
      for (let i = 0; i < tbl.id.length; i++) {
        if (tbl.Entreprise?.[i] !== entrepriseId) continue;
        out.push({
          id: tbl.id[i],
          nom: tbl.Nom_site?.[i] || '',
          adresse: tbl.Street?.[i] || '',
          adresse2: tbl.Street2?.[i] || '',
          codePostal: tbl.Zip?.[i] || '',
          commune: tbl.City?.[i] || '',
          pays: tbl.Pays?.[i] || '',
          siege: !!tbl.Siege?.[i],
        });
      }
      return out;
    } catch (e) { console.warn('loadExistingGristSites:', e); return []; }
  }

  function renderGristSitesBox(box, list) {
    if (!list.length) {
      box.innerHTML = '<div class="empty-col">Aucun site existant pour cette entreprise.</div>';
      return;
    }
    box.innerHTML = list.map(s => `
      <div class="contact-grist-card">
        <strong>${esc(s.nom || (s.siege ? 'Siège' : '—'))}</strong>${s.siege ? ' · Siège' : ''}<br>
        ${esc(s.adresse || '—')}${s.adresse2 ? ', ' + esc(s.adresse2) : ''}<br>
        ${esc(s.codePostal || '')} ${esc(s.commune || '')}<br>
        ${esc(s.pays || '')}
      </div>`).join('');
  }

  async function refreshSitesGristBox() {
    if (!sitesGristBoxEl) return;
    const entrepriseId = gristCandidates[gristIdx]?.id ?? null;
    if (!entrepriseId) {
      sitesGristBoxEl.innerHTML = '<div class="empty-col">Aucune entreprise GRIST sélectionnée.</div>';
      return;
    }
    const list = await loadExistingGristSites(entrepriseId);
    renderGristSitesBox(sitesGristBoxEl, list);
  }

  function findExistingSiteMatch(existing, { isSiege, nom }) {
    if (isSiege) {
      const bySiege = existing.find(s => s.siege);
      if (bySiege) return bySiege;
    }
    const nomNorm = (nom || '').trim().toLowerCase();
    if (!nomNorm) return null;
    return existing.find(s => (s.nom || '').trim().toLowerCase() === nomNorm) || null;
  }

  async function onCopySitesClick() {
    const entrepriseId = gristCandidates[gristIdx]?.id ?? null;
    if (!entrepriseId) {
      showStatus('Aucune entreprise GRIST sélectionnée — impossible de lier les sites.', 'error', 4000);
      return;
    }

    const toCopy = [];
    // Site 1 - Siège est copié séparément par les boutons "Créer un nouveau client" /
    // "Remplacer par les données TEM-404" / "... par les données annuaire" (upsertSiege) :
    // ne pas le recopier ici.
    for (let n = 2; n <= 6; n++) {
      if (!siteCopyFlags[n]) continue;
      const ids = siteFieldIds(n);
      const site = {
        n,
        isSiege: false,
        nom: pdfFields[ids.nom] || '',
        adresse: pdfFields[ids.adresse] || '',
        adresse2: pdfFields[ids.adresse2] || '',
        codePostal: pdfFields[ids.codePostal] || '',
        commune: pdfFields[ids.commune] || '',
        pays: pdfFields[ids.pays] || '',
      };
      if (!site.nom && !site.adresse && !site.codePostal && !site.commune) continue; // rien à copier
      toCopy.push(site);
    }
    if (!toCopy.length) {
      showStatus('Aucun site coché (avec des données) à copier.', 'error', 3000);
      return;
    }

    const existing = await loadExistingGristSites(entrepriseId);
    const lines = toCopy.map(s => {
      const match = findExistingSiteMatch(existing, s);
      return `${match ? 'MAJ' : 'Création'} — ${SITE_LABELS[s.n]} : ${s.nom || '—'} — ${s.adresse || '—'}, ${s.codePostal || '—'} ${s.commune || '—'}`;
    });
    const resume = [`Copier ${toCopy.length} site(s) dans GRIST :`, ...lines].join('\n');
    if (!window.confirm(resume)) return;

    try {
      const actions = toCopy.map(s => {
        const match = findExistingSiteMatch(existing, s);
        const fields = {
          Entreprise: entrepriseId,
          Nom_site: s.nom,
          Street: s.adresse,
          Street2: s.adresse2,
          Zip: s.codePostal,
          City: s.commune,
          Pays: s.pays,
          Siege: s.isSiege,
          Actif: true,
        };
        return match ? ['UpdateRecord', 'Sites', match.id, fields] : ['AddRecord', 'Sites', null, fields];
      });
      await grist.docApi.applyUserActions(actions);
      await refreshSitesGristBox();
      showStatus(`${toCopy.length} site(s) copié(s) dans GRIST.`, 'success', 4000);
    } catch (e) {
      console.warn('onCopySitesClick:', e);
      showStatus(`Erreur à la copie des sites : ${e.message}`, 'error');
    }
  }

  // ── F — Systèmes d'information : cadre TEM-404 (gauche) / cadre GRIST (droite) ──
  // Même principe que les sites : 3 SI numérotés (si.1 à si.3), pas de consolidation.

  const SI_COUNT = 3;
  let siCopyFlags = {};
  let siGristBoxEl = null;

  function siFieldIds(n) {
    return {
      nom: `si.${n}.nom`,
      classification: `si.${n}.classification`,
      dateHomologation: `si.${n}.date_homologation`,
      programmes: PROGRAMS.map(p => `si.${n}.programme_${p}`),
      sites: [1, 2, 3, 4, 5, 6].map(m => `si.${n}.site_${m}`),
    };
  }

  function buildSISection() {
    siCopyFlags = {};

    const split = document.createElement('div');
    split.className = 'contacts-split';

    const left = document.createElement('div');
    left.className = 'contacts-pane';
    const leftTitle = document.createElement('h5');
    leftTitle.textContent = 'TEM-404';
    left.appendChild(leftTitle);
    const cardsBox = document.createElement('div');
    left.appendChild(cardsBox);
    for (let n = 1; n <= SI_COUNT; n++) cardsBox.appendChild(buildSICard(n));
    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn btn-secondary';
    copyBtn.textContent = 'Copier les SI cochés dans GRIST';
    copyBtn.addEventListener('click', onCopySIClick);
    left.appendChild(copyBtn);

    const right = document.createElement('div');
    right.className = 'contacts-pane';
    const rightTitle = document.createElement('h5');
    rightTitle.textContent = 'GRIST';
    right.appendChild(rightTitle);
    siGristBoxEl = document.createElement('div');
    siGristBoxEl.className = 'empty-col';
    siGristBoxEl.textContent = 'Chargement…';
    right.appendChild(siGristBoxEl);

    split.appendChild(left);
    split.appendChild(right);

    refreshSIGristBox();

    return split;
  }

  function buildSICard(n) {
    const ids = siFieldIds(n);
    const nom = pdfFields[ids.nom] || '';
    const hasData = !!nom || PROGRAMS.some(p => pdfFields[`si.${n}.programme_${p}`]);
    siCopyFlags[n] = hasData;

    const card = document.createElement('div');
    card.className = 'contact-card';

    const header = document.createElement('div');
    header.className = 'contact-card-header';
    const title = document.createElement('strong');
    title.textContent = `SI n°${n}`;
    const checkLabel = document.createElement('label');
    checkLabel.className = 'contact-checkbox-group';
    checkLabel.innerHTML = `<input type="checkbox" ${siCopyFlags[n] ? 'checked' : ''}><span>À copier dans GRIST</span>`;
    checkLabel.querySelector('input').addEventListener('change', e => { siCopyFlags[n] = e.target.checked; });
    header.appendChild(title);
    header.appendChild(checkLabel);
    card.appendChild(header);

    const row1 = document.createElement('div');
    row1.className = 'contact-row';
    row1.appendChild(buildFieldInput(fieldById(ids.nom)));
    row1.appendChild(buildFieldInput(fieldById(ids.classification)));
    row1.appendChild(buildFieldInput(fieldById(ids.dateHomologation)));
    card.appendChild(row1);

    const row2 = document.createElement('div');
    row2.className = 'contact-row';
    const label2 = document.createElement('span');
    label2.className = 'contact-row-label';
    label2.textContent = 'Programmes';
    row2.appendChild(label2);
    ids.programmes.forEach(id => row2.appendChild(buildFieldInput(fieldById(id))));
    card.appendChild(row2);

    const row3 = document.createElement('div');
    row3.className = 'contact-row';
    const label3 = document.createElement('span');
    label3.className = 'contact-row-label';
    label3.textContent = 'Sites';
    row3.appendChild(label3);
    ids.sites.forEach(id => row3.appendChild(buildFieldInput(fieldById(id))));
    card.appendChild(row3);

    return card;
  }

  // Résout l'id GRIST d'un site TEM-404 (1 à 6) pour une liste de sites GRIST déjà
  // chargée (cf. findExistingSiteMatch) : réutilisé pour résoudre Systemes_Information.Sites.
  function siteGristIdForTem404Site(n, existingSites) {
    const ids = siteFieldIds(n);
    const nom = pdfFields[ids.nom] || (n === 1 ? 'Siège' : '');
    const match = findExistingSiteMatch(existingSites, { isSiege: n === 1, nom });
    return match ? match.id : null;
  }

  function findExistingSIMatch(existing, nom) {
    const nomNorm = (nom || '').trim().toLowerCase();
    if (!nomNorm) return null;
    return existing.find(s => (s.nom || '').trim().toLowerCase() === nomNorm) || null;
  }

  function parseFreeDateToTimestamp(value) {
    // si.N.date_homologation est un champ texte libre du PDF (pas de saisie contrainte) :
    // on réutilise le même parsing multi-format qu'ailleurs (ISO / JJ-MM-AAAA / timestamp).
    const iso = formatDateForInput(value);
    if (!iso) return null;
    return Math.floor(new Date(iso + 'T00:00:00Z').getTime() / 1000);
  }

  async function loadExistingGristSI(entrepriseId) {
    if (!entrepriseId) return [];
    try {
      await loadProgrammeIds();
      const idToLabel = {};
      for (const [key, id] of Object.entries(programmeIdByKey)) idToLabel[id] = PROGRAMME_LABELS[key];
      const tbl = await grist.docApi.fetchTable('Systemes_Information');
      const sitesTbl = await grist.docApi.fetchTable('Sites');
      const siteNameById = {};
      for (let i = 0; i < sitesTbl.id.length; i++) {
        siteNameById[sitesTbl.id[i]] = sitesTbl.Nom_site?.[i] || (sitesTbl.Siege?.[i] ? 'Siège' : '');
      }
      const asList = raw => Array.isArray(raw) ? raw.slice(1) : []; // RefList Grist : ['L', id1, id2…]
      const out = [];
      for (let i = 0; i < tbl.id.length; i++) {
        if (tbl.Entreprise?.[i] !== entrepriseId) continue;
        out.push({
          id: tbl.id[i],
          nom: tbl.Nom?.[i] || '',
          classification: tbl.Classification?.[i] || '',
          dateHomologation: tbl.Date_Homologation?.[i] ?? null,
          programmes: asList(tbl.Programmes?.[i]).map(id => idToLabel[id]).filter(Boolean),
          sites: asList(tbl.Sites?.[i]).map(id => siteNameById[id]).filter(Boolean),
        });
      }
      return out;
    } catch (e) { console.warn('loadExistingGristSI:', e); return []; }
  }

  function renderGristSIBox(box, list) {
    if (!list.length) {
      box.innerHTML = '<div class="empty-col">Aucun SI existant pour cette entreprise.</div>';
      return;
    }
    box.innerHTML = list.map(s => `
      <div class="contact-grist-card">
        <strong>${esc(s.nom || '—')}</strong> · ${esc(s.classification || '—')}<br>
        Homologation : ${esc(formatDateForInput(s.dateHomologation) || '—')}<br>
        Programmes : ${esc(s.programmes.join(', ') || '—')}<br>
        Sites : ${esc(s.sites.join(', ') || '—')}
      </div>`).join('');
  }

  async function refreshSIGristBox() {
    if (!siGristBoxEl) return;
    const entrepriseId = gristCandidates[gristIdx]?.id ?? null;
    if (!entrepriseId) {
      siGristBoxEl.innerHTML = '<div class="empty-col">Aucune entreprise GRIST sélectionnée.</div>';
      return;
    }
    const list = await loadExistingGristSI(entrepriseId);
    renderGristSIBox(siGristBoxEl, list);
  }

  async function onCopySIClick() {
    const entrepriseId = gristCandidates[gristIdx]?.id ?? null;
    if (!entrepriseId) {
      showStatus('Aucune entreprise GRIST sélectionnée — impossible de lier les SI.', 'error', 4000);
      return;
    }

    const toCopy = [];
    for (let n = 1; n <= SI_COUNT; n++) {
      if (!siCopyFlags[n]) continue;
      const ids = siFieldIds(n);
      const nom = pdfFields[ids.nom] || '';
      if (!nom) continue; // rien à copier sans nom de SI
      toCopy.push({
        n, nom,
        classification: pdfFields[ids.classification] || '',
        dateHomologation: pdfFields[ids.dateHomologation] || '',
        programmes: PROGRAMS.filter(p => pdfFields[`si.${n}.programme_${p}`]),
        sites: [1, 2, 3, 4, 5, 6].filter(m => pdfFields[`si.${n}.site_${m}`]),
      });
    }
    if (!toCopy.length) {
      showStatus('Aucun SI coché (avec un nom) à copier.', 'error', 3000);
      return;
    }

    await loadProgrammeIds();
    const existingSI = await loadExistingGristSI(entrepriseId);
    const existingSites = await loadExistingGristSites(entrepriseId);

    const lines = toCopy.map(s => {
      const match = findExistingSIMatch(existingSI, s.nom);
      const progLabels = s.programmes.map(p => PROGRAMME_LABELS[p]).join(', ') || '—';
      const siteLabels = s.sites.map(m => SITE_LABELS[m]).join(', ') || '—';
      return `${match ? 'MAJ' : 'Création'} — SI "${s.nom}" (${s.classification || 'classification —'}) : programmes=${progLabels}, sites=${siteLabels}`;
    });
    const resume = [`Copier ${toCopy.length} SI dans GRIST :`, ...lines].join('\n');
    if (!window.confirm(resume)) return;

    try {
      const actions = toCopy.map(s => {
        const match = findExistingSIMatch(existingSI, s.nom);
        const siteIds = s.sites.map(m => siteGristIdForTem404Site(m, existingSites)).filter(Boolean);
        const programmeIds = s.programmes.map(p => programmeIdByKey[p]).filter(Boolean);
        const fields = {
          Entreprise: entrepriseId,
          Nom: s.nom,
          Classification: s.classification,
          Date_Homologation: parseFreeDateToTimestamp(s.dateHomologation),
          Programmes: ['L', ...programmeIds],
          Sites: ['L', ...siteIds],
        };
        return match ? ['UpdateRecord', 'Systemes_Information', match.id, fields] : ['AddRecord', 'Systemes_Information', null, fields];
      });
      await grist.docApi.applyUserActions(actions);
      await refreshSIGristBox();
      showStatus(`${toCopy.length} SI copié(s) dans GRIST.`, 'success', 4000);
    } catch (e) {
      console.warn('onCopySIClick:', e);
      showStatus(`Erreur à la copie des SI : ${e.message}`, 'error');
    }
  }

  // Champs à afficher pleine largeur dans la grille générique (au lieu de la largeur
  // standard d'un champ) : les grandes zones de texte libre du formulaire. `f.lines`
  // (déjà présent dans le schéma pour d.presentation) pilote en plus le passage en
  // vraie zone de texte multiligne.
  const WIDE_FIELD_IDS = new Set(['c5.perimetre_pdis', 'c5.perimetre_pams', 'd.presentation']);

  function buildFieldInput(f) {
    const wrap = document.createElement('label');
    wrap.className = 'field-item';
    const value = pdfFields[f.id];
    const isWide = WIDE_FIELD_IDS.has(f.id) || (f.lines && f.lines > 1);
    if (isWide) wrap.classList.add('field-item-wide');
    let input;
    if (f.type === 'checkbox') {
      input = `<input type="checkbox" data-field="${esc(f.id)}" ${value ? 'checked' : ''}>`;
    } else if (f.type === 'choice' || f.type === 'radio') {
      const opts = (f.options || []).map(o => `<option value="${esc(o)}" ${o === value ? 'selected' : ''}>${esc(o)}</option>`).join('');
      input = `<select data-field="${esc(f.id)}">${opts}</select>`;
    } else if (f.lines && f.lines > 1) {
      input = `<textarea data-field="${esc(f.id)}" rows="${f.lines}"${f.maxlen ? ` maxlength="${f.maxlen}"` : ''}>${esc(value ?? '')}</textarea>`;
    } else {
      input = `<input type="text" data-field="${esc(f.id)}" value="${esc(value ?? '')}"${f.maxlen ? ` maxlength="${f.maxlen}"` : ''}>`;
    }
    wrap.innerHTML = `<span>${esc(f.label || f.id)}</span>${input}`;
    return wrap;
  }

  // Délégation : toute saisie dans col1Fields ou allFields met à jour pdfFields
  for (const containerId of ['col1Fields', 'allFields']) {
    document.getElementById(containerId).addEventListener('input', onFieldInput);
    document.getElementById(containerId).addEventListener('change', onFieldInput);
  }
  function onFieldInput(e) {
    const id = e.target.dataset.field;
    if (!id) return;
    pdfFields[id] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  }

  document.getElementById('numTem404').addEventListener('input', e => { numTem404 = e.target.value; });
  document.getElementById('dateReception').addEventListener('input', e => { dateReception = e.target.value; });

  // ── Enregistrement (confirmation native avant écriture) ──────────────────
  // window.confirm() plutôt qu'un panneau maison : toujours visible (modal
  // bloquant), ne dépend pas du défilement de la page ni d'un styling CSS.

  document.getElementById('btnSave').addEventListener('click', async () => {
    if (!schema) {
      showStatus('Aucune donnée à enregistrer — déposez un PDF ou sélectionnez une ligne.', 'error', 4000);
      return;
    }
    const action = currentRecordId
      ? `Mettre à jour le dossier existant (id ${currentRecordId})`
      : 'Créer un nouveau dossier';
    const lien = gristCandidates[gristIdx]
      ? `${gristCandidates[gristIdx].nom} (id ${gristCandidates[gristIdx].id})`
      : 'aucun — non lié';
    const resume = [
      action,
      `N° : ${numTem404 || '—'}`,
      `Réception : ${dateReception || '—'}`,
      `Version : ${schema.schema_version || '—'}`,
      `Entreprise : ${pdfFields['demandeur.nom'] || '—'} — SIREN ${pdfFields['demandeur.siren'] || '—'} — SIRET ${pdfFields['demandeur.siret'] || '—'}`,
      `Lien GRIST : ${lien}`,
    ].join('\n');

    if (!window.confirm(`Confirmer l'enregistrement ?\n\n${resume}`)) return;
    await doSave();
  });

  async function doSave() {
    const jsonComplet = {};
    const jsonUtile = {};
    schema.fields.forEach(f => {
      jsonComplet[f.id] = pdfFields[f.id];
      if (!f.grist_table) jsonUtile[f.id] = pdfFields[f.id];
    });

    const fields = {
      NumTEM404: numTem404,
      Date_Reception: dateReception ? Math.floor(new Date(dateReception + 'T00:00:00Z').getTime() / 1000) : null,
      Version: String(schema.schema_version || ''),
      Entreprise: gristCandidates[gristIdx]?.id ?? null, // lien de confort, n'écrit pas dans Entreprises
      Json_Complet: JSON.stringify(jsonComplet),
      Json_Utile: JSON.stringify(jsonUtile),
    };

    try {
      if (currentRecordId) {
        await grist.docApi.applyUserActions([['UpdateRecord', 'TEM_404', currentRecordId, fields]]);
        showStatus('Dossier mis à jour.', 'success', 4000);
      } else {
        const res = await grist.docApi.applyUserActions([['AddRecord', 'TEM_404', null, fields]]);
        currentRecordId = res?.retValues?.[0] ?? currentRecordId;
        showStatus('Dossier enregistré.', 'success', 4000);
      }
    } catch (e) {
      console.warn('doSave:', e);
      showStatus(`Erreur à l'enregistrement : ${e.message}`, 'error');
    }
  }

  // ── Helpers ──────────────────────────────────────────────────────────────

  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function showStatus(msg, type = '', duration = 0) {
    const bar = document.getElementById('statusbar');
    bar.textContent = msg;
    bar.className = `statusbar ${type}`;
    if (duration) setTimeout(() => { bar.textContent = ''; bar.className = 'statusbar'; }, duration);
  }
</script>
