<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planning des évaluations</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Toolbar ─────────────────────────────────────────────────────── */
    .toolbar {
      background: #1e3a8a;
      color: #fff;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .toolbar h1 { font-size: 14px; font-weight: 600; flex: 1; }
    .btn-nav {
      background: rgba(255,255,255,.18);
      border: none;
      color: #fff;
      width: 26px; height: 26px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .btn-nav:hover { background: rgba(255,255,255,.3); }
    #period-label {
      font-weight: 700;
      font-size: 13px;
      min-width: 90px;
      text-align: center;
    }
    .toolbar select {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.3);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .toolbar select option { background: #1e3a8a; }

    /* ── Table wrapper ───────────────────────────────────────────────── */
    .table-wrapper {
      flex: 1;
      overflow: auto;
      position: relative;
    }

    /* ── Planning table ──────────────────────────────────────────────── */
    #planning-table {
      border-collapse: collapse;
      table-layout: fixed;
    }

    /* Sticky header — row 1: evaluator names */
    #planning-table thead tr:nth-child(1) th {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 28px;
      background: #1e3a8a;
      color: #fff;
      padding: 2px 5px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid #1d4ed8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Sticky header — row 2: mois courant (même style que bandeau mois) */
    #planning-table thead tr:nth-child(2) th {
      position: sticky;
      top: 28px;
      z-index: 20;
      height: 18px;
      background: #1e40af;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-align: left;
      padding: 1px 10px;
      border: 1px solid #1d4ed8;
      white-space: nowrap;
    }
    /* Corner cell (sticky top + left) */
    #planning-table thead th.corner {
      left: 0;
      z-index: 30 !important;
      background: #1e3a8a !important;
      width: 62px;
      min-width: 62px;
      max-width: 62px;
    }

    /* Separator between CT and external groups */
    .sep-left { border-left: 3px solid #60a5fa !important; }

    /* ── Month header rows ───────────────────────────────────────────── */
    .row-month td {
      background: #1e40af;
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: .06em;
      height: 18px;
      padding: 1px 10px;
      border-top: 2px solid #1e3a8a;
    }
    /* Cellule date du bandeau mois : même style que le coin de l'en-tête */
    .row-month td.day-label {
      background: #1e3a8a;
      border-right-color: #1e3a8a;
      color: transparent; /* vide */
    }

    /* ── Week header rows ────────────────────────────────────────────── */
    .row-week td {
      background: #dbeafe;
      color: #1e40af;
      font-weight: 600;
      font-size: 11px;
      padding: 2px 8px;
      border-top: 1px solid #93c5fd;
    }

    /* ── Day rows ────────────────────────────────────────────────────── */
    /* Ratio 6:1 pour loger jusqu'à 6 monocles d'oraux sur une ligne */
    .row-day td {
      border: 1px solid #e5e7eb;
      height: 20px;
      width: 120px;
      min-width: 120px;
      max-width: 120px;
      vertical-align: middle;
      padding: 0;
      overflow: hidden;
    }

    /* Day label — sticky left */
    td.day-label {
      position: sticky;
      left: 0;
      z-index: 10;
      width: 62px;
      min-width: 62px;
      max-width: 62px;
      padding: 0 6px;
      text-align: right;
      font-size: 11px;
      font-weight: 500;
      border-right: 2px solid #d1d5db;
      white-space: nowrap;
      background: #fff;
    }

    /* Weekday: blanc */
    .row-day td                                                { background: #fff; }
    .row-day:not(.row-weekend):not(.row-holiday) td.day-label { background: #fff; }

    /* Weekend: gris-bleu */
    .row-weekend td           { background: #e8eef7; }
    .row-weekend td.day-label { background: #e8eef7; color: #64748b; }

    /* Jour férié: jaune pâle */
    .row-holiday td           { background: #fef9c3; }
    .row-holiday td.day-label { background: #fef9c3; color: #854d0e; font-weight: 700; }

    /* Aujourd'hui */
    .row-today td:not(.day-label) { background: #eff6ff !important; }
    .row-today td.day-label {
      background: #1e40af !important;
      color: #fff !important;
      font-weight: 700 !important;
      border-right-color: #1e40af;
    }

    /* ── Lot cell content ────────────────────────────────────────────── */
    .lot-cell {
      display: flex;
      align-items: center;
      padding: 0 4px;
      height: 100%;
      overflow: hidden;
      cursor: default;
      border-left: 3px solid transparent;
      min-width: 0;
    }
    /* Demi-journée : occupe exactement 50 % de la case */
    .lot-cell-half {
      flex: 0 0 50%;
    }
    .lot-client {
      font-size: 9px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #1f2937;
    }
    .cell-row { display: flex; height: 100%; width: 100%; min-width: 0; }
    .cell-row > .lot-cell, .lot-wrap { flex: 1 1 auto; min-width: 0; }
    .lot-wrap { display: flex; height: 100%; }
    .oral-badge {
      flex: 0 0 auto;
      display: flex; align-items: center;
      padding: 0 2px;
      font-size: 11px;
      line-height: 1;
      letter-spacing: -1px;
      white-space: nowrap;
      cursor: default;
    }

    /* Observateur : texte gris sur hachures jaune pâle / gris clair */
    .lot-obs {
      background: repeating-linear-gradient(45deg, #fef9c3 0 4px, #e5e7eb 4px 8px);
    }
    .lot-obs .lot-client { color: #6b7280; font-style: italic; }
    .week-num {
      font-size: 9px;
      font-weight: 700;
      color: #64748b;
      margin-right: 2px;
    }

    /* ── Légende toolbar ─────────────────────────────────────────────── */
    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .legend-dot {
      width: 11px;
      height: 11px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* ── Status bar ──────────────────────────────────────────────────── */
    .statusbar {
      padding: 5px 14px;
      font-size: 11px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      color: #6b7280;
      flex-shrink: 0;
      min-height: 28px;
    }
    .statusbar.error { background: #fef2f2; color: #991b1b; }

    /* ── Placeholder ─────────────────────────────────────────────────── */
    .placeholder {
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: #9ca3af; font-size: 14px;
      flex-direction: column; gap: 8px;
    }
    .placeholder small { font-size: 12px; color: #d1d5db; }

    /* ── Édition ─────────────────────────────────────────────────────── */
    #planning-table { user-select: none; }
    td.cell-edit { cursor: cell; }
    /* outline et non box-shadow : le contenu de la case recouvrirait une ombre interne */
    td.cell-sel  { outline: 2px solid #2563eb; outline-offset: -2px; }
    td.drop      { outline: 2px solid #16a34a; outline-offset: -2px; }
    .lot-cell[draggable="true"] { cursor: grab; }
    .lot-cell.slot-sel { box-shadow: inset 0 0 0 1px #2563eb; }

    .pop {
      position: fixed; z-index: 50; width: 340px;
      display: none; flex-direction: column;
      background: #fff; border: 1px solid #cbd5e1; border-radius: 6px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .18);
    }
    .pop.on { display: flex; }
    .pop button, .pop select, .pop input { font: inherit; }
    .pop select, .pop input { border: 1px solid #cbd5e1; border-radius: 4px; padding: 3px 5px; background: #fff; width: 100%; }
    .pop button { border: 1px solid #cbd5e1; background: #fff; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
    .pop button:hover { background: #eef2ff; }
    .pop button:disabled { opacity: .4; cursor: default; }
    .pop button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    .pop button.danger { color: #b91c1c; }
    .pop-hd { padding: 6px 8px; font-weight: 600; color: #1e3a8a; border-bottom: 1px solid #e2e8f0; }
    .pop-bd { padding: 6px 8px; display: flex; flex-direction: column; gap: 6px; }
    .pop-row { display: flex; gap: 6px; }
    .pop-opts { max-height: 220px; overflow: auto; border: 1px solid #e2e8f0; border-radius: 4px; }
    .pop-opts .opt { padding: 4px 6px; cursor: pointer; border-left: 4px solid transparent; }
    .pop-opts .opt.on, .pop-opts .opt:hover { background: #e0e7ff; }
    .pop-opts .opt small { color: #64748b; display: block; }
    .pop-err { color: #b91c1c; font-size: 11px; min-height: 14px; }
    .pop-ft { padding: 6px 8px; display: flex; gap: 6px; border-top: 1px solid #e2e8f0; }
  </style>
</head>
<body>

<div class="toolbar">
  <button class="btn-nav" onclick="navigate(-1)" title="Période précédente">&#8249;</button>
  <span id="period-label"></span>
  <button class="btn-nav" onclick="navigate(1)"  title="Période suivante">&#8250;</button>
  <select id="view-mode" onchange="setViewMode(this.value)">
    <option value="year">Année</option>
    <option value="quarter">Trimestre</option>
    <option value="month">Mois</option>
  </select>
  <div class="legend">
    <span class="legend-item"><span class="legend-dot" style="background:#2563EB"></span>PASSI</span>
    <span class="legend-item"><span class="legend-dot" style="background:#059669"></span>PACS</span>
    <span class="legend-item"><span class="legend-dot" style="background:#D97706"></span>PRIS</span>
    <span class="legend-item"><span class="legend-dot" style="background:#7C3AED"></span>PDIS</span>
    <span class="legend-item"><span class="legend-dot" style="background:#DC2626"></span>PAMS</span>
    <span class="legend-item"><span class="legend-dot" style="background:#0891B2"></span>SecNumCloud</span>
  </div>
</div>

<div class="table-wrapper" id="table-wrapper">
  <div class="placeholder" id="placeholder">
    <span>Chargement des données…</span>
    <small>Configurez le widget en liant la table Unites_d_oeuvre</small>
  </div>
</div>

<div class="statusbar" id="statusbar"></div>

<div class="pop" id="pop">
  <div class="pop-hd" id="pop-hd">Modifier</div>
  <div class="pop-bd">
    <input id="pop-q" type="search" placeholder="Rechercher une évaluation (tetra, client, libellé)…" autocomplete="off">
    <div class="pop-opts" id="pop-opts"></div>
    <select id="pop-type" title="Unité d'œuvre"></select>
    <div class="pop-row">
      <select id="pop-role" title="Rôle de l'évaluateur"></select>
      <select id="pop-duree" title="Durée sur ce jour"></select>
    </div>
    <div class="pop-err" id="pop-err"></div>
  </div>
  <div class="pop-ft">
    <button class="danger" id="pop-clear" title="Retirer ce jour pour cet évaluateur">Effacer</button>
    <span style="flex:1"></span>
    <button id="pop-cancel">Annuler</button>
    <button class="primary" id="pop-ok">Valider</button>
  </div>
</div>

<script>
// ── Programme colour palette ───────────────────────────────────────────────

const PROG_COLORS = {
  PASSI:       '#2563EB',
  PACS:        '#059669',
  PRIS:        '#D97706',
  PDIS:        '#7C3AED',
  PAMS:        '#DC2626',
  SECNUMCLOUD: '#0891B2',
  DEFAULT:     '#6B7280',
};

const MONTHS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin',
                   'Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DAYS_FR   = ['Di','Lu','Ma','Me','Je','Ve','Sa'];

// ── Navigation state ───────────────────────────────────────────────────────

let viewMode    = 'year';
let viewYear    = new Date().getFullYear();
let viewQuarter = Math.floor(new Date().getMonth() / 3);
let viewMonth   = new Date().getMonth();

// ── Data state ─────────────────────────────────────────────────────────────

let lots        = [];   // parsed lots
let evaluateurs = [];   // from docApi.fetchTable
let mappings    = {};   // column mapping from grist.onOptions
let planMap     = new Map(); // evalId → Map(dateStr → [slot])
let evalInfo    = new Map(); // Evaluations.id → { tetra, client, prog, libelle, statut, RE, ETA, ETM, OBS }
let uoChoices   = [];        // choix de la colonne Unites_d_oeuvre.Unite_d_oeuvre

const T_UO = 'Unites_d_oeuvre';

function readChoices(gTables, gCols, tableId, colId) {
  if (!gTables?.id || !gCols?.id) return [];
  const tIdx = gTables.tableId.indexOf(tableId);
  if (tIdx < 0) return [];
  const tRef = gTables.id[tIdx];
  const cIdx = gCols.id.findIndex((_, i) => gCols.parentId[i] === tRef && gCols.colId[i] === colId);
  if (cIdx < 0) return [];
  try { return JSON.parse(gCols.widgetOptions[cIdx] || '{}').choices || []; } catch { return []; }
}

// ── Grist wiring ───────────────────────────────────────────────────────────

grist.ready({
  requiredAccess: 'full',
  columns: [
    { name: 'Denomination',     title: 'Lot — Dénomination',          type: 'Text'           },
    { name: 'Programme',        title: 'Lot — Programme',              type: 'Text'           },
    { name: 'Evaluateurs_col',  title: 'Lot — Évaluateur(s)',          type: 'RefList,Ref,Int'},
    { name: 'DateDebut',        title: 'Lot — Date de début',          type: 'Date'           },
    { name: 'Jours',            title: 'Lot — Nombre de jours (J/H)',  type: 'Numeric,Int'    },
    { name: 'PlanEval',         title: "Lot — Plan d'évaluation",      type: 'Choice,Text'    },
  ],
});

grist.onOptions((_opts, interaction) => {
  mappings = interaction?.columns ?? {};
});

let _debugFirstRecord = null;

grist.onRecords(async records => {
  _debugFirstRecord = records[0] ?? null;
  lots = records.map(parseLot);
  await Promise.all([loadEvaluateurs(), loadRefs()]);
  buildPlanMap();
  render();
});

// ── Parsing helpers ────────────────────────────────────────────────────────

function getField(record, widgetName) {
  const mapped = mappings[widgetName];
  if (mapped !== undefined && record[mapped] !== undefined) return record[mapped];
  // Fallback: try the Grist column name directly
  const FALLBACK = {
    Denomination:    'Denomination',
    Programme:       'Programme',
    Evaluateurs_col: 'evaluateurs',
    DateDebut:       'date_debut_incluse',
    Jours:           'Jours',
    PlanEval:        'Unite_d_oeuvre',
  };
  return record[FALLBACK[widgetName]];
}

function parseLot(r) {
  const denomination = String(getField(r, 'Denomination') ?? '');
  const programme    = String(getField(r, 'Programme')    ?? '');
  const jours        = Number(getField(r, 'Jours') ?? 0);
  const dateRaw      = getField(r, 'DateDebut');

  // Date: Grist sends Date columns as Unix seconds (number)
  let dateDebut = null;
  if (dateRaw) {
    const ts = typeof dateRaw === 'number' ? dateRaw * 1000 : new Date(dateRaw).getTime();
    const d  = new Date(ts);
    dateDebut = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  }

  const evalRaw   = getField(r, 'Evaluateurs_col') ?? r.evaluateurs;
  const evalIds   = parseRawEvalIds(evalRaw);    // cas : Grist envoie les IDs bruts
  const evalNames = parseRawEvalNames(evalRaw);  // cas : Grist envoie les noms affichés

  const planEval = String(getField(r, 'PlanEval') ?? r.Unite_d_oeuvre ?? '');

  // Evaluation et OBS ne sont pas mappés : onRecords peut ne pas les fournir,
  // loadRefs() les relit depuis Unites_d_oeuvre via docApi.
  const evaluationId = typeof r.Evaluation === 'number' ? r.Evaluation : 0;
  const obsIds       = parseRawEvalIds(r.OBS);

  return { id: r.id, denomination, programme, evalIds, evalNames, dateDebut, jours, planEval,
           evaluationId, obsIds, tetra: '' };
}

// Le tetra est dans Entreprises.code (libellé « tetra » dans Grist)
async function loadRefs() {
  try {
    const [uos, evals, ents, progs, gTables, gCols] = await Promise.all([
      grist.docApi.fetchTable(T_UO),
      grist.docApi.fetchTable('Evaluations'),
      grist.docApi.fetchTable('Entreprises'),
      grist.docApi.fetchTable('Programmes').catch(() => ({ id: [] })),
      grist.docApi.fetchTable('_grist_Tables').catch(() => null),
      grist.docApi.fetchTable('_grist_Tables_column').catch(() => null),
    ]);
    // Copie brute de chaque UO : c'est la source de vérité pour toutes les écritures
    const uoById = new Map(uos.id.map((id, i) => [id, {
      evaluation: uos.Evaluation?.[i] || 0,
      type:       uos.Unite_d_oeuvre?.[i] || '',
      RE:         uos.RE?.[i] || 0,
      ETA:        parseRawEvalIds(uos.ETA?.[i]),
      ETM:        parseRawEvalIds(uos.ETM?.[i]),
      OBS:        parseRawEvalIds(uos.OBS?.[i]),
      extra:      { PO_ref: uos.PO_ref?.[i] ?? '', Lot: uos.Lot?.[i] ?? 0, Facture: uos.Facture?.[i] ?? false },
    }]));
    const entById = new Map(ents.id.map((id, i) => [id, {
      tetra: String(ents.code?.[i] ?? '').trim(),
      nom:   String(ents.Denomination?.[i] ?? ''),
    }]));
    const tetraByEnt = new Map([...entById].map(([id, e]) => [id, e.tetra]));
    const progById = new Map(progs.id.map((id, i) => [id, String(progs.Nom_du_programme?.[i] ?? '')]));
    evalInfo = new Map(evals.id.map((id, i) => {
      const ent = entById.get(evals.Entreprise?.[i]);
      return [id, {
        id,
        tetra:    ent?.tetra || '',
        client:   ent?.nom || '',
        prog:     progById.get(evals.Programme?.[i]) || '',
        libelle:  String(evals.Libelle?.[i] ?? '') || `Évaluation ${id}`,
        statut:   String(evals.Statut?.[i] ?? ''),
        terminee: Boolean(evals.Terminee?.[i]),
        RE:       evals.RE?.[i] || 0,
        ETA:      parseRawEvalIds(evals.ETA?.[i]),
        ETM:      parseRawEvalIds(evals.ETM?.[i]),
        OBS:      parseRawEvalIds(evals.OBS?.[i]),
      }];
    }));
    uoChoices = readChoices(gTables, gCols, T_UO, 'Unite_d_oeuvre');
    lots.forEach(lot => {
      const uo = uoById.get(lot.id);
      if (uo) {
        lot.uo = uo;
        lot.evaluationId = uo.evaluation || lot.evaluationId;
        if (uo.OBS.length) lot.obsIds = uo.OBS;
      }
      lot.tetra = evalInfo.get(lot.evaluationId)?.tetra ?? '';
    });
    if (!uoChoices.length) uoChoices = [...new Set(lots.map(l => l.planEval).filter(Boolean))].sort();
    await loadOraux(tetraByEnt);
  } catch (e) {
    showStatus('Tables Evaluations/Entreprises inaccessibles (' + e.message + ')', 'error');
  }
}

// evalId → Map(dateStr → [{ heure, tetra }]) ; un examinateur 1 et 2 du même oral ne compte qu'une fois
let oralMap = new Map();

async function loadOraux(tetraByEnt) {
  oralMap = new Map();
  try {
    const t = await grist.docApi.fetchTable('Examens_oraux');
    const hhmm = new Intl.DateTimeFormat('fr-FR', { timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit' });
    t.id.forEach((_, i) => {
      // date_seule (Date) = minuit UTC ; date_heure (DateTime Europe/Paris) sert à l'heure
      const ts = t.date_seule?.[i];
      if (typeof ts !== 'number') return;
      const ds = toDateStr(new Date(ts * 1000));
      const dh = t.date_heure?.[i];
      const oral = {
        heure: typeof dh === 'number' ? hhmm.format(new Date(dh * 1000)) : '',
        tetra: tetraByEnt.get(t.Denomination?.[i]) ?? '',
      };
      new Set([t.Examinateur_1?.[i], t.Examinateur_2?.[i]]).forEach(eid => {
        if (!(eid > 0)) return;
        if (!oralMap.has(eid)) oralMap.set(eid, new Map());
        const em = oralMap.get(eid);
        if (!em.has(ds)) em.set(ds, []);
        em.get(ds).push(oral);
      });
    });
    oralMap.forEach(em => em.forEach(list => list.sort((a, b) => a.heure.localeCompare(b.heure))));
  } catch (e) {
    showStatus('Table Examens_oraux inaccessible (' + e.message + ')', 'error');
  }
}

// Extrait les IDs numériques d'une valeur RefList Grist
function parseRawEvalIds(raw) {
  if (raw == null) return [];
  if (Array.isArray(raw)) {
    const arr = raw[0] === 'L' ? raw.slice(1) : raw;
    return arr.map(Number).filter(n => n > 0);
  }
  if (typeof raw === 'string' && raw.includes('[')) {
    try { return parseRawEvalIds(JSON.parse(raw)); } catch {}
  }
  const n = Number(raw);
  return n > 0 ? [n] : [];
}

// Extrait les noms/trigrammes d'une valeur RefList dont Grist renvoie la colonne visible
function parseRawEvalNames(raw) {
  if (raw == null) return [];
  if (Array.isArray(raw)) {
    return raw.filter(v => typeof v === 'string' && v !== 'L' && v.trim()).map(v => v.trim());
  }
  if (typeof raw === 'string') {
    if (raw.startsWith('[')) {
      try { return parseRawEvalNames(JSON.parse(raw)); } catch {}
    }
    if (raw.trim()) return [raw.trim()];
  }
  return [];
}

async function loadEvaluateurs() {
  try {
    const tbl = await grist.docApi.fetchTable('Evaluateurs');
    if (!tbl?.id?.length) {
      evaluateurs = [];
      fallbackEvaluateursFromLots();
      return;
    }
    const hasPlanningCol = Array.isArray(tbl.planning);
    evaluateurs = tbl.id.map((id, i) => ({
      id,
      nom:       tbl.Evaluateur_Nom?.[i]       ?? '',
      prenom:    tbl.Evaluateur_Prenom?.[i]    ?? '',
      trigramme: tbl.Evaluateur_Trigramme?.[i] ?? '',
      employeur: tbl.Employeur?.[i]            ?? '',
      planning:  hasPlanningCol ? Boolean(tbl.planning[i]) : true,
    })).filter(e => (e.nom || e.prenom || e.trigramme) && e.planning);
  } catch (e) {
    // fetchTable peut échouer si la table n'existe pas ou est inaccessible
    evaluateurs = [];
    fallbackEvaluateursFromLots();
    showStatus('Table Evaluateurs inaccessible (' + e.message + ') — affichage par ID', 'error');
  }
}

// Fallback : construit des évaluateurs minimaux depuis les noms trouvés dans les lots
function fallbackEvaluateursFromLots() {
  const names = new Set(lots.flatMap(l => l.evalNames));
  evaluateurs = [...names].sort().map((name, i) => ({
    id: -(i + 1), // IDs négatifs fictifs pour ne pas collisionner
    nom: name,
    prenom: '',
    trigramme: name.slice(0, 3).toUpperCase(),
    employeur: '',
    planning: true,
  }));
}

// ── Planning map ───────────────────────────────────────────────────────────

// Map nom/trigramme → id, construite après chargement des évaluateurs
let nameToEvalId = new Map();

function buildNameToIdMap() {
  nameToEvalId.clear();
  evaluateurs.forEach(ev => {
    const add = k => k && nameToEvalId.set(k.toLowerCase().trim(), ev.id);
    add(ev.trigramme);
    add(ev.nom);
    add(ev.prenom);
    add(`${ev.prenom} ${ev.nom}`.trim());
    add(`${ev.nom} ${ev.prenom}`.trim());
  });
}

function resolveEvalIds(lot) {
  if (lot.evalIds.length > 0) return lot.evalIds;  // IDs bruts disponibles
  // Résolution par nom/trigramme
  return lot.evalNames
    .map(name => nameToEvalId.get(name.toLowerCase().trim()))
    .filter(id => id != null);
}

// Unites_d_oeuvre.OBS est pré-rempli depuis Evaluations.OBS par planification-uo,
// puis éditable par UO : c'est donc lui qui fait foi.
function resolveObsIds(lot) {
  const evalSet = new Set(resolveEvalIds(lot));
  return lot.obsIds.filter(id => !evalSet.has(id));
}

function buildPlanMap() {
  buildNameToIdMap();
  planMap.clear();
  // Évaluateurs d'abord : une affectation réelle n'est jamais masquée par une observation
  lots.forEach(lot => placeLot(lot, resolveEvalIds(lot), false));
  lots.forEach(lot => placeLot(lot, resolveObsIds(lot), true));
}

// Jours ouvrés couverts par une UO, avec leur poids : le dernier porte la fraction (1,5 j = 1 + 0,5).
// Les jours fériés comptent comme ouvrés, seuls les week-ends sont sautés.
function uoDays(lot) {
  if (!lot.dateDebut || lot.jours <= 0) return [];
  if (lot.jours < 1) return isWeekendDate(lot.dateDebut) ? [] : [{ ds: toDateStr(lot.dateDebut), w: lot.jours }];
  const out = [];
  let cur = new Date(lot.dateDebut), counted = 0, guard = 0;
  while (counted < lot.jours && guard++ < 500) {
    if (!isWeekendDate(cur)) {
      out.push({ ds: toDateStr(cur), w: Math.min(1, lot.jours - counted) });
      counted++;
    }
    cur = addDays(cur, 1);
  }
  return out;
}

function isWeekendDate(d) { const dow = d.getUTCDay(); return dow === 0 || dow === 6; }

function placeLot(lot, ids, isObs) {
  if (!ids.length) return;
  const days = uoDays(lot);
  const isHalf = lot.jours < 1; // demi-journée (ex. 0.5 j)

  ids.forEach(eid => {
    if (!planMap.has(eid)) planMap.set(eid, new Map());
    const em = planMap.get(eid);
    const slot = { lot, isObs, eid };

    days.forEach(({ ds }) => {
      const existing = em.get(ds);
      if (!existing) em.set(ds, [slot]);  // premier lot de la case gagne
      else if (isHalf && existing.length === 1 && existing[0].lot.jours < 1) {
        em.set(ds, [existing[0], slot]);  // deuxième demi-journée (droite)
      }
      // Si la case est déjà pleine (journée entière ou 2 demi-j), on ignore
    });
  });
}

// ── Date utilities ─────────────────────────────────────────────────────────

function toDateStr(d) {
  const y = d.getUTCFullYear(), m = d.getUTCMonth() + 1, day = d.getUTCDate();
  return `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}

function addDays(d, n) {
  return new Date(d.getTime() + n * 86400_000);
}

// Meeus/Jones/Butcher algorithm for Easter Sunday
function easterUTC(year) {
  const a = year % 19, b = Math.floor(year / 100), c = year % 100;
  const d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day   = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(Date.UTC(year, month - 1, day));
}

function frenchHolidays(year) {
  const set = new Set();
  const easter = easterUTC(year);
  const push = d => set.add(toDateStr(d));
  // Fixed
  push(new Date(Date.UTC(year, 0,  1)));  // Nouvel an
  push(new Date(Date.UTC(year, 4,  1)));  // Fête du travail
  push(new Date(Date.UTC(year, 4,  8)));  // Victoire 1945
  push(new Date(Date.UTC(year, 6, 14)));  // Fête nationale
  push(new Date(Date.UTC(year, 7, 15)));  // Assomption
  push(new Date(Date.UTC(year, 10, 1)));  // Toussaint
  push(new Date(Date.UTC(year, 10,11)));  // Armistice
  push(new Date(Date.UTC(year, 11,25)));  // Noël
  // Mobile (Easter-based)
  push(addDays(easter,  1));  // Lundi de Pâques
  push(addDays(easter, 39));  // Ascension (jeudi)
  push(addDays(easter, 50));  // Lundi de Pentecôte
  return set;
}

function isoWeekNumber(d) {
  const tmp = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  const day = tmp.getUTCDay() || 7;
  tmp.setUTCDate(tmp.getUTCDate() + 4 - day);
  const jan1 = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
  return Math.ceil((((tmp - jan1) / 86400_000) + 1) / 7);
}

// ── Period helpers ─────────────────────────────────────────────────────────

function periodDays() {
  let start, end;
  if (viewMode === 'year') {
    start = new Date(Date.UTC(viewYear, 0,  1));
    end   = new Date(Date.UTC(viewYear, 11, 31));
  } else if (viewMode === 'quarter') {
    const qm = viewQuarter * 3;
    start = new Date(Date.UTC(viewYear, qm,   1));
    end   = new Date(Date.UTC(viewYear, qm+3, 0));
  } else {
    start = new Date(Date.UTC(viewYear, viewMonth, 1));
    end   = new Date(Date.UTC(viewYear, viewMonth + 1, 0));
  }
  const days = [];
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) days.push(new Date(d));
  return days;
}

function updatePeriodLabel() {
  const el = document.getElementById('period-label');
  if (viewMode === 'year') {
    el.textContent = String(viewYear);
  } else if (viewMode === 'quarter') {
    el.textContent = `T${viewQuarter + 1} ${viewYear}`;
  } else {
    el.textContent = `${MONTHS_FR[viewMonth].slice(0,4)}. ${viewYear}`;
  }
}

function navigate(dir) {
  recenter = true;
  if (viewMode === 'year') {
    viewYear += dir;
  } else if (viewMode === 'quarter') {
    viewQuarter += dir;
    if (viewQuarter > 3) { viewQuarter = 0; viewYear++; }
    if (viewQuarter < 0) { viewQuarter = 3; viewYear--; }
  } else {
    viewMonth += dir;
    if (viewMonth > 11) { viewMonth = 0;  viewYear++; }
    if (viewMonth <  0) { viewMonth = 11; viewYear--; }
  }
  render();
}

function setViewMode(mode) {
  recenter = true;
  viewMode = mode;
  render();
}

// ── Programme colour helper ────────────────────────────────────────────────

function progColor(programme) {
  if (!programme) return PROG_COLORS.DEFAULT;
  const up = programme.toUpperCase();
  for (const key of Object.keys(PROG_COLORS)) {
    if (up.includes(key)) return PROG_COLORS[key];
  }
  return PROG_COLORS.DEFAULT;
}

function progLabel(programme) {
  if (!programme) return '?';
  const up = programme.toUpperCase();
  for (const key of Object.keys(PROG_COLORS)) {
    if (up.includes(key)) return key === 'SECNUMCLOUD' ? 'SNC' : key;
  }
  return programme.slice(0, 4).toUpperCase();
}

function planEvalIcon(planEval) {
  if (!planEval) return '';
  const v = planEval.toLowerCase();
  if (v.includes('lancement'))          return '👥';
  if (v.includes('documentaire'))       return '📄';
  if (v.includes('siège') || v.includes('siege')) return '🏢';
  if (v.includes('prestation') || v.includes('témoin') || v.includes('temoin')) return '👨‍🏫';
  if (v.includes('clôture') || v.includes('cloture')) return '🔒';
  if (v.includes('rapport'))            return '✏️';
  if (v.includes('soutenance') || v.includes('anssi')) return '🇫🇷';
  if (v.includes("plan d'évaluation") || v.includes("plan d'evaluation")) return '📅';
  if (v.includes('planif'))             return '💻';
  return '';
}

// ── Render ─────────────────────────────────────────────────────────────────

function render() {
  updatePeriodLabel();
  const wrapper = document.getElementById('table-wrapper');

  if (!evaluateurs.length && !lots.length) {
    wrapper.innerHTML = `
      <div class="placeholder">
        <span>Aucune donnée disponible</span>
        <small>Liez ce widget à la table Unites_d_oeuvre dans Grist</small>
      </div>`;
    return;
  }

  const days = periodDays();
  if (!days.length) return;

  // Date du jour en UTC (insensible au fuseau)
  const now = new Date();
  const todayStr = toDateStr(new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate())));

  // Pre-compute holidays for all years in view
  const years = new Set(days.map(d => d.getUTCFullYear()));
  const holidays = new Set();
  years.forEach(y => frenchHolidays(y).forEach(ds => holidays.add(ds)));

  // Sort evaluateurs: Certi-Trust first, then external; alphabetically within group
  const isCT  = ev => /certi.?trust/i.test(ev.employeur);
  const label  = ev => ev.trigramme || `${ev.prenom} ${ev.nom}`.trim() || `#${ev.id}`;
  const byLabel = (a, b) => label(a).localeCompare(label(b), 'fr');

  const ctEvals  = evaluateurs.filter(isCT).sort(byLabel);
  const extEvals = evaluateurs.filter(e => !isCT(e)).sort(byLabel);
  const evals    = [...ctEvals, ...extEvals];

  // Build table
  const table = document.createElement('table');
  table.id = 'planning-table';

  // ── thead ──────────────────────────────────────────────────────────────

  const thead = document.createElement('thead');

  // Row 1: evaluator names
  const tr1 = document.createElement('tr');
  addTh(tr1, 'Date', 'corner');
  evals.forEach((ev, i) => {
    const th = addTh(tr1, label(ev));
    th.title = `${ev.prenom} ${ev.nom}`.trim() + (ev.employeur ? ` — ${ev.employeur}` : '');
    if (i === ctEvals.length && extEvals.length) th.classList.add('sep-left');
  });
  thead.appendChild(tr1);

  // Row 2: mois courant (mis à jour au scroll)
  const tr2 = document.createElement('tr');
  const cornerTh2 = addTh(tr2, '', 'corner');
  const monthLabelTh = document.createElement('th');
  monthLabelTh.id = 'sticky-month-label';
  monthLabelTh.colSpan = evals.length;
  monthLabelTh.textContent = ''; // rempli après insertion
  tr2.appendChild(monthLabelTh);
  thead.appendChild(tr2);
  table.appendChild(thead);

  // ── tbody ──────────────────────────────────────────────────────────────

  const tbody   = document.createElement('tbody');
  let lastMonth = -1;

  days.forEach(day => {
    const ds     = toDateStr(day);
    const dow    = day.getUTCDay();         // 0=Sun … 6=Sat
    const month  = day.getUTCMonth();
    const week   = isoWeekNumber(day);
    const isWE   = dow === 0 || dow === 6;
    const isHoli = holidays.has(ds);

    // Month separator row (même structure 2 colonnes que le sticky month)
    if (month !== lastMonth) {
      const tr = document.createElement('tr');
      tr.className = 'row-month';
      const dateTd = document.createElement('td');
      dateTd.className = 'day-label';
      tr.appendChild(dateTd);
      const textTd = document.createElement('td');
      textTd.colSpan = evals.length;
      textTd.textContent = `${MONTHS_FR[month].toUpperCase()} ${day.getUTCFullYear()}`;
      tr.appendChild(textTd);
      tbody.appendChild(tr);
      lastMonth = month;
    }

    // Day row
    const isToday = ds === todayStr;
    const tr = document.createElement('tr');
    tr.className = 'row-day'
      + (isWE    ? ' row-weekend' : '')
      + (isHoli  ? ' row-holiday' : '')
      + (isToday ? ' row-today'   : '');
    tr.dataset.date = ds;

    const labelTd = document.createElement('td');
    labelTd.className = 'day-label';
    // Lundi : ajouter le numéro de semaine dans la même case
    if (dow === 1) {
      labelTd.innerHTML = `<span class="week-num">S${week}</span>${DAYS_FR[dow]} ${day.getUTCDate()}`;
    } else {
      labelTd.textContent = `${DAYS_FR[dow]} ${day.getUTCDate()}`;
    }
    if (isHoli) labelTd.title = ds;
    tr.appendChild(labelTd);

    // Evaluator cells
    evals.forEach((ev, i) => {
      const td = document.createElement('td');
      if (i === ctEvals.length && extEvals.length) td.classList.add('sep-left');
      td.dataset.ev = ev.id;
      td.dataset.date = ds;
      if (!isWE) td.classList.add('cell-edit');

      const slots = !isWE ? planMap.get(ev.id)?.get(ds) : undefined;
      const orals = oralMap.get(ev.id)?.get(ds);
      const row = document.createElement('div');
      row.className = 'cell-row';
      if (slots?.length) {
        if (slots.length === 1 && slots[0].lot.jours >= 1) {
          // Case pleine
          row.appendChild(makeLotCell(slots[0], false));
        } else {
          // Une ou deux demi-journées : wrapper flex
          const wrap = document.createElement('div');
          wrap.className = 'lot-wrap';
          slots.forEach((slot, idx) => {
            const cell = makeLotCell(slot, true);
            if (idx > 0) cell.style.borderLeft = '1px solid #d1d5db';
            wrap.appendChild(cell);
          });
          row.appendChild(wrap);
        }
      }
      if (orals?.length) row.appendChild(makeOralBadge(orals));
      if (row.childNodes.length) td.appendChild(row);
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);

  const keepScroll = !recenter && wrapper.querySelector('#planning-table')
    ? { top: wrapper.scrollTop, left: wrapper.scrollLeft } : null;
  recenter = false;
  renderedDays  = days.map(toDateStr);
  renderedEvals = evals.map(e => e.id);

  wrapper.innerHTML = '';
  wrapper.appendChild(table);
  paintSelection();

  // Centrer la vue sur aujourd'hui si la date est dans la période affichée ;
  // après une écriture (onRecords), on garde la position de l'utilisateur.
  const todayRow = wrapper.querySelector(`tr[data-date="${todayStr}"]`);
  requestAnimationFrame(() => {
    if (keepScroll) {
      wrapper.scrollTop = keepScroll.top;
      wrapper.scrollLeft = keepScroll.left;
    } else if (todayRow) {
      const rowTop      = todayRow.offsetTop;
      const rowH        = todayRow.offsetHeight;
      const visibleH    = wrapper.clientHeight;
      const scrollTarget = rowTop - visibleH / 2 + rowH / 2;
      wrapper.scrollTop  = Math.max(0, scrollTarget);
    }
    onPlanningScroll(); // initialise le label mois collant
  });

  const lotCount      = lots.length;
  const evalCount     = evals.length;
  const lotsAvecEval  = lots.filter(l => l.evalIds.length > 0).length;
  const lotsAvecDate  = lots.filter(l => l.dateDebut).length;

  const lotsResolus = lots.filter(l => resolveEvalIds(l).length > 0).length;
  const lotsTetra = lots.filter(l => l.tetra).length;
  const lotsObs   = lots.filter(l => resolveObsIds(l).length > 0).length;
  const prefix = pendingStatus ? pendingStatus + ' · ' : '';
  pendingStatus = '';
  showStatus(`${prefix}${lotCount} lot(s) dont ${lotsResolus} placés, ${lotsTetra} avec tetra, ${lotsObs} avec OBS · ${countOraux()} affectation(s) d'oral · ${evalCount} évaluateur(s) (${ctEvals.length} CT, ${extEvals.length} ext) · ${days.length} jours`);
}

// ── DOM helpers ────────────────────────────────────────────────────────────

function makeLotCell({ lot, isObs }, isHalf) {
  const color = progColor(lot.programme);
  const icon  = planEvalIcon(lot.planEval);
  const cell  = document.createElement('div');
  cell.className = 'lot-cell' + (isHalf ? ' lot-cell-half' : '') + (isObs ? ' lot-obs' : '');
  cell.dataset.uo = lot.id;
  if (lot.uo) cell.draggable = true;
  const titleParts = [`${lot.denomination} — ${lot.programme || '?'} (${lot.jours} j)`];
  if (lot.planEval) titleParts.push(lot.planEval);
  if (isObs) titleParts.push('Observateur');
  cell.title = titleParts.join('\n');
  if (!isObs) cell.style.background = color + '28';
  cell.style.borderLeftColor = color;
  const name = lot.tetra || lot.denomination;
  const client = document.createElement('span');
  client.className = 'lot-client';
  client.textContent = icon ? `${icon} ${name}` : name;
  cell.appendChild(client);
  return cell;
}

const ORAL_MAX_ICONS = 6;

function countOraux() {
  let n = 0;
  oralMap.forEach(em => em.forEach(list => { n += list.length; }));
  return n;
}

function makeOralBadge(orals) {
  const span = document.createElement('span');
  span.className = 'oral-badge';
  span.textContent = orals.length <= ORAL_MAX_ICONS
    ? '🧐'.repeat(orals.length)
    : '🧐'.repeat(ORAL_MAX_ICONS - 1) + `+${orals.length - ORAL_MAX_ICONS + 1}`;
  span.title = `${orals.length} examen(s) oral(aux)\n`
    + orals.map(o => [o.heure, o.tetra].filter(Boolean).join(' — ') || 'Oral').join('\n');
  return span;
}

function addTh(tr, text, className) {
  const th = document.createElement('th');
  th.textContent = text;
  if (className) th.className = className;
  tr.appendChild(th);
  return th;
}

function showStatus(msg, type = '') {
  const bar = document.getElementById('statusbar');
  bar.textContent = msg;
  bar.className = 'statusbar' + (type ? ` ${type}` : '');
}

// ── Édition des cases ──────────────────────────────────────────────────────
// Une case = un jour × un évaluateur, indépendante des autres jours et personnes
// de la même UO : l'éditer peut donc découper une UO multi-jours ou multi-personnes.

const ROLES        = ['RE', 'ETA', 'ETM', 'OBS'];
const STATUTS_CLOS = new Set(['Terminé', 'Annulé']);
const DUREES       = [1, 0.75, 0.5, 0.25];

let recenter      = true;   // recentrer sur aujourd'hui au prochain rendu
let renderedDays  = [];
let renderedEvals = [];
let pendingStatus = '';     // message d'écriture affiché après le rendu déclenché par onRecords
let sel     = null;         // { eid, ds, uoId }
let clip    = null;         // créneau copié (Ctrl+C)
let dragSrc = null;         // { slot, ds }
let writing = false;
let popEval = null;

const $ = id => document.getElementById(id);
const L = ids => ['L', ...ids];
const secOf = ds => Date.UTC(+ds.slice(0, 4), +ds.slice(5, 7) - 1, +ds.slice(8, 10)) / 1000;
const isWeekendStr = ds => isWeekendDate(new Date(ds + 'T00:00:00Z'));
const slotsAt = (eid, ds) => planMap.get(eid)?.get(ds) ?? [];

function selectedSlot() {
  if (!sel) return null;
  const slots = slotsAt(sel.eid, sel.ds);
  return slots.find(s => s.lot.id === sel.uoId) ?? slots[0] ?? null;
}

// Fonctionne sur une UO comme sur une évaluation (mêmes champs RE, ETA, ETM, OBS)
function roleOf(x, eid) {
  if (x.RE === eid) return 'RE';
  for (const r of ['ETA', 'ETM', 'OBS']) if (x[r].includes(eid)) return r;
  return null;
}

function defaultRole(evaluationId, eid) {
  const ev = evalInfo.get(evaluationId);
  return (ev && roleOf(ev, eid)) || 'ETM';
}

const people   = uo => new Set([uo.RE, ...uo.ETA, ...uo.ETM, ...uo.OBS].filter(Boolean));
const editable = s => Boolean(s?.lot.uo && roleOf(s.lot.uo, s.eid));
const isSingle = lot => people(lot.uo).size <= 1 && uoDays(lot).length === 1;
const dayWeight = (lot, ds) => uoDays(lot).find(d => d.ds === ds)?.w ?? 1;

// Unites_d_oeuvre.evaluateurs est une formule (RE + ETA + ETM) : on n'écrit que les rôles.
// RE est une Ref simple, les autres des RefList.
function roleFields(role, eid) {
  return {
    RE:  role === 'RE' ? eid : 0,
    ETA: L(role === 'ETA' ? [eid] : []),
    ETM: L(role === 'ETM' ? [eid] : []),
    OBS: L(role === 'OBS' ? [eid] : []),
  };
}

const uoRoleFields = uo => ({ RE: uo.RE || 0, ETA: L(uo.ETA), ETM: L(uo.ETM), OBS: L(uo.OBS) });

function withoutPerson(uo, eid) {
  return {
    RE:  uo.RE === eid ? 0 : (uo.RE || 0),
    ETA: L(uo.ETA.filter(x => x !== eid)),
    ETM: L(uo.ETM.filter(x => x !== eid)),
    OBS: L(uo.OBS.filter(x => x !== eid)),
  };
}

function nextWorkingDay(ds) {
  let d = addDays(new Date(ds + 'T00:00:00Z'), 1);
  while (isWeekendDate(d)) d = addDays(d, 1);
  return toDateStr(d);
}

// Regroupe des jours en suites de jours ouvrés consécutifs → [{ ds, jours }]
function splitRuns(days) {
  const runs = [];
  days.forEach(d => {
    const last = runs[runs.length - 1];
    if (last && nextWorkingDay(last[last.length - 1].ds) === d.ds) last.push(d);
    else runs.push([d]);
  });
  return runs.map(r => ({ ds: r[0].ds, jours: r.reduce((n, d) => n + d.w, 0) }));
}

// Retire le jour ds pour l'évaluateur eid ; les autres jours et personnes de l'UO restent intacts.
function removeDayActions(lot, eid, ds) {
  const uo   = lot.uo;
  const runs = splitRuns(uoDays(lot).filter(d => d.ds !== ds));
  const copy = (r, roles) => ['AddRecord', T_UO, null, {
    Evaluation: uo.evaluation, Unite_d_oeuvre: uo.type, ...uo.extra,
    date_debut_incluse: secOf(r.ds), Jours: r.jours, ...roles,
  }];
  if (people(uo).size <= 1) {
    if (!runs.length) return [['RemoveRecord', T_UO, lot.id]];
    return [
      ['UpdateRecord', T_UO, lot.id, { date_debut_incluse: secOf(runs[0].ds), Jours: runs[0].jours }],
      ...runs.slice(1).map(r => copy(r, uoRoleFields(uo))),
    ];
  }
  const role = roleOf(uo, eid);
  return [
    ['UpdateRecord', T_UO, lot.id, withoutPerson(uo, eid)],
    ...runs.map(r => copy(r, roleFields(role, eid))),
  ];
}

function newUoAction(vals, eid, ds, extra = {}) {
  return ['AddRecord', T_UO, null, {
    Evaluation: vals.evaluation, Unite_d_oeuvre: vals.type, ...extra,
    date_debut_incluse: secOf(ds), Jours: vals.w, ...roleFields(vals.role, eid),
  }];
}

// Renvoie la raison du refus, ou '' si la case peut accueillir w jour(s)
function fits(eid, ds, w, ignoreUoId = null) {
  if (isWeekendStr(ds)) return 'week-end';
  const slots = slotsAt(eid, ds).filter(s => s.lot.id !== ignoreUoId);
  const load  = slots.reduce((n, s) => n + (s.lot.jours < 1 ? s.lot.jours : 1), 0);
  if (slots.length >= 2 || load + w > 1 + 1e-9) return 'case déjà pleine';
  return '';
}

async function apply(actions, msg) {
  if (!actions.length || writing) return;
  writing = true;
  showStatus('Enregistrement…');
  try {
    await grist.docApi.applyUserActions(actions); // un seul lot d'actions : un seul Ctrl+Z dans Grist
    pendingStatus = msg;
    showStatus(msg);
  } catch (e) {
    showStatus("Échec de l'enregistrement : " + (e.message || e), 'error');
  } finally {
    writing = false;
  }
}

function refuse(msg) { showStatus(msg, 'error'); }

const NOT_EDITABLE = "UO non modifiable : l'évaluateur n'est dans aucun rôle RE/ETA/ETM/OBS de l'UO";

async function deleteSelected() {
  const s = selectedSlot();
  if (!s) return;
  if (!editable(s)) return refuse(NOT_EDITABLE);
  await apply(removeDayActions(s.lot, s.eid, sel.ds), 'Journée retirée');
}

function specOf(slot, ds) {
  const uo = slot.lot.uo;
  return { evaluation: uo.evaluation, type: uo.type, extra: uo.extra,
           w: dayWeight(slot.lot, ds), role: roleOf(uo, slot.eid), eid: slot.eid };
}

async function copyTo(spec, eid, ds) {
  const why = fits(eid, ds, spec.w);
  if (why) return refuse(`Impossible : ${why}`);
  const role = eid === spec.eid ? spec.role : defaultRole(spec.evaluation, eid);
  await apply([newUoAction({ ...spec, role }, eid, ds, spec.extra)], 'Journée copiée');
}

async function moveTo(slot, srcDs, eid, ds) {
  const lot = slot.lot;
  const whole = isSingle(lot);
  const spec = specOf(slot, srcDs);
  const why = fits(eid, ds, spec.w, whole ? lot.id : null);
  if (why) return refuse(`Impossible : ${why}`);
  const role = eid === slot.eid ? spec.role : defaultRole(spec.evaluation, eid);
  if (whole) {
    const f = { date_debut_incluse: secOf(ds) };
    if (eid !== slot.eid) Object.assign(f, roleFields(role, eid));
    return apply([['UpdateRecord', T_UO, lot.id, f]], 'UO déplacée');
  }
  await apply([...removeDayActions(lot, slot.eid, srcDs),
               newUoAction({ ...spec, role }, eid, ds, spec.extra)], 'Journée déplacée');
}

// ── Sélection ──

function paintSelection() {
  document.querySelectorAll('.cell-sel, .slot-sel').forEach(e => e.classList.remove('cell-sel', 'slot-sel'));
  if (!sel) return;
  const td = document.querySelector(`td[data-ev="${sel.eid}"][data-date="${sel.ds}"]`);
  if (!td) return;
  td.classList.add('cell-sel');
  const s = selectedSlot();
  if (s && slotsAt(sel.eid, sel.ds).length > 1) {
    td.querySelector(`.lot-cell[data-uo="${s.lot.id}"]`)?.classList.add('slot-sel');
  }
}

function moveSelection(dr, dc) {
  const r = Math.max(0, Math.min(renderedDays.length - 1, renderedDays.indexOf(sel.ds) + dr));
  const c = Math.max(0, Math.min(renderedEvals.length - 1, renderedEvals.indexOf(sel.eid) + dc));
  sel = { eid: renderedEvals[c], ds: renderedDays[r], uoId: null };
  paintSelection();
  document.querySelector('td.cell-sel')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// ── Fenêtre d'édition ──

const popOpen = () => $('pop').classList.contains('on');

function evalLabel(e) { return [e.tetra || e.client || '?', e.prog].filter(Boolean).join(' · '); }

function renderOptions() {
  const q = $('pop-q').value.trim().toLowerCase();
  const list = [...evalInfo.values()]
    .filter(e => !STATUTS_CLOS.has(e.statut) && !e.terminee)
    .filter(e => !q || `${e.tetra} ${e.client} ${e.prog} ${e.libelle}`.toLowerCase().includes(q))
    .sort((a, b) => evalLabel(a).localeCompare(evalLabel(b), 'fr'))
    .slice(0, 80);
  if (popEval && !list.some(e => e.id === popEval) && evalInfo.has(popEval)) list.unshift(evalInfo.get(popEval));
  const box = $('pop-opts');
  box.innerHTML = '';
  list.forEach(e => {
    const o = document.createElement('div');
    o.className = 'opt' + (e.id === popEval ? ' on' : '');
    o.dataset.evid = e.id;
    o.style.borderLeftColor = progColor(e.prog);
    o.textContent = evalLabel(e);
    const small = document.createElement('small');
    small.textContent = [e.libelle, e.statut].filter(Boolean).join(' — ');
    o.appendChild(small);
    box.appendChild(o);
  });
  if (!list.length) box.innerHTML = '<div class="opt">Aucune évaluation trouvée.</div>';
}

function pickEval(id) {
  popEval = id;
  // Sur une case vide, le rôle suit celui de la personne sur l'évaluation choisie
  if (!selectedSlot()) $('pop-role').value = defaultRole(id, sel.eid);
  renderOptions();
  $('pop-opts').querySelector('.opt.on')?.scrollIntoView({ block: 'nearest' });
}

function fillSelect(el, values, current, labelOf = v => v) {
  const vals = [...values];
  if (current !== '' && current != null && !vals.includes(current)) vals.unshift(current);
  el.innerHTML = '';
  vals.forEach(v => el.add(new Option(labelOf(v), v)));
  el.value = current ?? '';
}

function openEditor() {
  if (!sel || isWeekendStr(sel.ds)) return;
  const s = selectedSlot();
  if (s && !editable(s)) return refuse(NOT_EDITABLE);
  popEval = s?.lot.uo.evaluation || null;
  const ev = evaluateurs.find(e => e.id === sel.eid);
  const [y, m, d] = sel.ds.split('-');
  $('pop-hd').textContent = `${ev ? (ev.trigramme || `${ev.prenom} ${ev.nom}`.trim()) : '#' + sel.eid}`
    + ` — ${DAYS_FR[new Date(sel.ds + 'T00:00:00Z').getUTCDay()]} ${d}/${m}/${y}`
    + (s ? '' : ' (nouvelle UO)');
  $('pop-q').value = '';
  fillSelect($('pop-type'), ['', ...uoChoices], s?.lot.uo.type ?? '', v => v || "— unité d'œuvre —");
  fillSelect($('pop-role'), ROLES, s ? roleOf(s.lot.uo, s.eid) : (popEval ? defaultRole(popEval, sel.eid) : 'ETM'));
  const w = s ? dayWeight(s.lot, sel.ds) : 1;
  fillSelect($('pop-duree'), DUREES.map(String), String(w), v => `${String(v).replace('.', ',')} j`);
  $('pop-clear').disabled = !s;
  $('pop-err').textContent = '';
  renderOptions();

  const pop = $('pop');
  const td  = document.querySelector('td.cell-sel');
  const r   = td ? td.getBoundingClientRect() : { left: 100, top: 100, bottom: 100 };
  pop.classList.add('on');
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  pop.style.left = Math.max(4, Math.min(r.left, innerWidth - pw - 4)) + 'px';
  pop.style.top  = (r.bottom + ph + 4 < innerHeight ? r.bottom + 2 : Math.max(4, r.top - ph - 2)) + 'px';
  $('pop-q').focus();
}

function closeEditor() { $('pop').classList.remove('on'); }

async function validateEditor() {
  if (!popEval) {
    const first = $('pop-opts').querySelector('.opt[data-evid]');
    if (first) popEval = +first.dataset.evid;
  }
  const type = $('pop-type').value;
  if (!popEval) { $('pop-err').textContent = 'Choisir une évaluation.'; return; }
  if (!type)    { $('pop-err').textContent = "Choisir une unité d'œuvre."; return; }
  const vals = { evaluation: popEval, type, role: $('pop-role').value, w: +$('pop-duree').value };
  const s = selectedSlot();
  const { eid, ds } = sel;
  const why = fits(eid, ds, vals.w, s?.lot.id ?? null);
  if (why) { $('pop-err').textContent = `Impossible : ${why}.`; return; }
  closeEditor();
  if (!s) return apply([newUoAction(vals, eid, ds)], 'UO créée');
  if (isSingle(s.lot)) {
    return apply([['UpdateRecord', T_UO, s.lot.id, {
      Evaluation: vals.evaluation, Unite_d_oeuvre: vals.type, Jours: vals.w, ...roleFields(vals.role, eid),
    }]], 'UO modifiée');
  }
  // UO multi-jours ou multi-personnes : on détache ce jour pour cette personne
  const extra = vals.evaluation === s.lot.uo.evaluation ? s.lot.uo.extra : {};
  await apply([...removeDayActions(s.lot, eid, ds), newUoAction(vals, eid, ds, extra)], 'Journée modifiée');
}

$('pop-q').addEventListener('input', () => { popEval = null; renderOptions(); });
$('pop-opts').addEventListener('click', ev => {
  const o = ev.target.closest('.opt[data-evid]');
  if (o) pickEval(+o.dataset.evid);
});
$('pop-opts').addEventListener('dblclick', ev => { if (ev.target.closest('.opt[data-evid]')) validateEditor(); });
$('pop-ok').addEventListener('click', validateEditor);
$('pop-cancel').addEventListener('click', closeEditor);
$('pop-clear').addEventListener('click', async () => { closeEditor(); await deleteSelected(); });
document.addEventListener('mousedown', ev => {
  if (popOpen() && !ev.target.closest('#pop')) closeEditor();
});

// ── Souris ──

const gridWrap = $('table-wrapper');

gridWrap.addEventListener('click', ev => {
  const td = ev.target.closest('td[data-ev]');
  if (!td) return;
  sel = { eid: +td.dataset.ev, ds: td.dataset.date, uoId: +ev.target.closest('.lot-cell')?.dataset.uo || null };
  paintSelection();
});
gridWrap.addEventListener('dblclick', ev => { if (ev.target.closest('td[data-ev]')) openEditor(); });

gridWrap.addEventListener('dragstart', ev => {
  const cell = ev.target.closest?.('.lot-cell');
  const td   = cell?.closest('td[data-ev]');
  if (!td) return;
  const slot = slotsAt(+td.dataset.ev, td.dataset.date).find(s => s.lot.id === +cell.dataset.uo);
  if (!editable(slot)) { ev.preventDefault(); return; }
  dragSrc = { slot, ds: td.dataset.date };
  ev.dataTransfer.effectAllowed = 'copyMove';
  ev.dataTransfer.setData('text/plain', String(slot.lot.id));
});
const clearDrop = () => document.querySelectorAll('td.drop').forEach(td => td.classList.remove('drop'));
gridWrap.addEventListener('dragover', ev => {
  const td = ev.target.closest('td.cell-edit');
  if (!dragSrc || !td) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = ev.altKey ? 'copy' : 'move';
  if (!td.classList.contains('drop')) { clearDrop(); td.classList.add('drop'); }
});
gridWrap.addEventListener('drop', async ev => {
  const td = ev.target.closest('td.cell-edit');
  clearDrop();
  if (!dragSrc || !td) return;
  ev.preventDefault();
  const { slot, ds: srcDs } = dragSrc;
  dragSrc = null;
  const eid = +td.dataset.ev, ds = td.dataset.date;
  if (eid === slot.eid && ds === srcDs) return;
  sel = { eid, ds, uoId: null };
  paintSelection();
  if (ev.altKey) await copyTo(specOf(slot, srcDs), eid, ds);
  else await moveTo(slot, srcDs, eid, ds);
});
gridWrap.addEventListener('dragend', () => { dragSrc = null; clearDrop(); });

// ── Clavier ──

document.addEventListener('keydown', async ev => {
  if (popOpen()) {
    if (ev.key === 'Escape') { ev.preventDefault(); closeEditor(); }
    else if (ev.key === 'Enter' && !ev.target.matches('select')) { ev.preventDefault(); await validateEditor(); }
    else if ((ev.key === 'ArrowDown' || ev.key === 'ArrowUp') && ev.target.id === 'pop-q') {
      ev.preventDefault();
      const opts = [...$('pop-opts').querySelectorAll('.opt[data-evid]')];
      let i = opts.findIndex(o => +o.dataset.evid === popEval);
      i = Math.max(0, Math.min(opts.length - 1, i + (ev.key === 'ArrowDown' ? 1 : -1)));
      if (opts[i]) pickEval(+opts[i].dataset.evid);
    }
    return;
  }
  if (ev.target.matches('input, select, textarea') || !sel) return;
  const mod = ev.ctrlKey || ev.metaKey;
  const arrows = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  if (ev.key === 'Escape') { sel = null; paintSelection(); }
  else if (ev.key === 'Enter' || ev.key === 'F2') { ev.preventDefault(); openEditor(); }
  else if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); await deleteSelected(); }
  else if (mod && ev.key.toLowerCase() === 'c') {
    const s = selectedSlot();
    if (!s) return;
    if (!editable(s)) return refuse(NOT_EDITABLE);
    clip = specOf(s, sel.ds);
    showStatus('Case copiée : Ctrl+V pour la coller');
    ev.preventDefault();
  } else if (mod && ev.key.toLowerCase() === 'v' && clip) {
    ev.preventDefault();
    await copyTo(clip, sel.eid, sel.ds);
  } else if (arrows[ev.key]) {
    ev.preventDefault();
    moveSelection(...arrows[ev.key]);
  }
});

// ── Sticky month label (mise à jour au scroll) ─────────────────────────────

function onPlanningScroll() {
  const wrapper = document.getElementById('table-wrapper');
  const label   = document.getElementById('sticky-month-label');
  if (!label || !wrapper) return;

  // Hauteur cumulée des deux lignes d'en-tête (évaluateurs + mois collant)
  const headerH = 46;
  const threshold = wrapper.getBoundingClientRect().top + headerH;

  let currentText = '';
  wrapper.querySelectorAll('.row-month td').forEach(td => {
    if (td.getBoundingClientRect().top <= threshold) currentText = td.textContent;
  });
  label.textContent = currentText;
}

// Listener unique (pas besoin de le recréer à chaque render)
document.getElementById('table-wrapper').addEventListener('scroll', onPlanningScroll);
</script>
